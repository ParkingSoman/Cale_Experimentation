<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Recap</title>
<style>
:root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#5d6671; --line:#dfe3e8; --accent:#2457d6; --accent-ink:#fff; --ok:#1a7f4b; --warn:#a45a00; --code:#f0f2f5; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2227; --ink:#e8ebee; --mute:#9aa4af; --line:#2f363d; --accent:#6c93ff; --accent-ink:#0d1117; --ok:#4fc58a; --warn:#e5a04a; --code:#12151a; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
h1 { font-size:1.5rem; margin:0; }
h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 8px; }
.sub { color:var(--mute); margin:4px 0 20px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
textarea { width:100%; min-height:200px; resize:vertical; font:inherit; font-size:.95rem; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
textarea:focus-visible, button:focus-visible, .check:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 14px; cursor:pointer; }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
button:disabled { opacity:.55; cursor:default; }
.drop { outline:2px dashed var(--accent); outline-offset:-6px; }
.status { color:var(--mute); min-height:1.5em; }
.error { color:var(--warn); font-weight:600; }
#recap { white-space:pre-wrap; margin:0; min-height:1.5em; }
#recap.live::after { content:"\25CF"; color:var(--accent); margin-left:4px; animation:blink 1s infinite; }
@keyframes blink { 50% { opacity:0; } }
ul.todo { list-style:none; margin:0; padding:0; }
ul.todo li { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
ul.todo li:first-child { border-top:0; }
.check { appearance:auto; width:18px; height:18px; margin-top:4px; accent-color:var(--accent); }
.todo .task { flex:1; }
.todo .who { font-weight:600; }
.todo .due { color:var(--mute); font-size:.9rem; }
.todo li.done .task span { text-decoration:line-through; color:var(--mute); }
footer.stats { display:flex; gap:6px 18px; flex-wrap:wrap; color:var(--mute); font-size:.9rem; }
footer.stats b { color:var(--ink); font-weight:600; }
.met { color:var(--ok); font-weight:600; } .missed { color:var(--warn); font-weight:600; }
pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; font:.82rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; margin:0; }
.hidden { display:none; }
label.toggle { display:flex; gap:6px; align-items:center; cursor:pointer; color:var(--mute); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Meeting Recap</h1>
    <label class="toggle"><input type="checkbox" id="dev"> Developer view</label>
  </header>
  <p class="sub">Paste a transcript or drop a .txt file. The recap streams in, then the action items follow. Everything runs on this computer.</p>

  <section class="card" id="inputCard">
    <h2>Transcript</h2>
    <textarea id="text" placeholder="Paste a meeting transcript here, or drop a .txt file." aria-label="Meeting transcript"></textarea>
    <div class="row">
      <button class="primary" id="go">Write recap</button>
      <button id="sampleBtn" type="button">Use sample</button>
      <button id="stop" type="button" class="hidden">Stop</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="card hidden" id="recapCard">
    <h2>Recap</h2>
    <p id="recap"></p>
  </section>

  <section class="card hidden" id="todoCard">
    <h2>Action items</h2>
    <ul class="todo" id="todo"></ul>
    <p class="status" id="todoMsg"></p>
  </section>

  <footer class="stats hidden" id="stats"></footer>

  <section class="card hidden" id="devCard" style="margin-top:16px">
    <h2>The Cale code this app uses</h2>
    <pre id="devCode">Loading...</pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ctl = null;

// Remember the dark/light-independent choices only for this tab.
$("dev").addEventListener("change", async () => {
  $("devCard").classList.toggle("hidden", !$("dev").checked);
  if ($("dev").checked && $("devCode").textContent === "Loading...") {
    try { $("devCode").textContent = await (await fetch("/api/source")).text(); }
    catch { $("devCode").textContent = "Could not load the source."; }
  }
});

async function loadSample() {
  try { $("text").value = (await (await fetch("/sample")).text()).trim(); setStatus(""); }
  catch { setStatus("Could not load the sample.", true); }
}
$("sampleBtn").onclick = loadSample;
loadSample();

const area = $("inputCard");
for (const ev of ["dragenter", "dragover"]) area.addEventListener(ev, (e) => { e.preventDefault(); area.classList.add("drop"); });
for (const ev of ["dragleave", "drop"]) area.addEventListener(ev, (e) => { e.preventDefault(); area.classList.remove("drop"); });
area.addEventListener("drop", async (e) => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  if (f.size > 1_000_000) return setStatus("That file is too big. Use a .txt under 1 MB.", true);
  $("text").value = (await f.text()).trim();
  setStatus("Loaded " + f.name);
});

function setStatus(msg, bad) { $("status").textContent = msg; $("status").className = "status" + (bad ? " error" : ""); }

function render(items) {
  const ul = $("todo"); ul.textContent = "";
  if (!items.length) { $("todoMsg").textContent = "No action items found."; return; }
  $("todoMsg").textContent = "";
  for (const it of items) {
    const li = document.createElement("li");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "check";
    const id = "i" + Math.random().toString(36).slice(2); cb.id = id;
    cb.onchange = () => li.classList.toggle("done", cb.checked);
    const div = document.createElement("label"); div.className = "task"; div.htmlFor = id;
    const t = document.createElement("span"); t.textContent = it.task;
    const meta = document.createElement("div"); meta.className = "due";
    const who = document.createElement("span"); who.className = "who"; who.textContent = it.owner;
    meta.append(who, " · " + (it.due ? "due " + it.due : "no date"));
    div.append(t, meta); li.append(cb, div); ul.append(li);
  }
}

function stat(label, value) { const s = document.createElement("span"); s.append(label + ": "); const b = document.createElement("b"); b.textContent = value; s.append(b); return s; }

function showStats(d) {
  const f = $("stats"); f.textContent = ""; f.classList.remove("hidden");
  f.append(stat("Size Cale chose", d.size == null ? "not reported" : typeof d.size === "number" ? d.size + "%" : String(d.size)));
  f.append(stat("First word", d.first_s == null ? "n/a" : d.first_s + " s"));
  f.append(stat("Whole time", d.total_s + " s"));
  const g = document.createElement("span"); g.append("Goals: ");
  const m = document.createElement("span");
  const ok = [d.goal_met, d.goal_met_actions].filter((x) => x !== null && x !== undefined);
  if (!ok.length) { m.textContent = "not measured"; }
  else if (ok.every(Boolean)) { m.textContent = "met"; m.className = "met"; }
  else { m.textContent = "not met"; m.className = "missed"; }
  g.append(m); f.append(g);
}

$("stop").onclick = () => ctl?.abort();

$("go").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) return setStatus("Paste a transcript first.", true);
  ctl = new AbortController();
  $("go").disabled = true; $("stop").classList.remove("hidden");
  $("recapCard").classList.remove("hidden"); $("todoCard").classList.add("hidden"); $("stats").classList.add("hidden");
  $("recap").textContent = ""; $("recap").classList.add("live"); $("todo").textContent = "";
  setStatus("Starting...");
  try {
    const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal: ctl.signal });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1]; const dm = /^data: (.*)$/m.exec(block)?.[1];
        if (!ev || !dm) continue;
        handle(ev, JSON.parse(dm));
      }
    }
  } catch (e) {
    if (e.name === "AbortError") setStatus("Stopped.");
    else setStatus("Lost the connection to the app. Is it still running?", true);
  } finally {
    $("recap").classList.remove("live"); $("go").disabled = false; $("stop").classList.add("hidden");
  }
};

function handle(ev, d) {
  if (ev === "status") setStatus(d.message);
  else if (ev === "recap") $("recap").textContent += d.text;
  else if (ev === "recap_done") $("recap").classList.remove("live");
  else if (ev === "actions") { $("todoCard").classList.remove("hidden"); render(d.items); }
  else if (ev === "actions_error") { $("todoCard").classList.remove("hidden"); $("todoMsg").textContent = d.message; }
  else if (ev === "done") { setStatus("Done."); showStats(d); window.lastDone = d; }
  else if (ev === "fail") { setStatus(d.message, true); }
}
</script>
</body>
</html>
