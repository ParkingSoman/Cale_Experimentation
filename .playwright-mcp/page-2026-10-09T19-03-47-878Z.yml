              - listitem [ref=f2e5664]:
                - text: ⭐
                - strong [ref=f2e5665]: Rating scale in multi-model replies.
                - text: The rating scale in the feedback panel is no longer cut off when several models answer side by side, so every score can be picked.
                - link "#26846" [ref=f2e5666] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26846
              - listitem [ref=f2e5670]:
