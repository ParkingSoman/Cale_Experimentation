              - listitem [ref=f2e3226]:
                - text: 🛂
                - strong [ref=f2e3227]: Connecting external accounts.
                - text: Authorizing a tool's external account now completes only for the person who started it, rather than for whoever happens to return with the authorization, and signing out clears the session it relies on.
                - link "Commit" [ref=f2e3228] [cursor=pointer]:
