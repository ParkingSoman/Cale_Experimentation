              - listitem [ref=f2e1927]:
                - text: 👆
                - strong [ref=f2e1928]: Resizing panels by touch.
                - text: The divider beside the main sidebar or a side panel can now be dragged on a touchscreen or with a stylus, and a drag made with the mouse keeps following the pointer when it leaves the window.
                - link "Commit" [ref=f2e1929] [cursor=pointer]:
