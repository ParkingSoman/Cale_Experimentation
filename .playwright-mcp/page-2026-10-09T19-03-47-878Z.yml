                - link "#29263" [ref=f2e2077] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29263
              - listitem [ref=f2e2081]:
                - text: 🧩
                - strong [ref=f2e2082]: Custom automation schedules stay custom.
                - text: Reopening an automation with a custom repeat rule no longer loses the custom rule from the editor.
                - link "#29260" [ref=f2e2083] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29260
              - listitem [ref=f2e2087]:
                - text: 🔢
                - strong [ref=f2e2088]: Accurate admin user counts.
                - text: The counts on the admin Users tabs now follow your search and reset when you switch tabs, instead of showing stale or unfiltered numbers.
                - link "#29080" [ref=f2e2089] [cursor=pointer]:
