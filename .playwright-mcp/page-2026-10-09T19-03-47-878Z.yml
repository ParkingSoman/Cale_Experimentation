                - text: ","
                - link "#27227" [ref=f2e5047] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27227
              - listitem [ref=f2e5051]:
                - text: 💨
                - strong [ref=f2e5052]: Leaner filter handling while streaming.
                - text: Filters applied to a streaming reply no longer re-read their settings and each plugin's full source from the database for every chunk, so responses with filters enabled cost the server far less work.
                - link "#27228" [ref=f2e5053] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27228
