              - listitem [ref=f2e5607]:
                - text: 🎁
                - strong [ref=f2e5608]: Feedback while a download is prepared.
                - text: Downloading a file or folder from the terminal now tells you it is being prepared, will not start the same archive twice if you click again, and reports a failure instead of quietly giving up or leaving a preview spinning.
                - link "#27421" [ref=f2e5609] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27421
                - text: ","
                - link "#27055" [ref=f2e5610] [cursor=pointer]:
