          - generic [ref=f2e239]:
            - heading "v0.11.4" [level=3] [ref=f2e240]
            - generic [ref=f2e241]: Sep 21, 2026
          - generic [ref=f2e242]:
            - generic [ref=f2e243]: added
            - generic [ref=f2e244]:
              - listitem [ref=f2e248]:
                - text: 📉
                - strong [ref=f2e249]: Far smaller slim image.
                - text: A slim build now comes down at around 175 MB, near enough 89% smaller than the last release, the local models, the packages around them and the tools that installed them all gone from it; what that changes about the way an instance behaves is set out under Changed below and in the documentation.
                - link "Commit" [ref=f2e250] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
                - text: ","
                - link "Commit" [ref=f2e251] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d27aa72ab4a7b5632b4ad49e8467081ad3d7ebb4
              - listitem [ref=f2e255]:
                - text: 📦
                - strong [ref=f2e256]: Smaller standard image.
                - text: The image no longer carries a second copy of Python, two sets of fonts nothing ever loaded, packages nothing imports, or the tool that installed them, taking about 170 MB off a standard build.
                - link "#29731" [ref=f2e257] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29731
                - text: ","
                - link "#29723" [ref=f2e258] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29723
                - text: ","
                - link "#29725" [ref=f2e259] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29725
                - text: ","
                - link "#29726" [ref=f2e260] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29726
                - text: ","
                - link "#29728" [ref=f2e261] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29728
                - text: ","
                - link "Commit" [ref=f2e262] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/91f8775b28b52c9ae7f2ab990cf2490bda8055d6
                - text: ","
                - link "Commit" [ref=f2e263] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98fcb844e1b19f7dd6289af26273cdec5447dc52
                - text: ","
                - link "Commit" [ref=f2e264] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/508de20779168003e538bb936b49a31d4a8fb8bb
                - text: ","
                - link "Commit" [ref=f2e265] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a1c02098aa2687c72482a59117efe643b785df51
              - listitem [ref=f2e269]:
                - text: 🧑‍💻
                - strong [ref=f2e270]: Skills from a terminal.
                - text: "Skills a connected terminal server offers now sit beside workspace skills everywhere skills are picked — the \"$\" and \"/\" menus, the integrations menu and the skills panel, each marked Terminal — and are used the same way: picking one puts its instructions, its folder and the files it ships with in front of the model, and a model that was only told a skill exists can open it itself. They follow whichever terminal is selected and clear when that changes."
                - link "Commit" [ref=f2e271] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e69236bccb1e12d14045b09b76ebac0490014851
              - listitem [ref=f2e275]:
                - text: 📔
                - strong [ref=f2e276]: Terminal instructions file.
                - text: A model working with a terminal is now handed the AGENTS.md sitting in that terminal's home directory, read afresh at the start of every turn, so the instructions you keep beside your work reach the model without being pasted in.
                - link "Commit" [ref=f2e277] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/946be432375057dc18dbcc7c3513feb322a83a4b
                - text: ","
                - link "Commit" [ref=f2e278] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f6922a4c4293449805938c80fbe54174994a1fc6
              - listitem [ref=f2e282]:
                - text: 📇
                - strong [ref=f2e283]: Automatic skill discovery.
                - text: Every skill you can reach is now listed to the model by name and description, and the full text of one is loaded only when it decides to use it; before, a skill you had not selected in the message box was invisible to it, and this applies to models with built-in tools on.
                - link "Commit" [ref=f2e284] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e69236bccb1e12d14045b09b76ebac0490014851
              - listitem [ref=f2e288]:
                - text: 🌄
                - strong [ref=f2e289]: Model background images.
                - text: A workspace model can now carry a background image, uploaded in its editor and drawn behind the chat whenever that model is selected, sitting below a folder's own background and above your personal one, and it travels with the model through export and import.
                - link "Commit" [ref=f2e290] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/66addbd6b47bfb25cf9aa37ec70d24db5b28b6b6
              - listitem [ref=f2e294]:
                - text: 📓
                - strong [ref=f2e295]: Skill creation from a chat.
                - text: Typing "/skills:create" in a chat that already has content, with a terminal selected, turns the workflow you just went through into a reusable skill written to ".agents/skills" under that terminal's root working directory rather than whatever folder the shell happens to sit in, and authored to Open WebUI's skill standards.
                - link "Commit" [ref=f2e296] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/113c56fc8c1986359556107a20e206159ca32f59
                - text: ","
                - link "Commit" [ref=f2e297] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/924a4a10fbd0be508a69faf66bf08ac9761bc24d
                - text: ","
                - link "Commit" [ref=f2e298] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/58078ab3045cc7aee409d9215f68adf0e02c9165
                - text: ","
                - link "Commit" [ref=f2e299] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d25f6c7135e0aee93dc2c840ce320d97617a6e47
                - text: ","
                - link "Commit" [ref=f2e300] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a096961a31499be23890b98a040ecf2917405568
              - listitem [ref=f2e304]:
                - text: 🖥️
                - strong [ref=f2e305]: Terminal tabs per command.
                - text: The terminal pane now carries a tab for each command a model is running alongside your own shell, so you can watch them as they go, move between them and take the shell yourself, each tab opening with the command that produced it. Opening the pane puts you in a tab, starting your shell where nothing else is running, and closing the last tab folds the pane away again.
                - link "Commit" [ref=f2e306] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/54a7a7a7ce22725074c29c7e827446f5dce1421c
                - text: ","
                - link "Commit" [ref=f2e307] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f3eade42aead0a3b96ada3a300d6c294c89f74a8
                - text: ","
                - link "Commit" [ref=f2e308] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/de1203f9b5d3d8b2a84bf5c89d1c61542469367a
                - text: ","
                - link "Commit" [ref=f2e309] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/675b9839f17df94f866c871cbdb9881323a18a8a
              - listitem [ref=f2e313]:
                - text: 📂
                - strong [ref=f2e314]: Folder uploads to terminals.
                - text: The file browser beside a terminal takes a folder now, dropped onto it or picked from the Upload Folder entry in its menus, and rebuilds what is inside it as it goes, subfolders and all, where before a drop uploaded only the files sitting loose at the top.
                - link "Commit" [ref=f2e315] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f80ef8bd001d7ef650fb278d6fbd05bea4afad0f
                - text: ","
                - link "Commit" [ref=f2e316] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4cc0d48b4d83503199bcc5f2322881722971a499
                - text: ","
                - link "Commit" [ref=f2e317] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/674760bfc1122e0a19fe299e05a86d1cbb528e6f
              - listitem [ref=f2e321]:
                - text: ⚖️
                - strong [ref=f2e322]: Side-by-side file comparison.
                - text: Picking two files in the file browser lights up a Compare button that lays them side by side or one above the other, numbering the lines, marking what was added and removed down to the part of the line that changed, counting both, and letting you swap which is which or leave whitespace out of it, a choice it remembers; a terminal too old to offer the comparison says so rather than failing quietly.
                - link "Commit" [ref=f2e323] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8556033c6b64fa53e44152ebab1f889a578529af
                - text: ","
                - link "Commit" [ref=f2e324] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3808eace6c2beb1904f0f04fdd443ec544f94acb
              - listitem [ref=f2e328]:
                - text: 🌐
                - strong [ref=f2e329]: Suggested prompts in your language.
                - text: A fresh install now offers its suggested starter prompts in the language the interface is set to, rather than the same four in English for everyone, and the model defaults panel carries a way back to those defaults once its own suggestions have been edited.
                - link "Commit" [ref=f2e330] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/30881dbcc966206cc15fb0b2276b41d88f7c0f09
                - text: ","
                - link "Commit" [ref=f2e331] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9fba2843b16a111b035949f5865e29ec6cf5ac9c
              - listitem [ref=f2e335]:
                - text: 📏
                - strong [ref=f2e336]: Exa result length cap.
                - text: Web search through Exa can be held to a number of characters per result, set beside its key in the admin web search settings or as "EXA_MAX_CONTENT_LENGTH".
                - link "Commit" [ref=f2e337] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/12b14124b9376eccf2ba7cf3dba92bc145493703
              - listitem [ref=f2e341]:
                - text: 🇪🇺
                - strong [ref=f2e342]: European web search option.
                - text: Staan can now be picked as the web search provider, giving deployments that need search inside the EU an option they do not have to host themselves, configured from the admin web search settings or through "STAAN_API_KEY", "STAAN_MARKET" and "STAAN_MAX_SNIPPETS".
                - link "#30138" [ref=f2e343] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30138
                - text: ","
                - link "#26006" [ref=f2e344] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/26006
                - text: ","
                - link "#30303" [ref=f2e345] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30303
                - text: ","
                - link "#30301" [ref=f2e346] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30301
              - listitem [ref=f2e350]:
                - text: 🗣️
                - strong [ref=f2e351]: Per-language names and descriptions.
                - text: A model, tool, skill, function, banner or arena entry can now hold its name, description, starter prompts and valve labels once per language, written in a searchable table in its own editor or brought in as a JSON file, which is refused where a translation drops one of the placeholders the original fills in. The interface shows the wording for the language it is set to, and falls back to the plain text where that language has none.
                - link "Commit" [ref=f2e352] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7b6562e3358956ec71eed05352538a646d047734
                - text: ","
                - link "Commit" [ref=f2e353] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/858ab727d2d80bb3c9ef40f01a32de7a12ca75c9
                - text: ","
                - link "Commit" [ref=f2e354] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3facfa61d413945d7144d26b827fcce1f3aef7c5
                - text: ","
                - link "Commit" [ref=f2e355] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/85b11a4f3504434bd9cd0748629b8a84817fb4f2
              - listitem [ref=f2e359]:
                - text: ✏️
                - strong [ref=f2e360]: Interface text you can reword.
                - text: An administrator can now replace the interface's own wording language by language from a panel in the admin settings, with a replacement refused where it drops one of the placeholders the original fills in.
                - link "Commit" [ref=f2e361] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/67ac1a4e937271a02bfb02a330aa99dc8192cbf4
              - listitem [ref=f2e365]:
                - text: 🔓
                - strong [ref=f2e366]: Turning off the sign-in form.
                - text: The box asking for an email address and a password can now be taken off the sign-in page from the authentication settings, where until now it could only be set before the server started, leaving single sign-on or a directory to sign people in.
                - link "Commit" [ref=f2e367] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c4a349651e34bf5d0920bb5e26707ae9961ac39f
              - listitem [ref=f2e371]:
                - text: 🏷️
                - strong [ref=f2e372]: Custom file metadata.
                - text: Metadata attached to an uploaded file now travels with the pieces that file is split into and arrives with the retrieved sources, the oversized and internal fields left out, and an operator can name in "RAG_SOURCE_METADATA_KEYS" which of those fields the model itself gets to see alongside the text.
                - link "#29499" [ref=f2e373] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29499
                - text: ","
                - link "#29486" [ref=f2e374] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29486
                - text: ","
                - link "Commit" [ref=f2e375] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/894655f66b9563890e63c76090ddecc90a311eb2
                - text: ","
                - link "#29502" [ref=f2e376] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29502
                - text: ","
                - link "#29696" [ref=f2e377] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29696
              - listitem [ref=f2e381]:
                - text: 🗑️
                - strong [ref=f2e382]: Quick delete shortcut.
                - text: Holding Shift over a note in the list or grid, or over a row on the automations page, turns its trailing controls into a delete button, removing the entry in one click rather than the three the menu and its confirmation ask for.
                - link "#29635" [ref=f2e383] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29635
                - text: ","
                - link "#29633" [ref=f2e384] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29633
                - text: ","
                - link "#29640" [ref=f2e385] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29640
                - text: ","
                - link "#29637" [ref=f2e386] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29637
              - listitem [ref=f2e390]:
                - text: 🔀
                - strong [ref=f2e391]: Diffs are drawn as diffs.
                - text: A diff or patch block in a reply is now laid out as one, with the file and hunk headings, the old and new line numbers, and the added and removed lines picked out down to the part of the line that changed, and a button to switch to the plain text and back.
                - link "Commit" [ref=f2e392] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/254e29b9af634145dde0450451a36f0dfbd8f421
              - listitem [ref=f2e396]:
                - text: ✒️
                - strong [ref=f2e397]: A formatting switch for notes.
                - text: "A note you can edit carries a Formatting switch in its menu: turned off, Markdown you type or paste stays as the characters you wrote, a paste keeps its plain text, and a web address is left as text, while formatting already in the note is untouched."
                - link "Commit" [ref=f2e398] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d8f27e745bd31c89efa25cbe0f41bb0f70576fc5
              - listitem [ref=f2e402]:
                - text: 🎛️
                - strong [ref=f2e403]: Admin model list filters.
                - text: The models page in the admin settings can now be narrowed to the base models a connection offers or to the ones built in the workspace, alongside the filters for enabled, disabled, visible and hidden.
                - link "Commit" [ref=f2e404] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9e634c0c56e0a060717f1e24a11b082daf664036
              - listitem [ref=f2e408]:
                - text: 🔍
                - strong [ref=f2e409]: Settings search by name.
                - text: The search box in settings now matches each setting's own name and description rather than a keyword list kept per page, in whichever language you are using and regardless of accents, it leaves out anything your permissions do not let you change, and opening a result no longer clears what you typed.
                - link "Commit" [ref=f2e410] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7cbaabe02fc3c7c040008e82cf85f590bd0c346a
                - text: ","
                - link "Commit" [ref=f2e411] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9d98ffcddf792be8d567ea39370d39fcac649acd
                - text: ","
                - link "Commit" [ref=f2e412] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c82634b9d01adadbf9780ff84a0a8168fdc4fdea
              - listitem [ref=f2e416]:
                - text: 🆘
                - strong [ref=f2e417]: A model for every chat.
                - text: Opening a conversation whose model has since been retired no longer leaves it stranded with nothing selected; it falls back to your default model, then the configured default, then the first one available, and a chat that still has a live model keeps it.
                - link "#29757" [ref=f2e418] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29757
              - listitem [ref=f2e422]:
                - text: ⚡
                - strong [ref=f2e423]: Non-blocking search.
                - text: Searching the text of chats and knowledge, and the grep a model runs over a knowledge base, now run beside the rest of the server rather than in front of it, so a long search no longer keeps other requests waiting.
                - link "#29621" [ref=f2e424] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29621
                - text: ","
                - link "Commit" [ref=f2e425] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d9c8de9c39fca7c4756e0f9bd599b09ebe435208
              - listitem [ref=f2e429]:
                - text: ✴️
                - strong [ref=f2e430]: Lighter shared note editing.
                - text: Notes written by several people at once no longer echo every keystroke back to the server once per watcher; the traffic between editors falls by half with two of them and keeps falling as more join, so shared notes stay smooth as the room grows.
                - link "#28185" [ref=f2e431] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28185
              - listitem [ref=f2e435]:
                - text: 🔢
                - strong [ref=f2e436]: Sorted knowledge listings.
                - text: The "ls", "tree" and "find" commands a model runs over a knowledge base now sort by name and take "-t", "-S" and "-r" for newest first, largest first and reversed.
                - link "#29840" [ref=f2e437] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29840
              - listitem [ref=f2e441]:
                - text: 🪪
                - strong [ref=f2e442]: Authentication type header.
                - text: "A request to an OpenAI or Ollama connection now carries \"X-OpenWebUI-Auth-Type\", saying whether the person behind it signed in through the browser or called with an API key; its name is set with \"FORWARD_USER_INFO_HEADER_AUTH_TYPE\" and \"{{AUTH_TYPE}}\" works in custom headers."
                - link "Commit" [ref=f2e443] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ee46e2664ab23bacc536fed21c06ab19067d695b
              - listitem [ref=f2e447]:
                - text: 💡
                - strong [ref=f2e448]: Follow-up ghost text.
                - text: "Once a reply has finished, the first of the follow-up questions it suggests now sits greyed inside the empty message box as well as under the reply: Tab writes it out, and typing anything of your own clears it away."
                - link "Commit" [ref=f2e449] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7aaa4a692e949724913834efc47c57572042703b
              - listitem [ref=f2e453]:
                - text: 🪵
                - strong [ref=f2e454]: Model refusal logging.
                - text: A request turned away with "Model not found" now writes a warning naming the account, the model and why it was refused, while the message the caller sees stays as vague as before.
                - link "Commit" [ref=f2e455] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f5fcf4c89fb27ed39825875d573446fa84aa2a5b
              - listitem [ref=f2e459]:
                - text: 🤲
                - strong [ref=f2e460]: Cheaper chat requests behind Redis.
                - text: Where several servers share their websocket traffic through Redis, a chat request no longer pulls the whole shared model list from Redis to ask about a couple of models; each worker keeps its own copy and refetches only when the list actually changed, so the cost stops growing with the number of models configured.
                - link "#28176" [ref=f2e461] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28176
                - text: ","
                - link "#28167" [ref=f2e462] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28167
              - listitem [ref=f2e466]:
                - text: 💽
                - strong [ref=f2e467]: Long conversations stream cheaper.
                - text: Writing or reading a single message no longer loads, checks and rewrites the entire conversation to change a few hundred bytes, so streaming into a long chat stops getting more expensive as it grows, and the whole round trip a message event costs falls to a fraction on conversations of thousands of messages.
                - link "#28184" [ref=f2e468] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28184
                - text: ","
                - link "#28169" [ref=f2e469] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28169
              - listitem [ref=f2e473]:
                - text: 🧱
                - strong [ref=f2e474]: In-place streaming appends.
                - text: Streamed replies can be assembled with CPython's in-place string append, turned on with "ENABLE_CHAT_RESPONSE_STREAM_INPLACE_APPEND" and left off by default while it is rolled out gradually.
                - link "Commit" [ref=f2e475] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/113c56fc8c1986359556107a20e206159ca32f59
                - text: ","
                - link "Commit" [ref=f2e476] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/924a4a10fbd0be508a69faf66bf08ac9761bc24d
                - text: ","
                - link "#30066" [ref=f2e477] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30066
              - listitem [ref=f2e481]:
                - text: 📘
                - strong [ref=f2e482]: Direct connection guidance.
                - text: The connections and integrations pages in the personal settings now say plainly that a direct connection leans on your browser session to keep requests running, which suits testing and temporary use rather than everyday work.
                - link "Commit" [ref=f2e483] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5d66dd6ad291db17894953714c01fd4303093e7e
                - text: ","
                - link "Commit" [ref=f2e484] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/15e2259a2ae1b7dec1f93a52078304dd3a79a14c
              - listitem [ref=f2e488]:
                - text: 🔄
                - strong [ref=f2e489]: General improvements.
                - text: Various improvements were implemented across the application to enhance performance, stability, and security.
              - listitem [ref=f2e493]:
                - text: 🌐
                - strong [ref=f2e494]: Translation updates.
                - text: Translations for Japanese, Traditional Chinese, Korean, Finnish, Russian, Ukrainian, German, Spanish, Portuguese (Brazil), Arabic, Arabic (Bahrain), Azerbaijani, Bulgarian, Bengali, Tibetan, Bosnian, Catalan, Cebuano, Czech, Danish, Basque, Croatian, Dutch, Italian, Turkish, Simplified Chinese, Bosnian, Catalan, Danish, Estonian, Finnish, Galician, Croatian, Kabyle, Norwegian Bokmål, Portuguese (Portugal), Romanian and Turkmen were enhanced and expanded.
          - generic [ref=f2e495]:
            - generic [ref=f2e496]: fixed
            - generic [ref=f2e497]:
              - listitem [ref=f2e501]:
                - text: 🛡️
                - strong [ref=f2e502]: Security Advisory
                - text: ": This release includes security and access-control fixes. We recommend updating production deployments at your earliest convenience. Not all security fixes in this version may be enumerated in the fixed section. Some may be withheld for a short time to give administrators time to upgrade."
                - link "Advisories" [ref=f2e503] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/security
              - listitem [ref=f2e507]:
                - text: 🔑
                - strong [ref=f2e508]: Tokens stay out of logs.
                - text: A failure part way through signing in with an identity provider no longer writes the credentials it was handed into the application log, recording the provider and the error it reported instead.
                - link "#29709" [ref=f2e509] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29709
              - listitem [ref=f2e513]:
                - text: 🔐
                - strong [ref=f2e514]: Sign-in role mapping.
                - text: Roles sent by an identity provider were in some setups not applied, leaving an account at the default role, and a sign-in whose roles cannot be read is now refused rather than let through.
                - link "Commit" [ref=f2e515] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/10d1cfe6375f207acaa531e857edb575ded2cfc3
              - listitem [ref=f2e519]:
                - text: 🚫
                - strong [ref=f2e520]: Blocked sign-in groups saved.
                - text: Comma-separated group names typed into the blocked groups field now take effect once saved, where the save stored the text as written and the sign-in check then read it as nothing; a group name carrying a comma of its own survives a save too.
                - link "Commit" [ref=f2e521] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3fc1146c13d7b4b7a67c7fd058014436f80e0dfd
              - listitem [ref=f2e525]:
                - text: 🚪
                - strong [ref=f2e526]: Signing out ends the session.
                - text: Signing out or having every token revoked left any live connection that account already had in place, and those are now cut at the same moment; a token already revoked can no longer be replayed to cut someone else's newer session.
                - link "Commit" [ref=f2e527] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3a6d0fd203050401481bdb8621b827089d393817
              - listitem [ref=f2e531]:
                - text: 🛡
                - strong [ref=f2e532]: Diagrams and SVG stay on this origin.
                - text: Mermaid diagrams and SVG previews, attached or uploaded, no longer follow references pointing at another origin, a picture, style or configuration line among them, and a diagram that reaches outside is refused with an error; a file whose drawing leans on an external sprite now shows that part blank.
                - link "#30271" [ref=f2e533] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30271
              - listitem [ref=f2e537]:
                - text: 📲
                - strong [ref=f2e538]: Terminal sessions follow access changes.
                - text: A terminal connection now re-checks your access to it every ten seconds for as long as it stays open, so removing someone's permission or deactivating their account ends their live terminal on the next check, on every worker and not only the one they signed in through.
                - link "Commit" [ref=f2e539] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a1189a2d757407530a0c1c85a41b46cd6a4f7da5
                - text: ","
                - link "Commit" [ref=f2e540] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e8bd0661d3774248c318286849041b94bb861909
              - listitem [ref=f2e544]:
                - text: 🔒
                - strong [ref=f2e545]: Connection model listing access.
                - text: The endpoints that list the models on a single Ollama or OpenAI connection could be reached by a signed-in account of any role, and now check the caller's role.
                - link "#29619" [ref=f2e546] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29619
              - listitem [ref=f2e550]:
                - text: 🔏
                - strong [ref=f2e551]: Knowledge file access.
                - text: A file's access through a knowledge base now follows its actual attachment alone, rather than also a collection name left behind on the file record.
                - link "#29937" [ref=f2e552] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29937
              - listitem [ref=f2e556]:
                - text: 🌳
                - strong [ref=f2e557]: Knowledge directories stay inside their base.
                - text: A directory id supplied to the knowledge file routes is now refused where it belongs to a different knowledge base, where a caller-supplied id could reach into a directory tree outside the one being addressed.
                - link "Commit" [ref=f2e558] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a9541c18ca2a056f4ccfe56b9c733cba74b86b49
                - text: ","
                - link "#29887" [ref=f2e559] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29887
              - listitem [ref=f2e563]:
                - text: 🍪
                - strong [ref=f2e564]: Cookie forwarding scope.
                - text: A connection authenticating as the signed-in person is handed this instance's browser cookies only where its new Forward cookies switch is on, which an instance relying on it has to turn on after upgrading.
                - link "Commit" [ref=f2e565] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b71744b17823f7a3a9a64cb363e79a7164ed5b23
                - text: ","
                - link "Commit" [ref=f2e566] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3cda47cdb449aac970426f0929c9e5f8bb8bd807
                - text: ","
                - link "Commit" [ref=f2e567] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f9f815c86220f809fad5ee1300c44f55dea74c79
              - listitem [ref=f2e571]:
                - text: 🗝️
                - strong [ref=f2e572]: Revocation list fallback.
                - text: Where the revocation list is kept in Redis and Redis cannot be reached, a token is now accepted rather than the request failing, so signing out may not take effect until Redis is back.
                - link "Commit" [ref=f2e573] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c1615bec2f5f143084b5fcc04f42ebfa0dade9df
                - text: ","
                - link "Commit" [ref=f2e574] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6a85abb3f5e002f3069007213e16e4ef60776890
              - listitem [ref=f2e578]:
                - text: 🗒
                - strong [ref=f2e579]: Home page chat drafts.
                - text: A message typed into a chat started from the home page now comes back after a reload, text, uploads and all, where the draft was stored under a key the page never read again.
                - link "#29762" [ref=f2e580] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29762
                - text: ","
                - link "#29760" [ref=f2e581] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29760
              - listitem [ref=f2e585]:
                - text: 🏞️
                - strong [ref=f2e586]: S3-hosted chat images.
                - text: A chat image whose host echoes a Content-Encoding nothing asked for, an S3 or MinIO object uploaded with that metadata among them, no longer breaks the reply it sits in; it is sent as its link the way an unreachable image already was.
                - link "#29623" [ref=f2e587] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29623
              - listitem [ref=f2e591]:
                - text: 🪆
                - strong [ref=f2e592]: Branch descent guard.
                - text: Stepping between reply branches walked a chat's children without tracking where it had already been, so a history that pointed back at itself spun forever and locked the tab, and a child id with no message behind it threw; every one of the eleven places that walk now shares a single guarded helper.
                - link "#30070" [ref=f2e593] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30070
              - listitem [ref=f2e597]:
                - text: 🗒️
                - strong [ref=f2e598]: Note save on exit.
                - text: A note's title and its attachments save a moment after they change, and leaving the note inside that moment dropped the save, so the notes list kept showing the old title until the page was reloaded; the pending save now finishes before the next page opens.
                - link "#29745" [ref=f2e599] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29745
                - text: ","
                - link "#29744" [ref=f2e600] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29744
              - listitem [ref=f2e604]:
                - text: 📷
                - strong [ref=f2e605]: Attachments sent without text.
                - text: Sending an image or a file with nothing typed to a model that has skills attached replaced the empty message with the list of skill names, so the model answered with its own catalogue instead of looking at what you sent.
                - link "#30045" [ref=f2e606] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30045
                - text: ","
                - link "#30040" [ref=f2e607] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30040
              - listitem [ref=f2e611]:
                - text: 🖍️
                - strong [ref=f2e612]: SVG attachments read as text.
                - text: An SVG attached to a chat went up as a picture and came back rejected by every model that tried to decode it, and is now read as its source text instead, which needs a model that accepts file uploads.
                - link "#30102" [ref=f2e613] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30102
                - text: ","
                - link "#30100" [ref=f2e614] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30100
              - listitem [ref=f2e618]:
                - text: 🩹
                - strong [ref=f2e619]: Notes survive a small edit.
                - text: Asked to add a section or change a few lines, a model would send the whole note back and lose the rest of it with nothing to undo, because the editing tool never said when to edit a range instead; it now spells out the range rules the handler already enforced.
                - link "#30048" [ref=f2e620] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30048
              - listitem [ref=f2e624]:
                - text: 📋
                - strong [ref=f2e625]: Note paste placement.
                - text: A plain paste replaced more of the note than was selected, and a paste into a code block broke out of the block instead of going inside it; both now land exactly where they were dropped.
                - link "Commit" [ref=f2e626] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d8f27e745bd31c89efa25cbe0f41bb0f70576fc5
              - listitem [ref=f2e630]:
                - text: 🧿
                - strong [ref=f2e631]: Insert into note on read-only notes.
                - text: The Insert into note action no longer appears on a note you may only read, which offered it where it could not land.
                - link "#30223" [ref=f2e632] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30223
                - text: ","
                - link "#30174" [ref=f2e633] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30174
              - listitem [ref=f2e637]:
                - text: 🤝
                - strong [ref=f2e638]: Note sharing survives a save.
                - text: Saving a note you had been given access to took that sharing away, so the note went private and everyone else lost it.
                - link "#30175" [ref=f2e639] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30175
              - listitem [ref=f2e643]:
                - text: 🌍
                - strong [ref=f2e644]: Collaborative link handling.
                - text: In a note two people are writing at once, a plain web address arriving from the other editor was turned into a link on your screen but not on theirs; it is now left as written.
                - link "Commit" [ref=f2e645] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d8f27e745bd31c89efa25cbe0f41bb0f70576fc5
              - listitem [ref=f2e649]:
                - text: 📑
                - strong [ref=f2e650]: Tika 4 document formatting.
                - text: Where document extraction runs against a Tika server on version 4, the text now comes back as Markdown rather than a flat run of characters, so headings, lists and tables survive into what the model reads.
                - link "Commit" [ref=f2e651] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ba34bee2d17e1c00238c85a8aab1a11a60db164e
              - listitem [ref=f2e655]:
                - text: ⏳
                - strong [ref=f2e656]: Session expiry accuracy.
                - text: A session with an identity provider now expires with the token it actually calls with, rather than whichever of its two tokens ran out first, which renewed it early and dropped it whenever that failed.
                - link "Commit" [ref=f2e657] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/aaaf26fb8ede28854dd660b11b85ba6bafe64007
              - listitem [ref=f2e661]:
                - text: 🧩
                - strong [ref=f2e662]: Tool steps in finished replies.
                - text: A reply that called tools showed each step as it ran, then lost them the moment the reply completed, because the provider's closing message replaced everything on screen rather than joining it; the closing message is now merged into what is already there, and a tool call is no longer mistaken for its own result.
                - link "Commit" [ref=f2e663] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e1bfefdf9f8f2012cecfc7d81079bd6fff147932
                - text: ","
                - link "Commit" [ref=f2e664] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/31b272d3c93b87636c920f2aa68d6caaa07ae79a
              - listitem [ref=f2e668]:
                - text: 🧭
                - strong [ref=f2e669]: Streamed replies follow along.
                - text: A reply arriving over the response events now keeps the view at the bottom as it is written, as replies on the older path already did, unless you have scrolled up yourself.
                - link "Commit" [ref=f2e670] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/dfde08aa7391d924359b27f5768411d7a533a6ec
                - text: ","
                - link "Commit" [ref=f2e671] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/88e78b7819b28ffe91f3dff24d8c5d992004197e
              - listitem [ref=f2e675]:
                - text: 🚿
                - strong [ref=f2e676]: Tool results arrive when the tools are done.
                - text: The results of a model's tool calls now reach the reply as soon as the round that produced them finishes, instead of being held back with the rest of the streaming until the throttle let them through, and a channel reply or a continuation no longer carries the picture data a tool handed the model.
                - link "Commit" [ref=f2e677] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/478d1785fd27f400c614a5700f5b38ec9de412f9
              - listitem [ref=f2e681]:
                - text: 🧗
                - strong [ref=f2e682]: Tagged blocks while streaming.
                - text: A reply using reasoning, solution or code interpreter tags briefly showed the raw tag text in the message as it arrived, because the chunk carrying it reached the browser before the cleaned output did; the cleaned output is now sent the moment a tag is taken out, and the code an interpreter block writes fills that block rather than the message body.
                - link "Commit" [ref=f2e683] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/58b36765a7c20f5943a3180bd289de48876d0878
              - listitem [ref=f2e687]:
                - text: 📗
                - strong [ref=f2e688]: Excel in the code interpreter.
                - text: Reading or writing a spreadsheet in code the browser runs failed outright because the library that handles them never reached the browser, and it is now shipped alongside the rest.
                - link "#30140" [ref=f2e689] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30140
                - text: ","
                - link "#30130" [ref=f2e690] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30130
              - listitem [ref=f2e694]:
                - text: 📀
                - strong [ref=f2e695]: Bundled charts and formatting.
                - text: Drawing a chart with seaborn in code the browser runs fetched the library over the internet at that moment rather than taking it from what ships, and the code editor's Format button failed outright for anyone who is not an administrator; both now work from what comes with the application, offline included.
                - link "#30148" [ref=f2e696] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30148
                - text: ","
                - link "#30145" [ref=f2e697] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30145
              - listitem [ref=f2e701]:
                - text: 🙋
                - strong [ref=f2e702]: Typed answer submission.
                - text: In the card a model puts up to ask you a question, choosing one of its options on the last question sends your answers straight away, but typing your own into the Other box left Submit answers greyed out with no way to send it, and it now turns on as soon as that box has text.
                - link "#29494" [ref=f2e703] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29494
                - text: ","
                - link "#29311" [ref=f2e704] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29311
              - listitem [ref=f2e708]:
                - text: 🥇
                - strong [ref=f2e709]: A truthful Recommended badge.
                - text: The card a model puts up to ask you a question marks its first option Recommended, but nothing told the model that, so the badge fell on whichever option happened to be listed first; models are now asked to put the option they recommend there.
                - link "#30196" [ref=f2e710] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30196
                - text: ","
                - link "#30195" [ref=f2e711] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30195
              - listitem [ref=f2e715]:
                - text: 🎚️
                - strong [ref=f2e716]: Partial settings permissions.
                - text: An account barred from changing the interface settings can now save its system prompt, notifications, audio, keyboard shortcuts and pinned models, which were refused along with them.
                - link "Commit" [ref=f2e717] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98a920168e2eea435ac15e1ad3d679946631e41d
              - listitem [ref=f2e721]:
                - text: 🎧
                - strong [ref=f2e722]: Speech file types kept.
                - text: Saving the audio settings emptied the list of file types accepted for speech recognition, so transcription then turned away the recordings it had taken before.
                - link "#30208" [ref=f2e723] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30208
              - listitem [ref=f2e727]:
                - text: 🚻
                - strong [ref=f2e728]: Group picker without permission.
                - text: The picker for sharing a chat, a note or a knowledge base with a group was offered to accounts not allowed to share with groups, and is now hidden from them.
                - link "#30189" [ref=f2e729] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30189
              - listitem [ref=f2e733]:
                - text: 🗜️
                - strong [ref=f2e734]: Per-field settings saves.
                - text: Only the settings actually changed are now stored, rather than the whole object, so another tab's older copy no longer overwrites them and a default an administrator changes still reaches everyone, and pinning a model, reordering the list or picking a default from outside the settings window now saves the same way.
                - link "Commit" [ref=f2e735] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98a920168e2eea435ac15e1ad3d679946631e41d
                - text: ","
                - link "#30183" [ref=f2e736] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30183
              - listitem [ref=f2e740]:
                - text: ⚠️
                - strong [ref=f2e741]: Failed settings feedback.
                - text: Settings that could not be saved were shown as saved anyway until the page was reloaded, because the interface stored them locally without waiting on the server; a failure now raises an error and leaves the panel as it was.
                - link "Commit" [ref=f2e742] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98a920168e2eea435ac15e1ad3d679946631e41d
              - listitem [ref=f2e746]:
                - text: 🔠
                - strong [ref=f2e747]: Menu text scaling.
                - text: The entries in the menus that drop down across the interface now scale with the rest of it, rather than staying at a fixed size while the menu around them grew.
                - link "#29493" [ref=f2e748] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29493
                - text: ","
                - link "#29488" [ref=f2e749] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29488
              - listitem [ref=f2e753]:
                - text: 🪞
                - strong [ref=f2e754]: Account menu highlighting.
                - text: An account menu entry carrying a pin button beside it now lights up across the whole row in the shared colour, and a long label no longer pushes the pin out of the menu.
                - link "Commit" [ref=f2e755] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e723dcda58f638a5da2398743d22d3e5854042bf
              - listitem [ref=f2e759]:
                - text: 🔲
                - strong [ref=f2e760]: Shift-click file selection.
                - text: Shift-clicking a file in the terminal's file browser now adds that range to what is already selected, and clicking through a selected file removes its range.
                - link "Commit" [ref=f2e761] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f80ef8bd001d7ef650fb278d6fbd05bea4afad0f
                - text: ","
                - link "Commit" [ref=f2e762] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4cc0d48b4d83503199bcc5f2322881722971a499
                - text: ","
                - link "Commit" [ref=f2e763] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/674760bfc1122e0a19fe299e05a86d1cbb528e6f
              - listitem [ref=f2e767]:
                - text: 🛟
                - strong [ref=f2e768]: Attachment name collisions.
                - text: Attaching a file to a message on an instance that puts attachments in a terminal's working directory replaced whatever file of that name was sitting there; the upload now takes the next free name, "report (1).pdf" beside "report.pdf", and the attachment shows the name it was saved under, though two uploads arriving at the same moment from different browsers can still land on the same name.
                - link "Commit" [ref=f2e769] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d70053e44993f271d534fb87d2b40724b028fca2
              - listitem [ref=f2e773]:
                - text: 📛
                - strong [ref=f2e774]: Failed upload feedback.
                - text: A file that could not be written to the terminal now says so, rather than passing in silence while the browser refreshed as though it had arrived.
                - link "Commit" [ref=f2e775] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f80ef8bd001d7ef650fb278d6fbd05bea4afad0f
                - text: ","
                - link "Commit" [ref=f2e776] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4cc0d48b4d83503199bcc5f2322881722971a499
                - text: ","
                - link "Commit" [ref=f2e777] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/674760bfc1122e0a19fe299e05a86d1cbb528e6f
              - listitem [ref=f2e781]:
                - text: ☑️
                - strong [ref=f2e782]: Unchecked checkbox defaults.
                - text: A prompt variable written as a checkbox with a default of false opened the form already ticked, as did False, "false", 0 and "0", because any non-empty default counted as ticked; it is now ticked only where the value really is true.
                - link "#30037" [ref=f2e783] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30037
                - text: ","
                - link "#30036" [ref=f2e784] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30036
              - listitem [ref=f2e788]:
                - text: 🎯
                - strong [ref=f2e789]: Prefilled question timing.
                - text: Opening a chat from a link holding a question sent it before the box had it, so a question naming a variable went off with the variable unfilled; the send now waits for the text to be in place and filled in.
                - link "Commit" [ref=f2e790] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3808eace6c2beb1904f0f04fdd443ec544f94acb
                - text: ","
                - link "Commit" [ref=f2e791] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a23b579233276e40159eb615917b9aeb7d5ed5c9
              - listitem [ref=f2e795]:
                - text: 📜
                - strong [ref=f2e796]: Task list height.
                - text: The list of steps a model works through ran as long as it needed and pushed the rest of the reply down the page; it now stops at a quarter of the window's height and scrolls within itself.
                - link "Commit" [ref=f2e797] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/307b9b9133f0c7ad899f4b76226059da6f3177eb
              - listitem [ref=f2e801]:
                - text: ⎋
                - strong [ref=f2e802]: Escape key targeting.
                - text: The shortcut for closing a dialog always shut the settings window, whichever dialog was actually in front, so a dialog opened from within settings took both away at once; each dialog now answers the shortcut for itself, as it already did for the escape key.
                - link "#29830" [ref=f2e803] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29830
                - text: ","
                - link "#29817" [ref=f2e804] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29817
              - listitem [ref=f2e808]:
                - text: 🎹
                - strong [ref=f2e809]: Message pair shortcut.
                - text: The shortcut that adds an empty question and answer to a chat also sent whatever was typed in the message box, so the pair arrived alongside a message you had not meant to send yet.
                - link "#30167" [ref=f2e810] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30167
              - listitem [ref=f2e814]:
                - text: 🥁
                - strong [ref=f2e815]: Collapsing the task list.
                - text: Folding away the list of tasks under a reply also sent whatever you had typed in the message box.
                - link "#30202" [ref=f2e816] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30202
              - listitem [ref=f2e820]:
                - text: 🕰️
                - strong [ref=f2e821]: Temporary chat links.
                - text: A link carrying the temporary chat marker opened an ordinary chat, because the marker was written into the address but never read back when the page loaded, and such a link now opens the temporary chat it promises.
                - link "Commit" [ref=f2e822] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/67adde31936d1d2e656140f9edd898b1fbb18a1c
              - listitem [ref=f2e826]:
                - text: ⌨️
                - strong [ref=f2e827]: Recording a new shortcut.
                - text: Pressing a key combination to record it as a shortcut also ran whatever that combination was already bound to, so setting one up did the thing you were trying to rebind.
                - link "#30160" [ref=f2e828] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30160
              - listitem [ref=f2e832]:
                - text: 🔃
                - strong [ref=f2e833]: Stale tab reload.
                - text: A tab still running the previous build met an error page after the server was updated instead of loading the new one, because every image built from Docker carried the same version stamp; the stamp now follows the build, and a stale tab reloads as it was meant to.
                - link "#29832" [ref=f2e834] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29832
                - text: ","
                - link "#29831" [ref=f2e835] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29831
              - listitem [ref=f2e839]:
                - text: 📌
                - strong [ref=f2e840]: Channel code headers.
                - text: The bar naming a piece of code in a channel thread or its pinned messages now sits flush at the top of the panel, clipped to the block, rather than floating over the code as it scrolls.
                - link "#29836" [ref=f2e841] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29836
                - text: ","
                - link "#29835" [ref=f2e842] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29835
              - listitem [ref=f2e846]:
                - text: 📨
                - strong [ref=f2e847]: Duplicated proxy headers.
                - text: A reply proxied from a terminal server or an OpenAI or Ollama connection no longer carries that server's own "Server" and "Date" headers, which had a reverse proxy in front logging a duplicate line for every one.
                - link "#29841" [ref=f2e848] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29841
                - text: ","
                - link "#29824" [ref=f2e849] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29824
                - text: ","
                - link "#29843" [ref=f2e850] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29843
              - listitem [ref=f2e854]:
                - text: 🎣
                - strong [ref=f2e855]: Testing an image connection.
                - text: The Verify button beside an image generation connection saved the whole image configuration first and then tested whichever engine was active rather than the connection beside it, and it now tests exactly that connection and changes nothing.
                - link "Commit" [ref=f2e856] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/64bbdf7a73724986fac8bcf6e880fe32ef9ac495
              - listitem [ref=f2e860]:
                - text: 🪝
                - strong [ref=f2e861]: Responses API tool strictness.
                - text: A workspace tool, MCP server or OpenAPI server reaching a model on the Responses API was turned into a strict schema where it had never asked to be, so the model filled every optional field with empty strings, zeros and empty arrays, and search and filter tools were handed values where leaving them out was meant.
                - link "#30046" [ref=f2e862] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30046
                - text: ","
                - link "#27750" [ref=f2e863] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27750
              - listitem [ref=f2e867]:
                - text: 🪃
                - strong [ref=f2e868]: Responses API tool calling.
                - text: A forced tool choice sent to a connection on the Responses API went out in the wrong shape and was refused by providers that check it, and a tool call in a reply that was not streamed came back as empty text, so nothing reading the API ever saw it.
                - link "#30095" [ref=f2e869] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30095
                - text: ","
                - link "#30085" [ref=f2e870] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30085
              - listitem [ref=f2e874]:
                - text: ⛓️
                - strong [ref=f2e875]: Missing tools in links.
                - text: Opening a chat from a link whose "tools" or "tool-ids" parameter names a tool that no longer exists, or that the account cannot see, kept that id in the selection and sent it with the message; ids matching no tool the account has are now dropped and the rest of the link works as before.
                - link "#29803" [ref=f2e876] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29803
              - listitem [ref=f2e880]:
                - text: 🚫
                - strong [ref=f2e881]: Model editor error messages.
                - text: A workspace model that cannot be loaded for editing now says so, instead of sending you back with "You do not have permission to edit this model" whatever the real reason.
                - link "#29694" [ref=f2e882] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29694
                - text: ","
                - link "#29629" [ref=f2e883] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29629
              - listitem [ref=f2e887]:
                - text: 👥
                - strong [ref=f2e888]: Directory updates that were dropped.
                - text: A change your identity provider sent as an add or a remove, or without naming the attribute it was changing, was accepted and then quietly discarded, so a rename or a deactivation never reached the account; those now take effect.
                - link "Commit" [ref=f2e889] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ad9da981680c0fd9151c803a366a01545ea907c1
              - listitem [ref=f2e893]:
                - text: 🗃️
                - strong [ref=f2e894]: Directory request validation.
                - text: A provisioning request carrying the wrong kind of value, or an attribute Open WebUI does not support, now comes back as an error instead of passing in silence, and a sync that changes nothing no longer marks the account as touched.
                - link "Commit" [ref=f2e895] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ad9da981680c0fd9151c803a366a01545ea907c1
              - listitem [ref=f2e899]:
                - text: 🔘
                - strong [ref=f2e900]: Model editor save button.
                - text: Saving a workspace model whose model list could not be refreshed afterwards now reports the error and frees the Save button, rather than leaving it disabled and spinning though the model had been saved.
                - link "Commit" [ref=f2e901] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/dc98e3023fc6e0113dbad76545cdb15e014db6ad
                - text: ","
                - link "Commit" [ref=f2e902] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cc5479d16d5caf28ec19a16ffa1ee4f3dbc0f63f
              - listitem [ref=f2e906]:
                - text: 🫱
                - strong [ref=f2e907]: Rating a reply again.
                - text: Switching a reply's rating from one thumb to the other kept the score and the reason given the first time, and rating a reply whose feedback had since been deleted failed outright; both now record the rating you just gave.
                - link "#30075" [ref=f2e908] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30075
                - text: ","
                - link "#30077" [ref=f2e909] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30077
              - listitem [ref=f2e913]:
                - text: 📶
                - strong [ref=f2e914]: Sorting feedback by user.
                - text: The User column in the admin feedback history did nothing when clicked, and now sorts by who left the feedback.
                - link "#30191" [ref=f2e915] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30191
              - listitem [ref=f2e919]:
                - text: 🪂
                - strong [ref=f2e920]: Closing the Edit User dialog.
                - text: Changes typed into the admin Edit User dialog and then abandoned showed on the row in the user list until the page was reloaded, and closing the dialog now drops them.
                - link "#30193" [ref=f2e921] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30193
              - listitem [ref=f2e925]:
                - text: 🪙
                - strong [ref=f2e926]: Model defaults save.
                - text: Saving the model defaults in the admin settings put the selected, pinned and ordered models back as they stood when the page was opened, undoing anything changed in between.
                - link "#30206" [ref=f2e927] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30206
              - listitem [ref=f2e931]:
                - text: 👤
                - strong [ref=f2e932]: A custom gender shown back.
                - text: An account whose gender is a wording of its own came back to an empty dropdown in the account form, and the form now shows Custom with that wording beside it.
                - link "#30215" [ref=f2e933] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30215
              - listitem [ref=f2e937]:
                - text: 🗓️
                - strong [ref=f2e938]: Clearing a calendar event.
                - text: Emptying the repeat, the description or the location of a calendar event did not take and the old wording came back, and those fields can be cleared again.
                - link "#30204" [ref=f2e939] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30204
              - listitem [ref=f2e943]:
                - text: 📕
                - strong [ref=f2e944]: Required prompt dropdowns.
                - text: A prompt's form could be sent with a required dropdown left unchosen, and now asks you to pick something first.
                - link "#30078" [ref=f2e945] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30078
              - listitem [ref=f2e949]:
                - text: 🎫
                - strong [ref=f2e950]: Account form required fields.
                - text: The account form now refuses to save with a required field left empty, the way the admin user dialog does, and a date of birth is no longer demanded of accounts that never set one.
                - link "#30296" [ref=f2e951] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30296
                - text: ","
                - link "#30295" [ref=f2e952] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30295
              - listitem [ref=f2e956]:
                - text: 🐑
                - strong [ref=f2e957]: Model clones keep their base.
                - text: Cloning a model from the admin Models settings now carries the model it was built on, where the clone came out detached from it, and an arena model no longer offers Clone at all.
                - link "#30080" [ref=f2e958] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30080
                - text: ","
                - link "#30079" [ref=f2e959] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30079
              - listitem [ref=f2e963]:
                - text: 🧤
                - strong [ref=f2e964]: Model sharing survives a save.
                - text: Saving a model you cannot fully share no longer strips the access entries you cannot re-create, where an editor resending every stored entry had each one re-checked against what its author may grant, and a save from someone with narrow rights quietly took the model private for everyone else.
                - link "Commit" [ref=f2e965] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/754c4b5762ed0d79954ff28c4e06631004dc31b3
                - text: ","
                - link "#30093" [ref=f2e966] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30093
                - text: ","
                - link "#30087" [ref=f2e967] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30087
              - listitem [ref=f2e971]:
                - text: 📠
                - strong [ref=f2e972]: Prompt version saves.
                - text: Saving a new version of a prompt without Set as Production leaves the live prompt exactly as it was, where the draft quietly took its place, and the editor now shows the production text the moment a version is set.
                - link "#30231" [ref=f2e973] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30231
                - text: ","
                - link "#30230" [ref=f2e974] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30230
                - text: ","
                - link "#30233" [ref=f2e975] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30233
                - text: ","
                - link "#30232" [ref=f2e976] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30232
              - listitem [ref=f2e980]:
                - text: 💬
                - strong [ref=f2e981]: Model description round trips.
                - text: A workspace model whose description is switched from the default back to custom saves again, where the switch read the field as empty and the description was dropped on save.
                - link "#30249" [ref=f2e982] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30249
                - text: ","
                - link "#30247" [ref=f2e983] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30247
              - listitem [ref=f2e987]:
                - text: 🎚
                - strong [ref=f2e988]: Compaction threshold saves.
                - text: The context compaction threshold set in general settings now reaches the model parameters, where the value never left the page.
                - link "#30270" [ref=f2e989] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30270
                - text: ","
                - link "#30269" [ref=f2e990] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30269
              - listitem [ref=f2e994]:
                - text: 📢
                - strong [ref=f2e995]: Speech engine defaults.
                - text: Switching the text to speech engine now applies that engine's own default voice and model, where the change kept the previous engine's settings in place.
                - link "#30289" [ref=f2e996] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30289
                - text: ","
                - link "#30288" [ref=f2e997] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30288
              - listitem [ref=f2e1001]:
                - text: 🗞
                - strong [ref=f2e1002]: MinerU key in local mode.
                - text: The document settings save again in local mode with the MinerU key left empty, where the form demanded a key it did not need.
                - link "#30299" [ref=f2e1003] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30299
                - text: ","
                - link "#30298" [ref=f2e1004] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30298
              - listitem [ref=f2e1008]:
                - text: 🫂
                - strong [ref=f2e1009]: Group dialog reset.
                - text: The new-group dialog opens empty after a group is created, where the next one came up holding the group just made.
                - link "#30280" [ref=f2e1010] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30280
                - text: ","
                - link "#30279" [ref=f2e1011] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30279
              - listitem [ref=f2e1015]:
                - text: 🧵
                - strong [ref=f2e1016]: Thread reply notifications.
                - text: Clicking the notification for a reply written inside a thread dropped you at the bottom of the channel with the thread still shut and the reply nowhere in sight; it now opens the thread the reply belongs to.
                - link "#29856" [ref=f2e1017] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29856
                - text: ","
                - link "#29855" [ref=f2e1018] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29855
              - listitem [ref=f2e1022]:
                - text: 🔽
                - strong [ref=f2e1023]: Dropdown arrow spacing.
                - text: The arrow in the dropdowns drawn no wider than their contents, among them the provider on a new connection, no longer overlaps the last characters of the longest choice.
                - link "#29866" [ref=f2e1024] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29866
                - text: ","
                - link "#29865" [ref=f2e1025] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29865
              - listitem [ref=f2e1029]:
                - text: 🧊
                - strong [ref=f2e1030]: Lowercase header handling.
                - text: Headers from an upstream that writes them in lower case, as anything served by uvicorn does, are now matched without regard to case, so "Content-Encoding" is stripped and clients stop failing to decompress a body the server had already decoded.
                - link "#29843" [ref=f2e1031] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29843
              - listitem [ref=f2e1035]:
                - text: 🛑
                - strong [ref=f2e1036]: Complete chat stop.
                - text: Where a chat had more than one task in flight, stopping it, deleting it, or closing a note being worked on could stop the first and leave the rest running to the end, both because a task that had already finished ended the round early and because the list being worked through was rewritten underneath it as each one was cleared away; every task is now stopped in turn, so a reply that was calling tools stops calling them rather than running on to its own limit, though instances sharing their state through Redis were not affected.
                - link "Commit" [ref=f2e1037] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e35b907f737e625b900b3a03d61890f67ab0c4b0
                - text: ","
                - link "#29844" [ref=f2e1038] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29844
                - text: ","
                - link "#29816" [ref=f2e1039] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29816
              - listitem [ref=f2e1043]:
                - text: 🖊️
                - strong [ref=f2e1044]: Channel code blocks.
                - text: Where a model answers in a channel with structured output, the code inside it was drawn as plain highlighted text rather than in the editor every other message uses, so it could not be edited in place and a diff in it could not be opened for editing; it now renders the same way as everywhere else.
                - link "#29861" [ref=f2e1045] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29861
              - listitem [ref=f2e1049]:
                - text: 📐
                - strong [ref=f2e1050]: Code block edits on collapse.
                - text: An unsaved edit inside a code block stays on screen when the block is folded away and opened again, where collapsing it showed the saved text though the edit was still pending.
                - link "#30284" [ref=f2e1051] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30284
                - text: ","
                - link "#30283" [ref=f2e1052] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30283
              - listitem [ref=f2e1056]:
                - text: 🚨
                - strong [ref=f2e1057]: Code run errors with output.
                - text: A code run that ends with an error now shows the error alongside what it printed, where a run that printed anything at all showed its error nowhere.
                - link "#30286" [ref=f2e1058] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30286
                - text: ","
                - link "#30285" [ref=f2e1059] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30285
              - listitem [ref=f2e1063]:
                - text: 🔕
                - strong [ref=f2e1064]: Reactions on read-only channels.
                - text: The reaction picker no longer appears on a channel open to you as a viewer alone, matching the reply and menu options already hidden there.
                - link "#30241" [ref=f2e1065] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30241
                - text: ","
                - link "#30240" [ref=f2e1066] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30240
              - listitem [ref=f2e1070]:
                - text: 🎯
                - strong [ref=f2e1071]: Knowledge search accuracy on PostgreSQL.
                - text: A fresh install using PostgreSQL built its search index before a single piece of text existed to organise it around, so the index was never fit for the content that arrived afterwards and every search quietly returned the wrong passages; the index now waits until there is enough text to build on, and until then searches read everything exactly. An install already carrying such an index can restore it by rebuilding that one index.
                - link "#30143" [ref=f2e1072] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30143
                - text: ","
                - link "#30134" [ref=f2e1073] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30134
              - listitem [ref=f2e1077]:
                - text: 🗂
                - strong [ref=f2e1078]: Knowledge file filter on first click.
                - text: The File content filter in a knowledge base now narrows the listing the first time it is clicked, where the first click only armed the checkbox and everything stayed listed until it was clicked again.
                - link "#30211" [ref=f2e1079] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30211
                - text: ","
                - link "#30210" [ref=f2e1080] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30210
              - listitem [ref=f2e1084]:
                - text: 🔭
                - strong [ref=f2e1085]: Knowledge base search recall.
                - text: Where many knowledge bases are stored together, a search of one holding a small share of what is stored found only a small share of its matches, and the shortfall grew as the store did; the search now keeps looking until it has enough from the knowledge base you asked for, and "PGVECTOR_ITERATIVE_SCAN" switches that off or makes it strict.
                - link "#30142" [ref=f2e1086] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30142
                - text: ","
                - link "#30135" [ref=f2e1087] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30135
              - listitem [ref=f2e1091]:
                - text: 🪣
                - strong [ref=f2e1092]: Searches that found nothing.
                - text: A knowledge search that came back empty never handed its database connection back, so enough of them left knowledge search failing outright until the server was restarted; connections are returned now on PostgreSQL and on openGauss alike.
                - link "#30142" [ref=f2e1093] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30142
                - text: ","
                - link "#30133" [ref=f2e1094] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30133
                - text: ","
                - link "#30144" [ref=f2e1095] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30144
              - listitem [ref=f2e1099]:
                - text: 🧽
                - strong [ref=f2e1100]: Knowledge folder deletion.
                - text: Deleting a folder without moving what was in it up a level dropped the files from the listing but left their text in the search index and the files themselves in storage, so a model went on retrieving and citing pages from a folder that was no longer there; the text is now removed with the folder, and a file no other knowledge base holds is deleted with it unless file retention is switched on.
                - link "Commit" [ref=f2e1101] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/17dbc6f001aeea25ae1df528cb79bb272eca4a77
              - listitem [ref=f2e1105]:
                - text: 🦀
                - strong [ref=f2e1106]: Regex searches over chat and knowledge files.
                - text: A pattern search now runs in time proportional to the text whatever the pattern, where a nasty expression could stall the search for good, and the patterns it accepts follow RE2's rules, with no lookarounds or backreferences and character classes matching ASCII only.
                - link "Commit" [ref=f2e1107] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/97e013a66169c4fcd7f26ab9e41a4ff260ffd4da
              - listitem [ref=f2e1111]:
                - text: ⏰
                - strong [ref=f2e1112]: Automation schedule parsing.
                - text: An automation whose rule puts the time in "DTSTART" is now read at that hour, rather than listed at midnight and opened at nine, which moved when it ran as soon as it was saved again.
                - link "Commit" [ref=f2e1113] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/540467b90a430e47e536c20710878b342de659fb
              - listitem [ref=f2e1117]:
                - text: ⏲️
                - strong [ref=f2e1118]: Recurrence counts and start dates.
                - text: A rule repeating a set number of times, ten or a hundred, is read as the limited repeat it is, where any count beginning with a one was treated as one-shot, and a rule carrying its start date on the same line as its repeat text now follows the start you picked, on schedules and calendar events alike.
                - link "#29262" [ref=f2e1119] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29262
              - listitem [ref=f2e1123]:
                - text: ⌛
                - strong [ref=f2e1124]: Stalled schedules and stuck tasks.
                - text: A schedule whose rule takes too long to work out no longer holds up the round that evaluates it and is skipped with a warning, and background tasks shared through Redis now expire once their worker falls silent, after "REDIS_TASK_TTL" seconds.
                - link "Commit" [ref=f2e1125] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5fb869db221d9599a576e8e2eea9c3314947d25e
              - listitem [ref=f2e1129]:
                - text: 📣
                - strong [ref=f2e1130]: Model mention chips.
                - text: A mention whose ID carried anything beyond letters, digits and a little punctuation, such as the brackets in some workspace model IDs, stayed on screen as the raw "<@…>" text both in the box you type in and in the message once sent; any ID without a space in it is now drawn as a chip.
                - link "#29864" [ref=f2e1131] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29864
              - listitem [ref=f2e1135]:
                - text: 😀
                - strong [ref=f2e1136]: Multi-codepoint emoji.
                - text: An emoji whose shortcode is several codepoints, the flags among them, is inserted whole, where only its first part reached the message.
                - link "#30213" [ref=f2e1137] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30213
                - text: ","
                - link "#30212" [ref=f2e1138] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30212
              - listitem [ref=f2e1142]:
                - text: 🔔
                - strong [ref=f2e1143]: Custom webhook names.
                - text: A webhook target named with a space or a slash is now tidied the way an automatic name always was, so it can still be edited, deleted, made the default or tested afterwards.
                - link "#29947" [ref=f2e1144] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29947
              - listitem [ref=f2e1148]:
                - text: 🪛
                - strong [ref=f2e1149]: Paginated MCP tool lists.
                - text: A server that hands its tools back a page at a time had only the first page read, so the rest were never offered to a model; the whole list is now collected before the tools are built.
                - link "Commit" [ref=f2e1150] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ffae4116a8d58a820f1770c41c69dafe4d51c881
              - listitem [ref=f2e1154]:
                - text: 💭
                - strong [ref=f2e1155]: Anthropic thinking blocks.
                - text: Open WebUI's own thinking blocks are no longer forwarded to an OpenAI-compatible backend, which since 0.11.0 made a strict server such as NVIDIA Dynamo refuse an Anthropic client's second turn; signed blocks still pass through.
                - link "#29849" [ref=f2e1156] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29849
                - text: ","
                - link "#29799" [ref=f2e1157] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29799
              - listitem [ref=f2e1161]:
                - text: 🗨️
                - strong [ref=f2e1162]: Channel model terminals.
                - text: A model with a terminal chosen in the workspace had that choice honoured in a chat but dropped where it answered in a channel or ran as a channel automation, so it worked without one; it now carries the same terminal everywhere, alongside the tools, filters and features it already carried.
                - link "Commit" [ref=f2e1163] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c78ad89934095c4e42e3f059d400a24fe5681de2
              - listitem [ref=f2e1167]:
                - text: 🧺
                - strong [ref=f2e1168]: Deleted channel messages leave no quotes.
                - text: Deleting a channel message now clears the quote of it sitting on every reply and drops it from the reply box, where a reply kept showing the deleted message and could still be sent addressed to it.
                - link "#30314" [ref=f2e1169] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30314
                - text: ","
                - link "#30313" [ref=f2e1170] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30313
              - listitem [ref=f2e1174]:
                - text: 🔌
                - strong [ref=f2e1175]: Terminal tools need a terminal.
                - text: A model was offered the tools that read your terminal and type into it whether or not the chat had a terminal switched on and connected in your browser, so it could reach for one that was not there; those tools are now handed over only for the terminal the chat has open.
                - link "Commit" [ref=f2e1176] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ca1eefe2937081b010ffef3985997d17d3332fa3
                - text: ","
                - link "Commit" [ref=f2e1177] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1ddba7e2c6f625fbc2c131eb24d3b9775ad898ad
              - listitem [ref=f2e1181]:
                - text: 🔤
                - strong [ref=f2e1182]: Custom header encoding.
                - text: The custom headers a connection sends are encoded once the values are filled in, so a person's name or group carrying anything beyond plain ASCII, a line break included, no longer breaks the request or reaches the other end as something else.
                - link "Commit" [ref=f2e1183] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7a4a4b93dca34f8ce0c481b180d3eea23797e984
              - listitem [ref=f2e1187]:
                - text: 🆎
                - strong [ref=f2e1188]: Chromium spellcheck corrections.
                - text: Picking a suggestion from the browser's own spelling menu in the message box did nothing, or put the misspelling straight back, because a highlight meant for the notes editor was being drawn over the selection and rebuilding the text underneath it, taking the browser's spelling marks with it; that highlight is now kept out of the message box and only drawn where the editor is not in use.
                - link "#29952" [ref=f2e1189] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29952
                - text: ","
                - link "#29944" [ref=f2e1190] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29944
              - listitem [ref=f2e1194]:
                - text: 🈁
                - strong [ref=f2e1195]: IME composition while renaming.
                - text: Confirming a chat rename with Enter or Escape part way through typing with an input method editor now finishes the composition without saving or cancelling the rename, where the key press acted at once.
                - link "Commit" [ref=f2e1196] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/85146206f60a22385ed27dae30d4f00e7e2675eb
              - listitem [ref=f2e1200]:
                - text: 🐳
                - strong [ref=f2e1201]: Dotless host addresses.
                - text: With local web fetching turned on, an address pointing at a container name on the same network, "http://apprise:8000" and the like, is now accepted rather than refused as invalid.
                - link "#29945" [ref=f2e1202] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29945
                - text: ","
                - link "#28161" [ref=f2e1203] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28161
              - listitem [ref=f2e1207]:
                - text: 🪧
                - strong [ref=f2e1208]: False skill mentions.
                - text: Something written as "<$fh>" in a message, as Perl and other languages do, was taken for a mention of a skill and quietly removed before the model saw it, and drawn on screen as a chip; only mentions naming a skill that exists and is turned on are treated as mentions now.
                - link "Commit" [ref=f2e1209] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0edd731c7422870aa109fd0b758c6d68c06655da
              - listitem [ref=f2e1213]:
                - text: 🎒
                - strong [ref=f2e1214]: Skill settings survive saving.
                - text: Saving a skill from its editor cleared the tags and translations it carried and switched it back on where it had been disabled, and all of that now survives the save.
                - link "#30185" [ref=f2e1215] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30185
              - listitem [ref=f2e1219]:
                - text: 🫥
                - strong [ref=f2e1220]: Webhook avatar forwarding.
                - text: Turning "ENABLE_PROFILE_IMAGE_URL_FORWARDING" off stops browsers being sent on to outside picture addresses, and a channel webhook's picture was sent on regardless; it now serves the built-in picture like the rest, in the webhooks dialog as well as the message list, where the dialog had been sending every viewer's browser straight to the outside address.
                - link "#29889" [ref=f2e1221] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29889
                - text: ","
                - link "#29892" [ref=f2e1222] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29892
              - listitem [ref=f2e1226]:
                - text: 🪟
                - strong [ref=f2e1227]: Statistics window origin.
                - text: The window that shares chat statistics with the community accepted requests from any page that opened it and answered to anywhere; it now reads and replies only where the community site is at the other end.
                - link "#29918" [ref=f2e1228] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29918
              - listitem [ref=f2e1232]:
                - text: 🖼️
                - strong [ref=f2e1233]: Tool image rendering.
                - text: Where a tool answered with an image tucked inside an object or a list rather than on its own, the image was written into the conversation as its raw text, a single screenshot costing hundreds of thousands of tokens and crowding out everything else; such an image is now taken out wherever it sits and attached to the reply, so the model is handed the picture and you see it. An older fault that let every second image through untouched goes with it, and in a saved chat such an image is now kept as a file and referred to rather than written into the conversation itself, so the chat stays small.
                - link "#29665" [ref=f2e1234] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29665
                - text: ","
                - link "#29208" [ref=f2e1235] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29208
                - text: ","
                - link "Commit" [ref=f2e1236] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d372bec70427fe2d568e052ce5e1529e2ad41da9
              - listitem [ref=f2e1240]:
                - text: ⏱️
                - strong [ref=f2e1241]: Stopped reply state.
                - text: Pressing stop saved the reply as finished while the parts inside it were still marked as running, so a block went on reading "Thinking..." or "Executing..." and came back that way after every reload; those parts are now closed off as the reply is stopped, and an open tab settles at once rather than only after a reload, while a tool call still waiting for your approval keeps its prompt.
                - link "#29495" [ref=f2e1242] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29495
                - text: ","
                - link "#29281" [ref=f2e1243] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29281
              - listitem [ref=f2e1247]:
                - text: 🩺
                - strong [ref=f2e1248]: Knowledge sync errors.
                - text: A knowledge base sync that fails now names the file it happened on and what the browser said, rather than reporting nothing beyond "Error accessing directory".
                - link "#29507" [ref=f2e1249] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29507
              - listitem [ref=f2e1253]:
                - text: 🚧
                - strong [ref=f2e1254]: Terminal proxy restrictions.
                - text: Requests passed through to a terminal server are now refused where they aim at that server's administrative endpoints, are not followed on to somewhere else, and are turned away where the path carries characters a parser would rewrite.
                - link "Commit" [ref=f2e1255] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/51bb8cb142f72503e861eeee25ae4dc73c26c36b
              - listitem [ref=f2e1259]:
                - text: ⛔
                - strong [ref=f2e1260]: Malformed tool calls.
                - text: Where a model asked for a tool with arguments that were not an object at all, a bare list or string, the reply stopped there; the model is now told what was wrong with the call and can try again.
                - link "Commit" [ref=f2e1261] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fed94c9f5af8a59660425d52df09e15fbedb25bc
              - listitem [ref=f2e1265]:
                - text: 📡
                - strong [ref=f2e1266]: Broken stream reporting.
                - text: Where something failed part way through streaming an answer out of "/api/chat/completions", the stream simply stopped, leaving a client waiting on an answer that would never finish; it now closes with an error and a proper end of stream.
                - link "Commit" [ref=f2e1267] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c0fb36c9b833a85a3a7364e195cf54f3d6c7a787
              - listitem [ref=f2e1271]:
                - text: 🧷
                - strong [ref=f2e1272]: Chat unblocked after an error.
                - text: A reply that failed, on a content filter or an exhausted quota, left the chat turning away everything you typed after it and stopped the message queue. Only the failed reply now ends, so the chat carries on and the other replies in a multi-model answer keep writing.
                - link "Commit" [ref=f2e1273] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/dbb17a5725f9d7f844a6eee63ffca0bd077c7d94
              - listitem [ref=f2e1277]:
                - text: 🫙
                - strong [ref=f2e1278]: Empty failed replies in history.
                - text: An assistant turn that ended in an error with nothing written is no longer handed back to the model as part of the conversation when you send your next message.
                - link "Commit" [ref=f2e1279] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/dbb17a5725f9d7f844a6eee63ffca0bd077c7d94
              - listitem [ref=f2e1283]:
                - text: 📭
                - strong [ref=f2e1284]: Empty page uploads.
                - text: Adding a web address to a knowledge base that came back without any text failed with a bare "Error uploading file" and, where the upload itself was refused, left the row sitting in the list; the reason now reaches you as it was given, and the row is taken away.
                - link "Commit" [ref=f2e1285] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6786ae1797eadaad7464a147213790e2d272822b
              - listitem [ref=f2e1289]:
                - text: 🎞️
                - strong [ref=f2e1290]: Tool embed scope.
                - text: The frames a tool call can ask to have shown, which run scripts of their own, were drawn wherever a message was rendered, a channel among them; they are now drawn only in the replies of the chat you are in, and never in a channel.
                - link "#29985" [ref=f2e1291] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29985
              - listitem [ref=f2e1295]:
                - text: 🚰
                - strong [ref=f2e1296]: Rejected picture addresses.
                - text: A model entry carrying a picture address the server refuses no longer leaves that address in memory, where anyone signed in could pile them up.
                - link "#29971" [ref=f2e1297] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29971
              - listitem [ref=f2e1301]:
                - text: 🖌
                - strong [ref=f2e1302]: Editing a stored image.
                - text: Asking a model to edit an image this instance already holds now works whatever host its address names, where a container name, a default port or a self-composed host made the edit fail with a generic loading error.
                - link "#29691" [ref=f2e1303] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29691
                - text: ","
                - link "#29220" [ref=f2e1304] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29220
              - listitem [ref=f2e1308]:
                - text: 🧪
                - strong [ref=f2e1309]: Memory replies carry less.
                - text: The memory tool no longer hands the model each memory's stored metadata, and a memory now records the model's id rather than the whole model entry.
                - link "Commit" [ref=f2e1310] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e9a0164690a8b1e190bdc8f4613e9d918b26d327
              - listitem [ref=f2e1314]:
                - text: 🔇
                - strong [ref=f2e1315]: Memory fully off.
                - text: With memory switched off, stored memories are no longer folded into a reply's context and the memory tools are no longer offered to the model, where both went on reaching it behind the switch.
                - link "#30228" [ref=f2e1316] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30228
                - text: ","
                - link "#30227" [ref=f2e1317] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30227
              - listitem [ref=f2e1321]:
                - text: 🧠
                - strong [ref=f2e1322]: Memory review behind the switch.
                - text: The background review that drafts new memories from a conversation no longer runs when memories are switched off or the account is barred from them, where it went on spending a task-model call every interval turn and failing at the write.
                - link "#30309" [ref=f2e1323] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30309
              - listitem [ref=f2e1327]:
                - text: 🏗️
                - strong [ref=f2e1328]: Terminal server save button.
                - text: Saving a terminal server now waits for the save to finish before the dialog closes and cannot be set off twice by a second click.
                - link "Commit" [ref=f2e1329] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1cdd7aa459d6e96905324b452600ff56369d8a4e
              - listitem [ref=f2e1333]:
                - text: 🗺️
                - strong [ref=f2e1334]: Terminal file panel paths.
                - text: The file panel beside a terminal now opens the file a model just wrote even when it is named with a relative path, where the panel could not match the name, jumped to the root and dragged the session's working directory with it.
                - link "#30282" [ref=f2e1335] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30282
                - text: ","
                - link "#30051" [ref=f2e1336] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30051
              - listitem [ref=f2e1340]:
                - text: 🍴
                - strong [ref=f2e1341]: Forked chat folder.
                - text: Forking a chat put the copy in the original's folder even where you cannot write to that folder; it is now created outside any folder unless you can.
                - link "#30069" [ref=f2e1342] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30069
              - listitem [ref=f2e1346]:
                - text: 🪢
                - strong [ref=f2e1347]: Dropping a folder in place.
                - text: Dragging a folder onto the folder it already sits in failed with "Folder already exists", and is now taken for the no-op it is.
                - link "#30169" [ref=f2e1348] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30169
              - listitem [ref=f2e1352]:
                - text: 🗝️
                - strong [ref=f2e1353]: Read-only folders read-only everywhere.
                - text: A folder shared with you as a viewer no longer shows its edit controls on the empty-chat page, where they appeared and a save went through or failed depending on rights the page never checked.
                - link "Commit" [ref=f2e1354] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ee3ece1e2b8c9a38c94faf354ca020d66aba801d
              - listitem [ref=f2e1358]:
                - text: 🚿
                - strong [ref=f2e1359]: Deleting a folder, keeping chats.
                - text: Removing a folder while keeping the chats inside it was refused for an account not allowed to delete chats, even though nothing was being deleted, and it now goes through.
                - link "#30163" [ref=f2e1360] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30163
              - listitem [ref=f2e1364]:
                - text: 🏷️
                - strong [ref=f2e1365]: Tag cleanup after deletion.
                - text: An administrator deleting someone else's chat tidied unused tags out of their own account rather than the owner's, leaving the owner with tags nothing points at.
                - link "#30171" [ref=f2e1366] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30171
              - listitem [ref=f2e1370]:
                - text: 🌱
                - strong [ref=f2e1371]: Forking past an unfinished reply.
                - text: A chat that held an interrupted reply anywhere in it refused every fork from then on and never recovered; forking now waits only on a reply actually being generated, and a turn paused for tool approval still forks with its prompt showing.
                - link "#30131" [ref=f2e1372] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30131
                - text: ","
                - link "#30128" [ref=f2e1373] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30128
              - listitem [ref=f2e1377]:
                - text: 💾
                - strong [ref=f2e1378]: Deleted tool memory.
                - text: Deleting a tool or a function left the whole of its code in memory for as long as the server ran; it is now let go of along with the rest.
                - link "#29983" [ref=f2e1379] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29983
              - listitem [ref=f2e1383]:
                - text: 🐌
                - strong [ref=f2e1384]: Sign-in rate limiting.
                - text: Counting sign-in attempts through Redis no longer stops the whole worker until Redis answers, so a slow Redis stops freezing every other request with it.
                - link "#29977" [ref=f2e1385] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29977
              - listitem [ref=f2e1389]:
                - text: ♻️
                - strong [ref=f2e1390]: Session pool cleanup.
                - text: The task that clears out abandoned websocket sessions now carries on through an error from Redis instead of ending for good, and stops properly at shutdown.
                - link "#29976" [ref=f2e1391] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29976
                - text: ","
                - link "#29979" [ref=f2e1392] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29979
              - listitem [ref=f2e1396]:
                - text: 🛰️
                - strong [ref=f2e1397]: Direct connections across workers.
                - text: A reply streamed over a direct connection no longer goes quiet part way through where several servers share their websocket traffic through Redis; the events it lives on now travel between workers the way the rest already did.
                - link "Commit" [ref=f2e1398] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0180efecf362d487e0c30f040f5948c325fbe337
              - listitem [ref=f2e1402]:
                - text: 🫧
                - strong [ref=f2e1403]: Empty document ids.
                - text: A save arriving for a document with no id at all was filed against that empty id and never cleared, so anyone signed in could pile them up; nothing is filed for it now.
                - link "#29980" [ref=f2e1404] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29980
              - listitem [ref=f2e1408]:
                - text: 🔬
                - strong [ref=f2e1409]: Page fetch CPU spin.
                - text: Fetching a page through the browser-driven loader never returned where that page opened a WebSocket, holding a worker thread at full CPU for the life of the process and costing another core on every further fetch, which left the whole instance slow.
                - link "#30050" [ref=f2e1410] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30050
                - text: ","
                - link "#30024" [ref=f2e1411] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30024
              - listitem [ref=f2e1415]:
                - text: 🔁
                - strong [ref=f2e1416]: Duplicate search tracebacks.
                - text: A vector database outage wrote a full traceback twice for every collection and query pair, turning one outage into hundreds of identical stack traces per message on every replica; a single record now names every collection that failed.
                - link "#29981" [ref=f2e1417] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29981
              - listitem [ref=f2e1421]:
                - text: 🧯
                - strong [ref=f2e1422]: Page fetch logging.
                - text: Fetching a page through the browser-driven loader filled the log with tracebacks where the page closed while it was still pulling pieces of itself, as sites behind Cloudflare and similar do; those requests are now let go of before the page closes.
                - link "#29325" [ref=f2e1423] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29325
                - text: ","
                - link "#28869" [ref=f2e1424] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28869
              - listitem [ref=f2e1428]:
                - text: 📤
                - strong [ref=f2e1429]: Tool export scope.
                - text: Exporting all tools at once returned every tool the account could see, the source of a tool shared for reading included; it now returns only the tools it may edit, matching the single-tool export and the way models already export.
                - link "#29310" [ref=f2e1430] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29310
              - listitem [ref=f2e1434]:
                - text: 🗳️
                - strong [ref=f2e1435]: Partial workspace exports.
                - text: Exporting the prompts or the models from the workspace wrote out only the page you happened to be looking at, so most of them were quietly left out of the file; both now export everything you are allowed to.
                - link "#30187" [ref=f2e1436] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30187
              - listitem [ref=f2e1440]:
                - text: 🧳
                - strong [ref=f2e1441]: Imported chats keep more.
                - text: A chat brought back from an export arrived unpinned and unarchived and without the variables it was saved with, and all three now survive the round trip.
                - link "#30155" [ref=f2e1442] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30155
                - text: ","
                - link "#30151" [ref=f2e1443] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30151
              - listitem [ref=f2e1447]:
                - text: 🗂️
                - strong [ref=f2e1448]: Unarchiving from search.
                - text: The menu on a search result offered to archive a chat that was already archived and said it had been archived when it had been brought back, and it now names and reports whichever of the two it did.
                - link "#30177" [ref=f2e1449] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30177
              - listitem [ref=f2e1453]:
                - text: 🙈
                - strong [ref=f2e1454]: Folder filters with no match.
                - text: A chat search narrowed by a folder name that matches no folder now finds nothing, where the folder filter was quietly dropped and every chat came back.
                - link "#30273" [ref=f2e1455] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30273
                - text: ","
                - link "#29959" [ref=f2e1456] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/29959
              - listitem [ref=f2e1460]:
                - text: 🧹
                - strong [ref=f2e1461]: Sidebar after bulk actions.
                - text: Archiving, deleting or unarchiving every chat at once, or importing a batch of them, left the folders and the pinned chats in the sidebar showing what was no longer there until the page was reloaded, and a bulk action that failed no longer reports success.
                - link "Commit" [ref=f2e1462] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8b3ee2827241ccc952a3073b2a6bbfad5df01827
              - listitem [ref=f2e1466]:
                - text: 🔐
                - strong [ref=f2e1467]: Model pictures follow model access.
                - text: The picture belonging to a model is now shown only to people who can see that model, where anyone signed in could fetch it and tell an existing model from an unknown one by which picture came back.
                - link "#29700" [ref=f2e1468] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29700
              - listitem [ref=f2e1472]:
                - text: 🚪
                - strong [ref=f2e1473]: Webhook pictures follow channel access.
                - text: The picture belonging to a channel webhook is now shown only to people with access to that channel, where anyone signed in could fetch it or be sent on to wherever it pointed, and it is refused outright where channels are turned off.
                - link "#29703" [ref=f2e1474] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29703
              - listitem [ref=f2e1478]:
                - text: 📎
                - strong [ref=f2e1479]: Safer Word document previews.
                - text: Previewing a Word document no longer renders an HTML sub-document embedded inside it, and a link in one opens only where it points at a web address, a mail address or a telephone number.
                - link "#29699" [ref=f2e1480] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29699
              - listitem [ref=f2e1484]:
                - text: 🚦
                - strong [ref=f2e1485]: Citation link schemes.
                - text: A source attached to a reply now opens only where it points at a web address, falling back to the panel that shows the source rather than following anything else.
                - link "#29701" [ref=f2e1486] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29701
              - listitem [ref=f2e1490]:
                - text: 🈚
                - strong [ref=f2e1491]: Citation chips inside formatted text.
                - text: A citation inside bold, italic or linked text now renders its chip, where the formatting took it and the citation vanished from the sentence.
                - link "#30278" [ref=f2e1492] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30278
                - text: ","
                - link "#30277" [ref=f2e1493] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30277
              - listitem [ref=f2e1497]:
                - text: 🐍
                - strong [ref=f2e1498]: Saving a tool or function.
                - text: Saving a tool or function in the admin pages no longer fails with a missing module error from the built-in code formatter, which was not installing everything it needed.
                - link "#29503" [ref=f2e1499] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29503
              - listitem [ref=f2e1503]:
                - text: 🛠️
                - strong [ref=f2e1504]: Tool request duplication.
                - text: A tool that writes through an address carrying part of its input no longer has that part repeated in the body of the request as well, which servers checking their input strictly turned away, so those calls now go through.
                - link "#29717" [ref=f2e1505] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29717
                - text: ","
                - link "#29716" [ref=f2e1506] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29716
              - listitem [ref=f2e1510]:
                - text: 🍎
                - strong [ref=f2e1511]: Answers survive on Apple Silicon.
                - text: Asking a question that searches a knowledge base with a locally run reranking model no longer takes the whole server down on a Mac, losing the answer and the connection with it.
                - link "#29735" [ref=f2e1512] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29735
                - text: ","
                - link "#29722" [ref=f2e1513] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29722
              - listitem [ref=f2e1517]:
                - text: 📚
                - strong [ref=f2e1518]: Web results stop being cited.
                - text: Pages a web search only listed are no longer offered to the model as things to cite, which had it attaching a result id to text from a different result and the citations panel resolving that to a title that looked right.
                - link "#29631" [ref=f2e1519] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29631
                - text: ","
                - link "#29627" [ref=f2e1520] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29627
              - listitem [ref=f2e1524]:
                - text: 🔎
                - strong [ref=f2e1525]: SearchApi errors, news and links.
                - text: Web search through searchapi.io now reports a bad key instead of coming back empty, reads the news results it returns alongside its ordinary ones, and hands the web loader the resolved destination link, so citations stop pointing at a redirect page.
                - link "#30308" [ref=f2e1526] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30308
                - text: ","
                - link "#30305" [ref=f2e1527] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30305
              - listitem [ref=f2e1531]:
                - text: 🔼
                - strong [ref=f2e1532]: Honest version checks.
                - text: An instance that cannot reach the release listing now says the check failed, instead of reporting whatever it is running as the newest version and recording nothing about it.
                - link "#29626" [ref=f2e1533] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29626
                - text: ","
                - link "#29580" [ref=f2e1534] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29580
              - listitem [ref=f2e1538]:
                - text: 🏟️
                - strong [ref=f2e1539]: Arena models report their errors.
                - text: A message to an arena model whose provider answers with an error now shows that error in the chat, where it used to fail on something unrelated and leave the real reason unsaid, and titles and tags no longer break the same way.
                - link "#29662" [ref=f2e1540] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29662
                - text: ","
                - link "#29658" [ref=f2e1541] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29658
              - listitem [ref=f2e1545]:
                - text: 🏳️
                - strong [ref=f2e1546]: Nameless tool calls fail once.
                - text: A model endpoint that sends a tool call with no name at all now has that call fail on the spot, rather than the missing name being kept, stored with the message and sent back on the next turn for the endpoint to reject.
                - link "#29690" [ref=f2e1547] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29690
                - text: ","
                - link "#29686" [ref=f2e1548] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29686
              - listitem [ref=f2e1552]:
                - text: 🧹
                - strong [ref=f2e1553]: Direct connections stop leaking listeners.
                - text: A server talking to a direct connection no longer leaves a listener behind for every request that ends any way but a clean finish, which grew without limit while a connection kept failing.
                - link "#29509" [ref=f2e1554] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29509
              - listitem [ref=f2e1558]:
                - text: 🚀
                - strong [ref=f2e1559]: Cheaper model refreshes.
                - text: The model registry shared through Redis is now written only when the models themselves change, rather than on every refresh because of the countdown Ollama attaches to a model it holds in memory.
                - link "Commit" [ref=f2e1560] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/649c012ecf308a994ea180127f7f8f94d0aec311
              - listitem [ref=f2e1564]:
                - text: ✍️
                - strong [ref=f2e1565]: Continued reply text.
                - text: Asking for the rest of a cut-off reply in a temporary chat replaced what was on screen with only the new text, because the message being continued was read back from the saved chat it did not have. It is now taken from the request before the model is called, the continuation joins the same message instead of arriving as a second one, on a connection whose provider is set to llama.cpp the model is told to carry on from the text it is handed rather than repeat it back, opening the result in the message editor no longer shows a line break where the two halves meet, and, where haptic feedback is switched on, a continuation buzzes as it streams like any other reply.
                - link "Commit" [ref=f2e1566] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/77d2000eb79e1cb6ae2004d40e8cca8c9e754cd0
