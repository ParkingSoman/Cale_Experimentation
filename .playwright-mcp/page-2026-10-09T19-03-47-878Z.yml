              - listitem [ref=f2e2001]:
                - text: 🧠
                - strong [ref=f2e2002]: Large tool calls stream faster through Anthropic-compatible clients.
                - text: When a streamed tool call sends a large block of arguments, Open WebUI now waits until that block can actually be complete before checking it, instead of doing the same expensive check again on every tiny piece.
                - link "#28858" [ref=f2e2003] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28858
              - listitem [ref=f2e2007]:
                - text: 🛑
                - strong [ref=f2e2008]: Stop works across instances.
                - text: Stopping a response now takes effect on deployments that spread people across several instances backed by a Redis cluster, instead of the reply continuing to the end regardless.
                - link "#29165" [ref=f2e2009] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29165
                - text: ","
                - link "#19840" [ref=f2e2010] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/19840
              - listitem [ref=f2e2014]:
                - text: 🎯
                - strong [ref=f2e2015]: Fewer needless chat reloads.
                - text: A conversation holding an older unfinished reply no longer reloads itself each time some other response in it finishes, reloading only for the reply the update actually concerns.
                - link "Commit" [ref=f2e2016] [cursor=pointer]:
