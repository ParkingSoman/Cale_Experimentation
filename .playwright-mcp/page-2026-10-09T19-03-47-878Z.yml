              - listitem [ref=f2e1941]:
                - text: ♿
                - strong [ref=f2e1942]: Wider accessibility mode coverage.
                - text: Accessibility mode now lifts the contrast of more of the interface, including muted text, table text, icons, the colours elements change to on hover, and the highlight behind sidebar and menu items you point at, so low-contrast areas meet the level the accessibility guidelines ask for in both light and dark themes, and the close button on the folder dialog now announces itself to screen readers, as do document and slide previews, which can now be reached with the keyboard.
