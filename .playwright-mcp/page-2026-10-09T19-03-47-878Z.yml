              - listitem [ref=f2e1980]:
                - text: ⌨️
                - strong [ref=f2e1981]: Preview shortcuts stay in the preview.
                - text: Arrow keys now page a document or slide preview only while that preview has focus, instead of paging it from anywhere on the page and taking the arrow keys away from whatever you were typing in.
                - link "Commit" [ref=f2e1982] [cursor=pointer]:
