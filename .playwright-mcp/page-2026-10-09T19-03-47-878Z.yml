                - link "Commit" [ref=f2e2600] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1674e5a9ef835696f0963cdbcf477c8b92ce0b8a
              - listitem [ref=f2e2604]:
                - text: 🔠
                - strong [ref=f2e2605]: Interface scaling throughout.
                - text: The UI Scale setting and your browser's own text size now resize the whole interface consistently, including the sidebar, menus, dialogs, and file browser, rather than leaving parts of it fixed.
                - link "Commit" [ref=f2e2606] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/30d08a42f8b0c32cc64dccd81203cc760651584a
                - text: ","
                - link "Commit" [ref=f2e2607] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b5f86e6a433b519e30a5a6f1b0a5bf985939c9a8
                - text: ","
                - link "Commit" [ref=f2e2608] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ec03e8814403422a6ab3dc62f4239fd7af439361
                - text: ","
                - link "Commit" [ref=f2e2609] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/72a909fd2f3ac8d67554f6c85bc1723934454e2d
              - listitem [ref=f2e2613]:
                - text: 🏷️
                - strong [ref=f2e2614]: Named writing blocks.
                - text: When a model wraps a draft such as an email in a writing block, the block is now titled with its subject and shows the recipient beside it, rather than every block reading simply as Writing.
                - link "#28280" [ref=f2e2615] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28280
                - text: ","
                - link "#28198" [ref=f2e2616] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28198
              - listitem [ref=f2e2620]:
                - text: 🤝
                - strong [ref=f2e2621]: Files for delegated tasks.
                - text: A task handed to a sub-agent can now carry the attachments it needs, so an image or document from your conversation reaches the sub-agent instead of arriving as a file reference it cannot open and may answer about anyway.
                - link "Commit" [ref=f2e2622] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5ec16e76e6402980b39c26923b8ee26278f0b243
                - text: ","
                - link "#28213" [ref=f2e2623] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28213
              - listitem [ref=f2e2627]:
                - text: 📟
                - strong [ref=f2e2628]: Terminal availability and scope.
                - text: Administrators can now decide for each managed terminal whether it appears in chats and in automations at all, and whether everyone shares a single workspace or each chat or automation gets its own, with per chat terminals waiting until the conversation has been saved.
                - link "Commit" [ref=f2e2629] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/009999f3636b1a3451f8fe55232e6ab132a64e66
              - listitem [ref=f2e2633]:
                - text: 🔒
                - strong [ref=f2e2634]: Read-only files in the terminal browser.
                - text: Files and folders you are not allowed to change are now labelled read-only, with uploading, editing, renaming, moving, and deleting turned off for them rather than failing at the moment you try.
                - link "Commit" [ref=f2e2635] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2dadc5435af77b0638af69200e3af1b9654417b6
              - listitem [ref=f2e2639]:
                - text: 🔐
                - strong [ref=f2e2640]: Terminals that use your own login.
                - text: Managed terminals configured for session authentication now authenticate the terminal connection with your own token, where it previously sent no credentials at all.
                - link "Commit" [ref=f2e2641] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2dadc5435af77b0638af69200e3af1b9654417b6
              - listitem [ref=f2e2645]:
                - text: 🎟
                - strong [ref=f2e2646]: Setting up a tool server that uses OAuth.
                - text: "Adding one is now easier to get right: the connection dialog can authorize the account from the dialog itself, the check button tests the sign-in details rather than reporting a connection failure that was never going to succeed without them, and it is now labelled for what it does rather than suggesting it verifies the whole connection."
                - link "Commit" [ref=f2e2647] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f822605b3563c57030aa200492f68572cadcc4da
                - text: ","
                - link "#28552" [ref=f2e2648] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28552
              - listitem [ref=f2e2652]:
                - text: 🪤
                - strong [ref=f2e2653]: Control over what embedded pages may do.
                - text: Two new interface settings decide whether pages shown inside a chat, such as an artifact or an HTML preview, may run scripts and start downloads.
                - link "Commit" [ref=f2e2654] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3c66d639e31ba8a7477d337b37d8d671ea2430cf
                - text: ","
                - link "#28924" [ref=f2e2655] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28924
                - text: ","
                - link "Commit" [ref=f2e2656] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/842c1f9d677c0d9940cccdd18e34add13f746a68
              - listitem [ref=f2e2660]:
                - text: 🗄
                - strong [ref=f2e2661]: Keeping files removed from a knowledge base.
                - text: A new "ENABLE_KNOWLEDGE_FILE_RETENTION" setting keeps the stored file and its search data when a file is taken out of a knowledge base, rather than deleting them.
                - link "Commit" [ref=f2e2662] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/363ad352fec9553469852d111bc0506b896504a6
              - listitem [ref=f2e2666]:
                - text: 🧾
                - strong [ref=f2e2667]: CSV shape in retrieval.
                - text: Turning on "ENABLE_RAG_CSV_SUMMARY" adds a short line naming the row count, data row count, column count, and column names of a CSV file to what the model sees, giving it the shape of the table alongside its contents.
                - link "Commit" [ref=f2e2668] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1b72899f246ba46ab8f7cd6aee2d56ef69217d82
              - listitem [ref=f2e2672]:
                - text: 🔭
                - strong [ref=f2e2673]: OpenSERP in the search settings.
                - text: OpenSERP can now be picked as the web search engine in the admin panel, with a field for its address, rather than only being configurable through the environment.
                - link "#27594" [ref=f2e2674] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27594
                - text: ","
                - link "#27592" [ref=f2e2675] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27592
              - listitem [ref=f2e2679]:
                - text: 🪧
                - strong [ref=f2e2680]: Profile changes from single sign-on.
                - text: A name, email address, or picture updated from an identity provider at sign-in now raises an event naming what changed, and the rest of the session uses the updated record rather than a stale copy.
                - link "Commit" [ref=f2e2681] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/927ce0eae67af1b4a856d3e82fba0601c3b40d02
              - listitem [ref=f2e2685]:
                - text: 📯
                - strong [ref=f2e2686]: Group changes from single sign-on.
                - text: Group memberships added or removed when someone signs in through an identity provider, and groups created automatically along the way, now raise the same events as the equivalent change made by an administrator or over directory sync.
                - link "#27657" [ref=f2e2687] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27657
              - listitem [ref=f2e2691]:
                - text: 🔔
                - strong [ref=f2e2692]: Sign-in and sign-out events for single sign-on.
                - text: Signing in through an identity provider now raises the same login event that signing in with a password does, and signing out says which provider the session came from, so a function can set up or tidy up an account in another system when someone arrives or leaves.
                - link "#27619" [ref=f2e2693] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27619
                - text: ","
                - link "#27613" [ref=f2e2694] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27613
              - listitem [ref=f2e2698]:
                - text: 🪛
                - strong [ref=f2e2699]: Naming background worker threads.
                - text: A new "THREAD_POOL_THREAD_NAME_PREFIX" setting labels the threads that background work runs in, so they can be told apart when reading a profile or a thread dump.
                - link "Commit" [ref=f2e2700] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4ec6ee14418edd04eaba9e34bd5868453f61df40
              - listitem [ref=f2e2704]:
                - text: 📙
                - strong [ref=f2e2705]: OpenDocument files in a temporary chat.
                - text: A text document, spreadsheet, or presentation from an office suite that uses the OpenDocument format now has its text read out in the browser when attached to a temporary chat, where the model was handed the raw archive and answered that it could not read the file.
                - link "Commit" [ref=f2e2706] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9e7c9360b744c878ae0c38aa1caf3886f27b07ab
                - text: ","
                - link "#28906" [ref=f2e2707] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/28906
              - listitem [ref=f2e2711]:
                - text: 🌍
                - strong [ref=f2e2712]: Pointing Tavily somewhere else.
                - text: A new "TAVILY_API_BASE_URL" setting sends Tavily searches and page fetches to a different address, for instances that reach the internet only through a gateway of their own or that use a compatible service.
                - link "Commit" [ref=f2e2713] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98ee2bdfd3e90faec6bfe8e7ebf5803159f379e3
                - text: ","
                - link "#28701" [ref=f2e2714] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28701
              - listitem [ref=f2e2718]:
                - text: 🪟
                - strong [ref=f2e2719]: Honest OAuth settings.
                - text: When single sign-on settings come from the environment rather than being saved in the application, the admin panel now shows them as read-only with a note naming the setting that controls this, instead of accepting edits that were silently discarded on the next restart.
                - link "#28276" [ref=f2e2720] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28276
              - listitem [ref=f2e2724]:
                - text: 📏
                - strong [ref=f2e2725]: Widening the chat controls pane.
                - text: The controls pane can now be dragged as wide as you like, where it stopped at a fixed limit regardless of screen size.
                - link "Commit" [ref=f2e2726] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0fb542b3764cefecf2366607a4685288051d1b46
              - listitem [ref=f2e2730]:
                - text: 📱
                - strong [ref=f2e2731]: Smoother sidebar on mobile.
                - text: The sidebar now follows your finger as you swipe it open or closed, responds to a quick flick, dims the page behind it as it moves, and gives every chat row a menu button you can reach without a hover you cannot perform on a touchscreen.
                - link "Commit" [ref=f2e2732] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b20bcdbba72707e3b0cf2b9a6a5f3168b464ba3c
                - text: ","
                - link "Commit" [ref=f2e2733] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/178ccb30e1253ea727fe5ccbb5cc3ca3832dc70b
                - text: ","
                - link "Commit" [ref=f2e2734] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/943294df9a03d45e2708b330e876967af3463282
                - text: ","
                - link "Commit" [ref=f2e2735] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d6679082e5c6b0b54ca00a99a88e66a53a30c7d9
                - text: ","
                - link "Commit" [ref=f2e2736] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d8ae7ed40551362922925d9d6e47ba65d3658cfd
                - text: ","
                - link "Commit" [ref=f2e2737] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/be4afd75452361ead376d9977cf2ca8cb93e55eb
                - text: ","
                - link "Commit" [ref=f2e2738] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ab41dcc487d1517f7c8c5d0b02a02cdaadedb03d
              - listitem [ref=f2e2742]:
                - text: 🚪
                - strong [ref=f2e2743]: Sidebar that stays put.
                - text: Opening and closing the sidebar is now a smooth transition that keeps your chat list loaded, instead of rebuilding the list each time.
                - link "Commit" [ref=f2e2744] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3c010951db2cc349466658d3b52234cc22dad327
                - text: ","
                - link "Commit" [ref=f2e2745] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8edab5020eaa5d47b12a572eb632a891aa29440a
                - text: ","
                - link "Commit" [ref=f2e2746] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3e9b075954b7fc9d492a7ec832550b10b0bf80ed
                - text: ","
                - link "Commit" [ref=f2e2747] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3793b0c886f57630dc31320d3c0257c933c6eca1
                - text: ","
                - link "Commit" [ref=f2e2748] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0b4b7ae5ff3c0a17b58e8e85a5fddf190e3bda14
              - listitem [ref=f2e2752]:
                - text: 👁️
                - strong [ref=f2e2753]: Turning off chat previews.
                - text: A new setting under Settings and Interface lets you switch off the preview card that appears when you hover a chat in the sidebar, useful for a quieter sidebar, for sharing your screen, or on a slow connection.
                - link "#27632" [ref=f2e2754] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27632
                - text: ","
                - link "#27639" [ref=f2e2755] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27639
              - listitem [ref=f2e2759]:
                - text: ☑️
                - strong [ref=f2e2760]: Checkboxes beside their labels.
                - text: In the model editor and the admin model defaults, each capability, feature, and tool checkbox now sits directly in front of its own label instead of at the far edge of its column, where it could look like it belonged to the next one, and the label itself can be clicked to toggle it.
                - link "#27788" [ref=f2e2761] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27788
                - text: ","
                - link "#27771" [ref=f2e2762] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27771
                - text: ","
                - link "Commit" [ref=f2e2763] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1b39ff352a2fa3b57bd7815f44c50daf96937a14
                - text: ","
                - link "Commit" [ref=f2e2764] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0f821398ca9c9ddd8da521b5f9dcf103030202e8
              - listitem [ref=f2e2768]:
                - text: ✍️
                - strong [ref=f2e2769]: Typing cursor while responding.
                - text: A blinking cursor now marks where the reply is being written, from the moment you send your message until generation finishes, in place of the previous loading placeholder.
                - link "Commit" [ref=f2e2770] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cbb3aade2b4e901c22aa9a30530634721c80b078
              - listitem [ref=f2e2774]:
                - text: ✒️
                - strong [ref=f2e2775]: Underlined text.
                - text: Underlined text now appears underlined in a reply instead of showing the markup around it, and underlining is kept when you edit in a rich text box rather than being dropped.
                - link "Commit" [ref=f2e2776] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/11db926a7b471e9477595786ef451a916174cc18
                - text: ","
                - link "#26904" [ref=f2e2777] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26904
              - listitem [ref=f2e2781]:
                - text: 📥
                - strong [ref=f2e2782]: Adding group members from a file.
                - text: Administrators can now add many people to a group at once by uploading a CSV of names and email addresses, with a template to download and a message naming any row whose address does not match an account.
                - link "Commit" [ref=f2e2783] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f3f7659da754b51c216b17b2d6def4d59071d78f
              - listitem [ref=f2e2787]:
                - text: 📑
                - strong [ref=f2e2788]: Apache Tika 4 support.
                - text: Administrators extracting document text with Tika can now choose which server version they run, from Admin Settings under Documents or through "TIKA_SERVER_VERSION", where only Tika 3 was understood before.
                - link "Commit" [ref=f2e2789] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/170ad0595d9440113721eb06375a2fc99aefaad1
                - text: ","
                - link "#28939" [ref=f2e2790] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28939
              - listitem [ref=f2e2794]:
                - text: 💓
                - strong [ref=f2e2795]: Tunable heartbeat for live updates.
                - text: A new "WEBSOCKET_HEARTBEAT_INTERVAL" setting controls how often each open tab checks in with the server, where it was fixed at 30 seconds, so a large deployment can cut background traffic that no one asked for.
                - link "Commit" [ref=f2e2796] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3c1017f6c3ffc7194f074f2cfd2ea5f49943c575
                - text: ","
                - link "#28166" [ref=f2e2797] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28166
              - listitem [ref=f2e2801]:
                - text: ⌛
                - strong [ref=f2e2802]: Expiring abandoned reply state.
                - text: A new "REDIS_RESPONSE_STREAM_TTL" setting expires the saved state of a reply that never finished, so a server killed mid-answer no longer leaves that data behind for good.
                - link "Commit" [ref=f2e2803] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/176fa462128d5298492db29c67080a4e1afc2642
              - listitem [ref=f2e2807]:
                - text: 🖨️
                - strong [ref=f2e2808]: File and image detail parts on API requests.
                - text: A request sent to the OpenAI-compatible endpoint carrying an image detail level or a file part in its message content now forwards both to providers that use the Responses API, where they were dropped, while documents attached inside Open WebUI are unaffected because those still go through knowledge retrieval.
                - link "Commit" [ref=f2e2809] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ca4e07a40b4ff11989a25d84b517d3d0049f93ae
              - listitem [ref=f2e2813]:
                - text: 🧺
                - strong [ref=f2e2814]: Leaner stored document metadata.
                - text: Bulky extraction details such as page layouts, tables and detected languages are no longer kept alongside a document in the vector store, and a new "RAG_METADATA_MAX_VALUE_CHARS" setting drops any remaining oversized value, falling back to the configured upload size limit so a document that expands enormously while being read cannot exhaust a server's memory.
                - link "Commit" [ref=f2e2815] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/278e97589e71d119b887d5bca9d6ae32912d1dff
                - text: ","
                - link "Commit" [ref=f2e2816] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e3a7a64d82ab2dd06c681ce85027367ccc8234d4
                - text: ","
                - link "#29025" [ref=f2e2817] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29025
              - listitem [ref=f2e2821]:
                - text: 💨
                - strong [ref=f2e2822]: No filter work on installs without filters.
                - text: A completed message on an install with no filter functions and no pipeline filters, which is the default, no longer rebuilds the whole conversation and ships it to the browser as an event nothing acts on.
                - link "Commit" [ref=f2e2823] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/28f2965934f5b6fba0e0c38a15b2af6ee790819f
              - listitem [ref=f2e2827]:
                - text: 📂
                - strong [ref=f2e2828]: Opening a file in a knowledge base.
                - text: A file listed in a knowledge base can now be opened and read straight from that list, where the name was shown but nothing happened when it was clicked.
                - link "Commit" [ref=f2e2829] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/20f35d157bc7d535091ce6a90b517c23d26486c0
                - text: ","
                - link "#28086" [ref=f2e2830] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28086
              - listitem [ref=f2e2834]:
                - text: 🧵
                - strong [ref=f2e2835]: Cheaper saving of a reply as it streams.
                - text: The resume snapshot taken on every piece of a streamed reply no longer rebuilds the whole answer each time, so the cost of a save stops growing with the length of the reply.
                - link "#28821" [ref=f2e2836] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28821
              - listitem [ref=f2e2840]:
                - text: 📀
                - strong [ref=f2e2841]: Less repeated work setting up built-in tools.
                - text: Every chat request no longer rebuilds a fresh copy of each built-in tool's definition from scratch, which was paid once per tool on every message.
                - link "#28860" [ref=f2e2842] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28860
              - listitem [ref=f2e2846]:
                - text: 🕹️
                - strong [ref=f2e2847]: Control over what a terminal port preview may reach.
                - text: A new interface setting decides whether a previewed port runs with access to same-origin browser APIs, so you can lock a preview out of them on installs where previews serve content you do not fully trust.
                - link "Commit" [ref=f2e2848] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/54d7a223707f03172efbb9e754db6e69709956d0
              - listitem [ref=f2e2852]:
                - text: ♿
                - strong [ref=f2e2853]: Improved UI accessibility.
                - text: A closed sidebar is no longer reachable by keyboard or announced by screen readers, the tool call blocks in a response can now be expanded with the keyboard, the buttons that normally appear on hover, such as message actions, file removal, and chat menus, now appear when you reach them with the keyboard as well, whatever you have tabbed to is marked with a clear outline throughout the application, and the rows in the integrations menu now tell a screen reader whether each tool or feature is switched on.
                - link "Commit" [ref=f2e2854] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/48a5696042b414f6511911afa72b3289ad2797b9
                - text: ","
                - link "Commit" [ref=f2e2855] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bd250a0e2431f8c2c7e2f4a34c5327f21fc77d4b
                - text: ","
                - link "Commit" [ref=f2e2856] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c8f8fa451a60974dfa4ebaf7cd6163ef30c45fd6
                - text: ","
                - link "Commit" [ref=f2e2857] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/29541cbb52659a8a6ee22d255f14e6d2f168a09b
                - text: ","
                - link "Commit" [ref=f2e2858] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ac0368b4abe4c880f715b236ee0024826b2e3e7a
                - text: ","
                - link "Commit" [ref=f2e2859] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c086b80313fe0f5ce60831a0d150f695646c66e4
                - text: ","
                - link "#27667" [ref=f2e2860] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27667
                - text: ","
                - link "#17150" [ref=f2e2861] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/17150
              - listitem [ref=f2e2865]:
                - text: 🔄
                - strong [ref=f2e2866]: General improvements.
                - text: Various improvements were implemented across the application to enhance performance, stability, and security.
              - listitem [ref=f2e2870]:
                - text: 🌐
                - strong [ref=f2e2871]: Translation updates.
                - text: Faroese was added, and translations for Slovenian, Hungarian, Finnish, Korean, Portuguese (Brazil), Catalan, and French were enhanced and expanded.
          - generic [ref=f2e2872]:
            - generic [ref=f2e2873]: fixed
            - generic [ref=f2e2874]:
              - listitem [ref=f2e2878]:
                - text: 🛡️
                - strong [ref=f2e2879]: Security Advisory
                - text: ": This release includes security and access-control fixes. We recommend updating production deployments at your earliest convenience. Not all security fixes in this version may be enumerated in the fixed section. Some may be withheld for a short time to give administrators time to upgrade."
                - link "Advisories" [ref=f2e2880] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/security
              - listitem [ref=f2e2884]:
                - text: 🛂
                - strong [ref=f2e2885]: Knowledge search reaching past what you may read.
                - text: Searching knowledge bases now applies the list of collections you are allowed to open, where that restriction was handed to the vector store and silently discarded, so results could include material from knowledge bases you have no access to.
                - link "Commit" [ref=f2e2886] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1d6d4e6e6647e1d403438ede7bd9ba20bc4cc8f6
              - listitem [ref=f2e2890]:
                - text: 💣
                - strong [ref=f2e2891]: Documents that unpack far beyond their size.
                - text: A Word, Excel, PowerPoint, OpenDocument or EPUB file that expands to far more than it stores is now rejected before it is read, where one could previously be used to exhaust a server's memory.
                - link "Commit" [ref=f2e2892] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2a0274a0a039dbe0a1ad4d24003b085aae7b896b
              - listitem [ref=f2e2896]:
                - text: ✂️
                - strong [ref=f2e2897]: Long replies cut off partway.
                - text: A single oversized piece of a streamed reply, such as a long reasoning trace or a turn carrying many tool calls, no longer ends the answer early with a misleading error about byte counts, which affected every default installation.
                - link "#28114" [ref=f2e2898] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28114
                - text: ","
                - link "#25664" [ref=f2e2899] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/25664
              - listitem [ref=f2e2903]:
                - text: 🚧
                - strong [ref=f2e2904]: Web address checks that could be skipped.
                - text: The fetchable-address test and the operator's web fetch filter list now run on every outgoing request, where a proxied or already-open connection could bypass them and a filter entry written as an address range silently matched nothing at all.
                - link "#27823" [ref=f2e2905] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27823
              - listitem [ref=f2e2909]:
                - text: 🧑‍💻
                - strong [ref=f2e2910]: Code execution reachable through a tag in a reply.
                - text: On installs using native function calling, the older path that runs code found inside a tag in the model's reply is no longer active alongside the built-in tool, so code execution happens only through an explicit tool call.
                - link "#29024" [ref=f2e2911] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29024
              - listitem [ref=f2e2915]:
                - text: ⌚
                - strong [ref=f2e2916]: Recurrence rules that could tie up the server.
                - text: How often an automation repeats is now taken from the rule the scheduler actually parsed rather than from the text of the rule, so a crafted rule can no longer disagree with what gets scheduled and walk the server through an unbounded run of occurrences, and a rule carrying a time zone on its start date now schedules instead of erroring.
                - link "Commit" [ref=f2e2917] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/067114c28038b77045a3a1983e2e2719b1a32ad8
              - listitem [ref=f2e2921]:
                - text: 🗝️
                - strong [ref=f2e2922]: Changing a password now ends other sessions.
                - text: Changing your password, or an administrator resetting it for you, now stops every device that was already signed in, where they had stayed signed in on the old password until their session expired on its own, up to four weeks by default; the device making the change is signed out too and asked to sign in again, and this requires Redis, without which nothing can be revoked and a warning is now logged saying so.
                - link "#28725" [ref=f2e2923] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28725
                - text: ","
                - link "#28647" [ref=f2e2924] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/28647
              - listitem [ref=f2e2928]:
                - text: 🧬
                - strong [ref=f2e2929]: Workspace models shadowing a real one.
                - text: Someone without administrator rights can no longer create, import, or edit a workspace model so that it takes over the identity of a model served by a connected provider, where doing so would have changed what everyone else got when they picked that model.
                - link "Commit" [ref=f2e2930] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ea55d38793014a4e3cd5a4046816fe22e69e9739
              - listitem [ref=f2e2934]:
                - text: 🌳
                - strong [ref=f2e2935]: Folders disappearing when moved into themselves.
                - text: Moving a folder inside one of its own subfolders is now refused, where it was accepted and made that folder and everything in it vanish from the sidebar with no way to bring it back, while leaving the server walking the loop endlessly and querying the database as it went, which could exhaust a worker and its memory; any folder already in that state is returned to the top level.
                - link "#28748" [ref=f2e2936] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28748
              - listitem [ref=f2e2940]:
                - text: 🧨
                - strong [ref=f2e2941]: Searching a knowledge base with a costly pattern.
                - text: A search pattern written so that it expands enormously before it even runs is now refused, where it could tie up the server; ordinary patterns are unaffected.
                - link "Commit" [ref=f2e2942] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d5b66533e7829654f6fb343abbaaeab988dbfde8
                - text: ","
                - link "#28284" [ref=f2e2943] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28284
              - listitem [ref=f2e2947]:
                - text: 💧
                - strong [ref=f2e2948]: Attaching a very large file from a link.
                - text: A file fetched from a link is now written to disk as it arrives and stops at the configured size limit, where the whole thing was held in memory first with no limit applied, so a large enough file could exhaust the server; a download that fails partway no longer leaves the partial file behind.
                - link "#28945" [ref=f2e2949] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28945
              - listitem [ref=f2e2953]:
                - text: ⛓
                - strong [ref=f2e2954]: Deleting one knowledge base removing a shared connection.
                - text: Deleting an external knowledge base now leaves its connection in place while other knowledge bases still use it, and only an administrator removing the last one clears it, where any user deleting theirs took the connection away from everyone.
                - link "#28113" [ref=f2e2955] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28113
              - listitem [ref=f2e2959]:
                - text: 📡
                - strong [ref=f2e2960]: Intermittent connection failures.
                - text: Requests to model providers and to services on the same network no longer fail intermittently with name lookup errors, often surfacing as a misleading model not found message, because addresses are resolved through the system again by default, with the faster resolver still available through "AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER".
                - link "#28242" [ref=f2e2961] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28242
                - text: ","
                - link "#28013" [ref=f2e2962] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28013
                - text: ","
                - link "#28215" [ref=f2e2963] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28215
              - listitem [ref=f2e2967]:
                - text: 🗯️
                - strong [ref=f2e2968]: Losing the conversation with memory on.
                - text: With the memory tool enabled, the model can see the earlier messages in your conversation again, instead of answering the second message as though the first had never been sent.
                - link "#28400" [ref=f2e2969] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28400
              - listitem [ref=f2e2973]:
                - text: 👻
                - strong [ref=f2e2974]: Vanishing responses.
                - text: Replies from Responses-API providers that report an empty output at the end of a stream no longer disappear the moment generation finishes, leaving an empty message in their place.
                - link "#27800" [ref=f2e2975] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27800
                - text: ","
                - link "#27789" [ref=f2e2976] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/27789
              - listitem [ref=f2e2980]:
                - text: 📥
                - strong [ref=f2e2981]: Queued messages disappearing.
                - text: Messages waiting to be sent are put back in the queue if sending them fails, rather than vanishing without being sent.
                - link "Commit" [ref=f2e2982] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f79b443c226098564386d0a31708e71ec0146158
              - listitem [ref=f2e2986]:
                - text: 🧵
                - strong [ref=f2e2987]: Replies cut short mid-stream.
                - text: A reply no longer breaks off part way through when a provider sends the pieces of its response in an unexpected order, which had left the answer truncated and skipped the filters that run once a message finishes.
                - link "#28312" [ref=f2e2988] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28312
              - listitem [ref=f2e2992]:
                - text: 🧷
                - strong [ref=f2e2993]: Replies not carried into the next turn.
                - text: With providers that skip parts of the streaming sequence, the finished reply is now taken from the completed message, so it stays available as context for your next question and the citations that arrived with it are no longer dropped.
                - link "#28310" [ref=f2e2994] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28310
              - listitem [ref=f2e2998]:
                - text: 🌊
                - strong [ref=f2e2999]: Replies arriving in oversized pieces.
                - text: Very large streamed pieces no longer break the response on default settings, where the reader that splits them safely only ran when a chunk size limit was configured.
                - link "Commit" [ref=f2e3000] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a33fa05adc6def8f3d098539a4786dc9c7bf61d2
              - listitem [ref=f2e3004]:
                - text: 🩹
                - strong [ref=f2e3005]: Signing in after a long-delayed upgrade.
                - text: Accounts on instances that were upgraded from a version older than 0.6.41 to 0.9.6 or newer can sign in again, where an upgrade step had written their single sign-on identity in a form the application could not read afterwards, and a repair step corrects the affected accounts on startup.
                - link "#28107" [ref=f2e3006] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28107
                - text: ","
                - link "#28101" [ref=f2e3007] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28101
                - text: ","
                - link "Commit" [ref=f2e3008] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bd8378f643dd8a56366ad9d1843b7d40f67cf1f9
              - listitem [ref=f2e3012]:
                - text: 🔑
                - strong [ref=f2e3013]: Signing in with some identity providers.
                - text: Logging in through a provider that adds its own vendor-specific information to the header of the sign-in token now completes, rather than failing at the final step with a message claiming the email or password was wrong.
                - link "#28065" [ref=f2e3014] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28065
                - text: ","
                - link "#28062" [ref=f2e3015] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28062
              - listitem [ref=f2e3019]:
                - text: 🔌
                - strong [ref=f2e3020]: Role changes taking effect at once.
                - text: Changing someone's role now ends their live sessions no matter how the change was made, whether by a directory sync, an identity provider, a trusted header, or deleting the account, so permissions from their old role cannot linger, and their browser reconnects on its own.
                - link "Commit" [ref=f2e3021] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ce3c175e260709f359d7e6cbb3132f0572098b95
              - listitem [ref=f2e3025]:
                - text: 🛑
                - strong [ref=f2e3026]: Memory permission being respected.
                - text: Taking away someone's memory permission now also stops their stored memories being added to the context of their conversations, which one path had continued doing regardless.
                - link "#27668" [ref=f2e3027] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27668
              - listitem [ref=f2e3031]:
                - text: 🔍
                - strong [ref=f2e3032]: Listing a single connection's models.
                - text: Asking for the models or version of one particular connection is now restricted to administrators, and a request naming a specific backend is checked against the models that backend actually serves even where the access control bypass is turned on.
                - link "Commit" [ref=f2e3033] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/16f118d77ad9d68c64116f94551ffb14bf8b2abd
              - listitem [ref=f2e3037]:
                - text: ⚖️
                - strong [ref=f2e3038]: Sharing defaults matching what was configured.
                - text: On instances upgraded from older versions, public sharing of tools and notes no longer shows as switched on in the admin panel, and saving any unrelated permission no longer grants everyone a capability that was never enabled.
                - link "#27716" [ref=f2e3039] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27716
                - text: ","
                - link "#27715" [ref=f2e3040] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27715
              - listitem [ref=f2e3044]:
                - text: 🗂️
                - strong [ref=f2e3045]: Folder permissions when starting a chat.
                - text: Starting a conversation filed into a folder now checks that you are allowed to write to that folder, a check the message sending path had been skipping, and every place a chat can be filed now treats ownership, shared access, and unknown folders the same way.
                - link "#28366" [ref=f2e3046] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28366
              - listitem [ref=f2e3050]:
                - text: 🪧
                - strong [ref=f2e3051]: Clearer attachment failures.
                - text: A link that cannot be read now says so and names the link, and a YouTube video whose transcript is refused explains why and points at the proxy setting that exists for it, instead of both being reported as a knowledge base error.
                - link "#28362" [ref=f2e3052] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28362
                - text: ","
                - link "#28361" [ref=f2e3053] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28361
              - listitem [ref=f2e3057]:
                - text: 🔎
                - strong [ref=f2e3058]: Chat search finding recent messages.
                - text: Searching your chats now looks inside the messages of current conversations on default installations, where it had only been reading an older storage format and missing their content entirely.
                - link "Commit" [ref=f2e3059] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0800c21c64c64810f24c2ec88cca5e36daebb10e
              - listitem [ref=f2e3063]:
                - text: 🧭
                - strong [ref=f2e3064]: Your place in a compacted chat.
                - text: Opening a conversation whose history has been compacted now takes you to its most recent message instead of leaving you parked on the summary, and updates to an existing message no longer move your place in the conversation.
                - link "Commit" [ref=f2e3065] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5caa91a49304148696641d1cd39e43184ba8d748
              - listitem [ref=f2e3069]:
                - text: 🖥️
                - strong [ref=f2e3070]: Chats with a personal terminal.
                - text: Sending a message with a terminal you added yourself under Settings selected no longer fails with a terminal unavailable error, which had blocked those chats since 0.11.0.
                - link "#27621" [ref=f2e3071] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27621
                - text: ","
                - link "Commit" [ref=f2e3072] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5b333d75c6adea4d8bde96439974d6e9c83d8198
                - text: ","
                - link "Commit" [ref=f2e3073] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3becec6ccfc7dc457270d4e9f0d8c957e8160ddc
              - listitem [ref=f2e3077]:
                - text: 📆
                - strong [ref=f2e3078]: Default date for new events.
                - text: Creating a calendar event now starts on today's date rather than tomorrow's when you open the form in the evening, or yesterday's when you open it early in the morning.
                - link "#27779" [ref=f2e3079] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27779
                - text: ","
                - link "#27778" [ref=f2e3080] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27778
              - listitem [ref=f2e3084]:
                - text: 🗓️
                - strong [ref=f2e3085]: Recurring event times.
                - text: Repeating calendar events now show at the time you set them for instead of being worked out in the server's time zone and shifted by the gap between the two.
                - link "#27774" [ref=f2e3086] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27774
                - text: ","
                - link "Commit" [ref=f2e3087] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d721b0d19621d01e35505105a778ce5681b2ffba
              - listitem [ref=f2e3091]:
                - text: 🧩
                - strong [ref=f2e3092]: Chats during model list refreshes.
                - text: On direct connections, background work such as title and tag generation no longer fails or runs against a mix of old and new model entries while the model list is being refreshed.
                - link "#27821" [ref=f2e3093] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27821
              - listitem [ref=f2e3097]:
                - text: 🎛️
                - strong [ref=f2e3098]: Chat Controls staying put.
                - text: Hovering a chat in the sidebar whose preview contains an artifact no longer forces the Chat Controls pane open and fills it with that artifact, over the chat you currently have open.
                - link "#27773" [ref=f2e3099] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27773
                - text: ","
                - link "#27772" [ref=f2e3100] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27772
              - listitem [ref=f2e3104]:
                - text: 📨
                - strong [ref=f2e3105]: Reliable streaming with unusual characters.
                - text: Responses containing any of three rare invisible line break characters no longer arrive split or broken when the "ENABLE_ORJSON" option is turned on.
                - link "#27819" [ref=f2e3106] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27819
              - listitem [ref=f2e3110]:
                - text: 🧮
                - strong [ref=f2e3111]: JSON options honoured again.
                - text: Options passed to the shared JSON helper are no longer silently ignored when the "ENABLE_ORJSON" option is turned on, falling back to the standard encoder that supports them.
                - link "Commit" [ref=f2e3112] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/78ed5a0235c4de67828ba4b0d6147035067cec2c
              - listitem [ref=f2e3116]:
                - text: 🚫
                - strong [ref=f2e3117]: Duplicate models in lists.
                - text: Adding a model that is already on a connection's allowed list is now rejected instead of quietly adding it a second time, the arena picker no longer offers models you have already chosen, and existing duplicates are cleaned up the next time the list is saved.
                - link "#28251" [ref=f2e3118] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28251
                - text: ","
                - link "#28249" [ref=f2e3119] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28249
              - listitem [ref=f2e3123]:
                - text: 📁
                - strong [ref=f2e3124]: Dragging chats into shared folders.
                - text: A shared folder you can write to now highlights and accepts a dropped chat, while one you only have read access to no longer offers itself as a drop target for an action that could only fail.
                - link "Commit" [ref=f2e3125] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e4dd6c4bf14c7ea54c1effa6c40ad9e95185c413
                - text: ","
                - link "#28261" [ref=f2e3126] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28261
              - listitem [ref=f2e3130]:
                - text: ⏰
                - strong [ref=f2e3131]: Listing automations through chat.
                - text: Asking a model to list your automations without naming a folder now returns every automation you have, instead of only the ones that sit outside a folder.
                - link "Commit" [ref=f2e3132] [cursor=pointer]:
