              - listitem [ref=f2e3178]:
                - text: 🫥
                - strong [ref=f2e3179]: Deactivating a model.
                - text: Turning a model off no longer removes the wrong entry from the model list, or fails the list outright and leaves the model picker empty for everyone until the model is turned back on.
                - link "Commit" [ref=f2e3180] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5cecb7dbfad3994228ee53d19232650400462332
                - text: ","
