                - text: Asking a model to change one thing about an automation no longer moves it out of its folder or drops its model when the model fills those fields in blank instead of omitting them.
                - link "Commit" [ref=f2e3408] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/90bb94abf9a8c6fbb87c72952295ae39d2ad98e5
              - listitem [ref=f2e3412]:
                - text: 🔂
                - strong [ref=f2e3413]: Automations that run a set number of times.
                - text: An automation asked to run a limited number of times is now rejected unless it says when to start counting from, rather than being accepted and then running indefinitely.
                - link "#27781" [ref=f2e3414] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27781
                - text: ","
                - link "#27780" [ref=f2e3415] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27780
              - listitem [ref=f2e3419]:
                - text: 📅
                - strong [ref=f2e3420]: Editing a calendar event through chat.
                - text: Asking a model to change one thing about an event, such as its title, no longer fails or wipes the details you did not mention.
                - link "#27777" [ref=f2e3421] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27777
                - text: ","
                - link "#27776" [ref=f2e3422] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27776
              - listitem [ref=f2e3426]:
                - text: 🧹
                - strong [ref=f2e3427]: Session cleanup on multi-instance setups.
                - text: The instance doing the periodic session cleanup now keeps its claim on that job alive between passes, so an idle deployment stops logging a renewal warning every two minutes and the claim no longer lapses for half of every cycle.
                - link "Commit" [ref=f2e3428] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/939bcdb79e3dcad2278f1e7f4f517a3f2f36f3ec
                - text: ","
                - link "#27762" [ref=f2e3429] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27762
              - listitem [ref=f2e3433]:
                - text: 🏠
                - strong [ref=f2e3434]: Starting folder in the file browser.
                - text: Reopening the file browser now keeps the folder you were in, instead of the breadcrumb losing its starting point and jumping you elsewhere.
                - link "Commit" [ref=f2e3435] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/52c5e3b20d3cd8c3a15db50e2cc75bbd6e82068e
              - listitem [ref=f2e3439]:
                - text: 🩺
                - strong [ref=f2e3440]: Repairing default model settings.
                - text: Instances whose stored default and pinned model settings had been written in the wrong shape are corrected on startup, so those defaults take effect again.
                - link "Commit" [ref=f2e3441] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5c05608e3ac0aefce8c1eed18c3e205c61f6b6fe
              - listitem [ref=f2e3445]:
                - text: 🧽
                - strong [ref=f2e3446]: Cleaner conversation history for the model.
                - text: Internal bookkeeping attached to your messages, such as attachment records and token counts, is no longer sent to the model along with the conversation.
                - link "Commit" [ref=f2e3447] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a32a17965ca36f730ebf5ff53a2a8e17082b61a6
              - listitem [ref=f2e3451]:
                - text: 🙈
                - strong [ref=f2e3452]: Needless request from the model picker.
                - text: Opening the model picker as a non-administrator no longer fires a request to an administrator-only settings endpoint that was always refused.
                - link "Commit" [ref=f2e3453] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b4738d1a2e6af1ce20adb322fc6d2aa2c9407901
              - listitem [ref=f2e3457]:
                - text: ⏹️
                - strong [ref=f2e3458]: Stopping a reply that is waiting.
                - text: The stop button now ends a reply that is sitting waiting for you, such as one paused on a tool approval, rather than leaving the conversation stuck part way through.
                - link "Commit" [ref=f2e3459] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f7767d6be774720e16265c6d016bf6a24a1a8759
              - listitem [ref=f2e3463]:
                - text: 🏷️
                - strong [ref=f2e3464]: Folder names with unusual characters.
                - text: Naming a folder is no longer refused because another folder's name happens to be similar, and a name ending in a backslash no longer fails outright on PostgreSQL, because names are now compared exactly rather than treated as a search pattern.
                - link "#28695" [ref=f2e3465] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28695
                - text: ","
                - link "#28694" [ref=f2e3466] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28694
              - listitem [ref=f2e3470]:
                - text: 🤔
                - strong [ref=f2e3471]: Reasoning carried back to Ollama.
                - text: A model's earlier thinking is now passed back to Ollama in its own native field rather than pasted into the message as tagged text, so reasoning models keep their train of thought across turns.
                - link "Commit" [ref=f2e3472] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3258330729942b533dc5fe141e876cee7e5eb40d
              - listitem [ref=f2e3476]:
                - text: 📎
                - strong [ref=f2e3477]: Default pinned models taking effect.
                - text: Changing the default pinned models now reaches people who have never chosen their own, where simply having opened the interface once was enough to freeze the list they first saw, and reordering a pin no longer moves the wrong one or reopens the sidebar section afterwards.
                - link "#28069" [ref=f2e3478] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28069
                - text: ","
                - link "#28067" [ref=f2e3479] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/28067
              - listitem [ref=f2e3483]:
                - text: ✏️
                - strong [ref=f2e3484]: Editing other people's channel messages.
                - text: Asking a model to work on a message in a channel now only applies to your own messages, where write access to the channel had been enough to reach anyone's.
                - link "#28631" [ref=f2e3485] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28631
              - listitem [ref=f2e3489]:
                - text: 🍪
                - strong [ref=f2e3490]: Signed-in tool servers.
                - text: A tool server that relies on your session now receives the credentials belonging to its own connection, rather than whichever were most recently prepared.
                - link "#28630" [ref=f2e3491] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28630
              - listitem [ref=f2e3495]:
                - text: 🏗️
                - strong [ref=f2e3496]: Editing a folder from its page.
                - text: Renaming a folder, changing its icon, creating a subfolder, or deleting it from the folder's own page now updates the sidebar straight away, instead of leaving the old name and icon there, and the new subfolder missing, until a reload.
                - link "Commit" [ref=f2e3497] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a40f6f2860b49b4c7f11e369f11bd46e9451eabf
                - text: ","
                - link "Commit" [ref=f2e3498] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/736e38338ede1fca5af0829e35585a72f8517d32
                - text: ","
                - link "#28692" [ref=f2e3499] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28692
                - text: ","
                - link "#28690" [ref=f2e3500] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28690
              - listitem [ref=f2e3504]:
                - text: 📣
                - strong [ref=f2e3505]: Long channel names in the sidebar.
                - text: A channel with a long name no longer squeezes its own menu button out of the row.
                - link "Commit" [ref=f2e3506] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b5da50f3df51786972010c75c7736d5f95362e58
                - text: ","
                - link "#28671" [ref=f2e3507] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28671
                - text: ","
                - link "#28670" [ref=f2e3508] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28670
              - listitem [ref=f2e3512]:
                - text: 📬
                - strong [ref=f2e3513]: Mark as unread in chat search.
                - text: Marking a chat unread from the search dialog now works and updates the sidebar, where the menu entry looked normal but did nothing at all.
                - link "#28136" [ref=f2e3514] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28136
                - text: ","
                - link "#28135" [ref=f2e3515] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28135
              - listitem [ref=f2e3519]:
                - text: ⬆️
                - strong [ref=f2e3520]: Scroll to top on the first click.
                - text: In a long chat where older messages had not been loaded yet, one click of scroll to top now reaches the first message instead of stopping short and needing a second.
                - link "#28659" [ref=f2e3521] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28659
                - text: ","
                - link "#28658" [ref=f2e3522] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28658
              - listitem [ref=f2e3526]:
                - text: 🔘
                - strong [ref=f2e3527]: Double bullets in the release notes.
                - text: Each entry in the what's new dialog shows a single bullet again, rather than two sitting at different heights.
                - link "#28676" [ref=f2e3528] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28676
                - text: ","
                - link "#28675" [ref=f2e3529] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28675
              - listitem [ref=f2e3533]:
                - text: 📚
                - strong [ref=f2e3534]: Knowledge search and shared files in chat.
                - text: A model searching your knowledge bases or reading a file shared with you through a group now works, where it had failed since 0.11.0 and quietly answered as though the knowledge were empty, affecting instances that forward user details to their embedding service and, for shared files, every instance regardless of settings.
                - link "#27642" [ref=f2e3535] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27642
                - text: ","
                - link "#27641" [ref=f2e3536] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27641
              - listitem [ref=f2e3540]:
                - text: 🔖
                - strong [ref=f2e3541]: Skill identifiers that cannot be reached.
                - text: Creating a skill whose identifier contains a character that is not allowed in a web address is now refused outright, rather than accepted and then permanently impossible to open, edit, turn off, delete, or recreate.
                - link "#27660" [ref=f2e3542] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27660
                - text: ","
                - link "#27655" [ref=f2e3543] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27655
              - listitem [ref=f2e3547]:
                - text: 🔤
                - strong [ref=f2e3548]: Model names on connections with a prefix.
                - text: A connection that adds a prefix to its model names now strips it before sending a request through the responses endpoint, where the prefixed name was passed on and rejected as unknown.
                - link "#28575" [ref=f2e3549] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28575
                - text: ","
                - link "#28574" [ref=f2e3550] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28574
              - listitem [ref=f2e3554]:
                - text: 🔓
                - strong [ref=f2e3555]: Turning on open sharing.
                - text: The open sharing permission can now be switched on in the default user permissions, where saving appeared to work but the setting was discarded and came back off.
                - link "#27609" [ref=f2e3556] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27609
                - text: ","
                - link "#27607" [ref=f2e3557] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27607
              - listitem [ref=f2e3561]:
                - text: 🖌️
                - strong [ref=f2e3562]: White boxes behind model icons.
                - text: Model icons with a transparent background no longer sit on a white square in the admin models list, matching how they already appeared everywhere else.
                - link "#27612" [ref=f2e3563] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27612
                - text: ","
                - link "#27611" [ref=f2e3564] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27611
              - listitem [ref=f2e3568]:
                - text: 🪞
                - strong [ref=f2e3569]: Matching the right account at sign-in.
                - text: Looking up an account by its identity provider details now matches the exact value, where the stored details were searched as loose text and a value contained within another's could be matched instead.
                - link "#28624" [ref=f2e3570] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28624
              - listitem [ref=f2e3574]:
                - text: 🔄
                - strong [ref=f2e3575]: Syncing a model catalogue more than once.
                - text: Syncing models now updates the ones that already exist, where any repeat of a previous sync silently did nothing at all while still reporting success.
                - link "#28036" [ref=f2e3576] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28036
                - text: ","
                - link "#28033" [ref=f2e3577] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28033
              - listitem [ref=f2e3581]:
                - text: 🕰️
                - strong [ref=f2e3582]: Saving a calendar event without a date.
                - text: Creating or editing an event with the date cleared now asks for one, where it was sent anyway, refused by the server, and reported as an unreadable error.
                - link "Commit" [ref=f2e3583] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f100edb70874808c93fab84eae1810595f9e9dc3
                - text: ","
                - link "#28133" [ref=f2e3584] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28133
              - listitem [ref=f2e3588]:
                - text: 🔗
                - strong [ref=f2e3589]: Deleting a message in a looping chat.
                - text: Deleting a message no longer hangs when the conversation contains a cycle in its reply structure.
                - link "#28035" [ref=f2e3590] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28035
              - listitem [ref=f2e3594]:
                - text: 🫀
                - strong [ref=f2e3595]: Scheduled work stopping without warning.
                - text: The routine that runs automations and calendar alerts can no longer be discarded while the application is running, which had silently stopped them firing with nothing reported, and it now stops cleanly on shutdown.
                - link "#28053" [ref=f2e3596] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28053
                - text: ","
                - link "#28052" [ref=f2e3597] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28052
              - listitem [ref=f2e3601]:
                - text: 🔋
                - strong [ref=f2e3602]: Session and usage records left uncleared.
                - text: The routines that clear out stale sessions and finished model usage can no longer be discarded while the application is running, so those records stop accumulating unnoticed, and both now stop cleanly on shutdown.
                - link "#28053" [ref=f2e3603] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28053
                - text: ","
                - link "#28052" [ref=f2e3604] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28052
              - listitem [ref=f2e3608]:
                - text: ⚗️
                - strong [ref=f2e3609]: Reasoning carried between turns.
                - text: A model's earlier thinking is now recognised from providers that report it in their own nested field, and reasoning that cannot be sent back without a signature is left out rather than being passed on and rejected.
                - link "Commit" [ref=f2e3610] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b6dc70c93b0d36e2659438e7a55aa8b21fee27f8
              - listitem [ref=f2e3614]:
                - text: 🛎️
                - strong [ref=f2e3615]: Losing all your settings.
                - text: Your interface settings are no longer wiped by a session that failed to load them, which could happen with no action on your part and cleared everything from your theme to your model parameters; saving now changes only the settings you actually changed, and a session that cannot load them tells you instead of carrying on as though you had none.
                - link "#27766" [ref=f2e3616] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27766
                - text: ","
                - link "Commit" [ref=f2e3617] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ad8c79f68657bd3bcf5db6be650e498bb904b36b
              - listitem [ref=f2e3621]:
                - text: 🖲️
                - strong [ref=f2e3622]: Losing the collapsed sidebar.
                - text: With the sidebar collapsed, opening a chat no longer pushes the narrow sidebar strip off the edge of the screen, which left no way to reopen the sidebar short of shrinking the window to phone size.
                - link "#28501" [ref=f2e3623] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28501
                - text: ","
                - link "#28500" [ref=f2e3624] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28500
              - listitem [ref=f2e3628]:
                - text: 🧯
                - strong [ref=f2e3629]: Timers that fail without saying so.
                - text: A timer whose reply cannot be generated, such as one set against a model that has since been removed, is now recorded as failed with the reason, instead of being marked as completed while the reply never arrives.
                - link "#27785" [ref=f2e3630] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27785
                - text: ","
                - link "#27783" [ref=f2e3631] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27783
              - listitem [ref=f2e3635]:
                - text: 🎲
                - strong [ref=f2e3636]: Timers stop for retired owners.
                - text: A timer whose owner has been deleted or demoted to pending is recorded as an error instead of running, so a retired account no longer answers through a timer it set while active.
                - link "#30220" [ref=f2e3637] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30220
              - listitem [ref=f2e3641]:
                - text: 🖊️
                - strong [ref=f2e3642]: Message buttons in channels.
                - text: The buttons that appear when you hover a channel message now sit above the message rather than over its content, so they can be clicked on a message that starts with a code block or a table, and so the code and table controls stay clickable too.
                - link "#27737" [ref=f2e3643] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27737
                - text: ","
                - link "#27736" [ref=f2e3644] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27736
              - listitem [ref=f2e3648]:
                - text: 🔡
                - strong [ref=f2e3649]: Searching for non-English tags and text.
                - text: Searching workspace models by tag, or prompts and automations by their contents, now finds entries containing characters outside the English alphabet, where roughly half were missed depending on which settings were in force when each one was saved.
                - link "#28399" [ref=f2e3650] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28399
              - listitem [ref=f2e3654]:
                - text: 🔭
                - strong [ref=f2e3655]: Searching the calendar without an end date.
                - text: Asking a model to search your calendar without naming an end date now works on PostgreSQL, where the open-ended range was too large for the database to accept and the search failed outright.
                - link "Commit" [ref=f2e3656] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9550731cc17759f6862595b8cd849ae48695b5c1
                - text: ","
                - link "#27717" [ref=f2e3657] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27717
              - listitem [ref=f2e3661]:
                - text: 🫧
                - strong [ref=f2e3662]: Attachments replaced by a loading dot.
                - text: Pinning a channel message, or otherwise updating one, no longer replaces its attachment with a loading indicator that never resolves until you reload or leave the channel.
                - link "Commit" [ref=f2e3663] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/76d01602950a9e40823b53278557708d5bcd1036
                - text: ","
                - link "#27734" [ref=f2e3664] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27734
                - text: ","
                - link "#27731" [ref=f2e3665] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27731
              - listitem [ref=f2e3669]:
                - text: 🛠️
                - strong [ref=f2e3670]: Rebuilding empty server lists on every request.
                - text: An instance with no tool servers or no terminal servers configured no longer rebuilds that empty list on every request that needs it.
                - link "Commit" [ref=f2e3671] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f1a64ccfc2eb2a58086c55fe413a455bb488c35a
                - text: ","
                - link "#28568" [ref=f2e3672] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28568
              - listitem [ref=f2e3676]:
                - text: 🪫
                - strong [ref=f2e3677]: Errors logged for a cache that was simply empty.
                - text: A shared cache that has not been filled yet no longer logs an error suggesting its stored value is broken.
                - link "Commit" [ref=f2e3678] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f1a64ccfc2eb2a58086c55fe413a455bb488c35a
                - text: ","
                - link "#28568" [ref=f2e3679] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28568
              - listitem [ref=f2e3683]:
                - text: ⚓
                - strong [ref=f2e3684]: Starting up as a non-root user.
                - text: Deployments that run the container as a non-root user, such as Kubernetes setups using runAsNonRoot, start again, where a bundled speech model file that only root could read had stopped them since 0.11.0, and a bundled text corpus is now stored somewhere a non-root user can reach.
                - link "#27651" [ref=f2e3685] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27651
                - text: ","
                - link "Commit" [ref=f2e3686] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0480ca9653f0d566eaedadf0af0d785a9938480b
                - text: ","
                - link "#28866" [ref=f2e3687] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28866
              - listitem [ref=f2e3691]:
                - text: 📋
                - strong [ref=f2e3692]: Finding notes shared read only.
                - text: A note shared publicly for reading now appears in the read only view of your notes, where it was readable by anyone with the link but listed nowhere at all.
                - link "#27637" [ref=f2e3693] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27637
                - text: ","
                - link "#27487" [ref=f2e3694] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27487
              - listitem [ref=f2e3698]:
                - text: 🫂
                - strong [ref=f2e3699]: Signing in from another application.
                - text: Signing in through an application that exchanges a token from your identity provider now applies your role and group memberships the same way signing in through the browser does, and an account whose provider sends no role keeps the one it has rather than being reset to the default.
                - link "Commit" [ref=f2e3700] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d799e81edbdc971c6deb096b6474cd95b93504bf
                - text: ","
                - link "Commit" [ref=f2e3701] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e9684458125c3202ebc3378aef32f0b6015171d8
              - listitem [ref=f2e3705]:
                - text: 🗄️
                - strong [ref=f2e3706]: Empty models section in the sidebar.
                - text: The models section no longer appears with nothing in it when every pinned model has since been removed, renamed, or hidden.
                - link "#27634" [ref=f2e3707] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27634
                - text: ","
                - link "#27633" [ref=f2e3708] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27633
              - listitem [ref=f2e3712]:
                - text: 🚧
                - strong [ref=f2e3713]: The files pane reopening by itself.
                - text: With a terminal selected, closing the files pane now keeps it closed, where saving any setting reopened it, including something as incidental as picking an emoji for a folder.
                - link "#28693" [ref=f2e3714] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28693
                - text: ","
                - link "#28691" [ref=f2e3715] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28691
                - text: ","
                - link "Commit" [ref=f2e3716] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c1c81f8127466a4cd59a16d8658155b1b8faa2d0
              - listitem [ref=f2e3720]:
                - text: 🚰
                - strong [ref=f2e3721]: Watching file processing tying up the database.
                - text: Waiting for a file or a knowledge base to finish processing no longer holds a database connection open for as long as the page is watching, which on busy instances could use up every available connection and leave the rest of the application unable to reach the database.
                - link "#28183" [ref=f2e3722] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28183
              - listitem [ref=f2e3726]:
                - text: 🗜️
                - strong [ref=f2e3727]: Embedding settings for other providers.
                - text: Saving your embedding settings now writes only the provider you have selected, where it also overwrote the address and key stored for the other two, losing them if their fields were not filled in.
                - link "Commit" [ref=f2e3728] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/87d9b7e84e71b097eadf1df4f9852359104f17ed
              - listitem [ref=f2e3732]:
                - text: ↔️
                - strong [ref=f2e3733]: Connectors in the side-by-side overview.
                - text: With the conversation overview laid out left to right, the lines between messages now join at the sides rather than the top and bottom, so they no longer cut across the boxes.
                - link "Commit" [ref=f2e3734] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6e468c5b9539d3b6057bab63d81e8d2974acff7b
              - listitem [ref=f2e3738]:
                - text: 💫
                - strong [ref=f2e3739]: Thinking indicator with the fade turned off.
                - text: Turning off the fade effect for streaming text no longer hides the thinking indicator and its spinner, which had made a reasoning model look as though it had already finished from the first moment it started.
                - link "#28559" [ref=f2e3740] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28559
                - text: ","
                - link "Commit" [ref=f2e3741] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b1dc945bd6cf97a7067e603fc1b797301e626fb6
              - listitem [ref=f2e3745]:
                - text: 🈳
                - strong [ref=f2e3746]: Conversations compacted too early on llama.cpp.
                - text: A conversation served by llama.cpp is no longer shortened at roughly half the size you configured, where its cached input was counted twice, so a chat showing 39,000 tokens was treated as 77,000 against a 70,000 limit.
                - link "#28590" [ref=f2e3747] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28590
                - text: ","
                - link "Commit" [ref=f2e3748] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0b27fa5e873c9f3cff7b14e4eeab8321bdd8970c
              - listitem [ref=f2e3752]:
                - text: ◻️
                - strong [ref=f2e3753]: Settings tabs spilling past the corner.
                - text: Scrolling the list of tabs in settings no longer paints a tab or part of an icon across the dialog's rounded bottom corner, where it appeared to sit outside the dialog.
                - link "#27617" [ref=f2e3754] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27617
                - text: ","
                - link "#27616" [ref=f2e3755] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27616
              - listitem [ref=f2e3759]:
                - text: 🎰
                - strong [ref=f2e3760]: Settings for a switched-off function.
                - text: A function that has been turned off no longer offers its per-user settings, and saving them is refused, where doing so loaded the function's code and stored settings that had no effect.
                - link "Commit" [ref=f2e3761] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a3a81fee03ba7ec0ceb4d1f456e80a8f4fc2320f
              - listitem [ref=f2e3765]:
                - text: 🗃
                - strong [ref=f2e3766]: Shared folders reordering themselves.
                - text: The list of folders shared with you now keeps a consistent order, where on PostgreSQL renaming a folder could shuffle the ones beside it.
                - link "#28804" [ref=f2e3767] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28804
              - listitem [ref=f2e3771]:
                - text: 📜
                - strong [ref=f2e3772]: System prompt repeated after a tool call.
                - text: On models served by a pipe or manifold, the system prompt is no longer added again each time a tool runs, where it built up one extra copy per round and was sent to the provider that way.
                - link "#28739" [ref=f2e3773] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28739
                - text: ","
                - link "#28736" [ref=f2e3774] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28736
              - listitem [ref=f2e3778]:
                - text: 🔕
                - strong [ref=f2e3779]: Calendar reminders stopping for everyone.
                - text: A single event whose reminder time was stored as something other than a number no longer stops reminders being sent, for that event or for anyone else's, and falls back to the usual reminder window instead.
                - link "#28790" [ref=f2e3780] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28790
              - listitem [ref=f2e3784]:
                - text: 🗨
                - strong [ref=f2e3785]: Attached conversations reaching the model.
                - text: A conversation attached to your message is now listed among its attachments, where it was left out entirely and the model was never told it was there.
                - link "#28788" [ref=f2e3786] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28788
              - listitem [ref=f2e3790]:
                - text: ↔
                - strong [ref=f2e3791]: Dragging a side panel closed.
                - text: Dragging the chat controls, the note chat, or a channel thread panel closed by its edge no longer floods the browser console with errors and leaves stray handlers behind, and the divider can now be moved with the arrow keys once focused.
                - link "#28759" [ref=f2e3792] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28759
                - text: ","
                - link "Commit" [ref=f2e3793] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/33dff414e829d10dc6691b1cac7457077fa6799c
              - listitem [ref=f2e3797]:
                - text: 🎫
                - strong [ref=f2e3798]: Saving a message with unusual characters on PostgreSQL.
                - text: A message carrying characters PostgreSQL will not store outside its text no longer fails to save, where those characters were cleaned from the conversation but passed through raw to the separate message record.
                - link "#28820" [ref=f2e3799] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28820
              - listitem [ref=f2e3803]:
                - text: 🔲
                - strong [ref=f2e3804]: Removing an item in the model editor.
                - text: Unticking a tool, skill, action, or filter no longer leaves the next one in the list looking unticked while it is still selected, needing two clicks to remove and passing the same confusion down the list each time.
                - link "#28837" [ref=f2e3805] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28837
                - text: ","
                - link "#28832" [ref=f2e3806] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28832
              - listitem [ref=f2e3810]:
                - text: 📉
                - strong [ref=f2e3811]: Usage figures drifting upward on clustered setups.
                - text: The routine that clears out finished model usage no longer stops for good across the whole cluster after a brief interruption, which had left the usage figures counting models nobody was using and grew the work every disconnection had to do.
                - link "#28834" [ref=f2e3812] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28834
              - listitem [ref=f2e3816]:
                - text: 🔇
                - strong [ref=f2e3817]: Voice mode staying silent with reasoning models.
                - text: Voice mode now speaks when the emoji option is on and the model behind it reports its answer as thinking rather than text, where the whole reply went unspoken and nothing reached the speech service at all.
                - link "#28724" [ref=f2e3818] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28724
              - listitem [ref=f2e3822]:
                - text: 🏷
                - strong [ref=f2e3823]: Tags on a chat shared with you.
                - text: Opening a chat shared with you, or one in a shared folder, no longer fails to load its tags, and an administrator opening someone else's chat now sees the tags that chat actually carries.
                - link "Commit" [ref=f2e3824] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7d4747dfd73d7629227b10ae63c6854cc7543bee
                - text: ","
                - link "#28767" [ref=f2e3825] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28767
              - listitem [ref=f2e3829]:
                - text: 🔻
                - strong [ref=f2e3830]: Message box controls in a narrow panel.
                - text: Narrowing the note chat panel, or squeezing the chat with a wide controls pane, no longer hides the attach and integrations buttons behind the model name or pushes the send button outside the box; the model name is shortened to make room instead.
                - link "#28912" [ref=f2e3831] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28912
                - text: ","
                - link "#28911" [ref=f2e3832] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28911
              - listitem [ref=f2e3836]:
                - text: ⌛
                - strong [ref=f2e3837]: Replies that are all thinking and no answer.
                - text: A reply from a provider using the responses format that ends while the model is still in its reasoning, with no answer text after it, now finishes normally instead of failing the whole turn and leaving an unreadable error in place of the reply.
                - link "#28872" [ref=f2e3838] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28872
                - text: ","
                - link "#28871" [ref=f2e3839] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28871
              - listitem [ref=f2e3843]:
                - text: 📃
                - strong [ref=f2e3844]: Word and PowerPoint previews overflowing.
                - text: Previewing one of these files now keeps the document inside its frame, with the zoom and slide controls staying put rather than scrolling away, and a presentation opens on its current slide instead of below the visible area.
                - link "#28878" [ref=f2e3845] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28878
                - text: ","
                - link "#28877" [ref=f2e3846] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28877
              - listitem [ref=f2e3850]:
                - text: 🎞
                - strong [ref=f2e3851]: Workspace models in the admin models list.
                - text: Workspace models appear in the admin models list again, so they can be ordered, set as the default, and pinned for everyone; choosing one opens its own editor, where it opened the base model editor and could strip the model's base model, turning it into something else.
                - link "Commit" [ref=f2e3852] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ccbb3303f2ec5db0b16573bbb665a12f6764da66
                - text: ","
                - link "#27702" [ref=f2e3853] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27702
              - listitem [ref=f2e3857]:
                - text: ⌨
                - strong [ref=f2e3858]: Errors after sending a long message.
                - text: With prompt autocompletion on, sending or clearing a message of several paragraphs within a second of typing no longer throws an error in the browser console.
                - link "#28824" [ref=f2e3859] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28824
                - text: ","
                - link "#28823" [ref=f2e3860] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28823
              - listitem [ref=f2e3864]:
                - text: ❌
                - strong [ref=f2e3865]: Tool calls that failed looking successful.
                - text: A tool call that returned an error is now marked as failed with a red cross rather than a green tick, so a reply built on a failed call is easier to spot.
                - link "Commit" [ref=f2e3866] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f3f76095d18e07a3a944f22a4b25993bbffe90a3
                - text: ","
                - link "#28016" [ref=f2e3867] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28016
              - listitem [ref=f2e3871]:
                - text: 🗜
                - strong [ref=f2e3872]: Download links in a cited source doing nothing.
                - text: A link in a citation shown as formatted content now downloads the file when clicked, where it silently did nothing at all.
                - link "Commit" [ref=f2e3873] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3c66d639e31ba8a7477d337b37d8d671ea2430cf
                - text: ","
                - link "#28924" [ref=f2e3874] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28924
              - listitem [ref=f2e3878]:
                - text: 🗳
                - strong [ref=f2e3879]: Web searches failing without saying why.
                - text: A web search that fails now explains itself instead of returning nothing at all, which most often happens when a search engine has been selected without its key being configured.
                - link "#28942" [ref=f2e3880] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28942
              - listitem [ref=f2e3884]:
                - text: ✅
                - strong [ref=f2e3885]: Checklists in notes.
                - text: A checklist in a note now previews and downloads as a proper checklist, where each item carried a stray second pair of brackets and its text began two lines below the box.
                - link "#27671" [ref=f2e3886] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27671
                - text: ","
                - link "#26067" [ref=f2e3887] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26067
              - listitem [ref=f2e3891]:
                - text: 🧿
                - strong [ref=f2e3892]: Shortening a conversation with the wrong model.
                - text: Choosing to shorten long conversations with the model you are chatting with now does that, where it used the configured task model instead on any instance that has one.
                - link "Commit" [ref=f2e3893] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5093a9938937153e287db27a671f5ba1fb5d7592
                - text: ","
                - link "#27603" [ref=f2e3894] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27603
              - listitem [ref=f2e3898]:
                - text: 🖥
                - strong [ref=f2e3899]: Stopping a reply after the shared cache restarts.
                - text: Stopping a reply now keeps working across a cluster after the shared cache restarts or its connection drops, where the part that carries a stop between instances gave up for good and silently, and only restarting the application brought it back.
                - link "Commit" [ref=f2e3900] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bf3a58dbcd18ddc2c7f130d8f9529477fe7cb042
                - text: ","
                - link "#28909" [ref=f2e3901] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28909
              - listitem [ref=f2e3905]:
                - text: 📼
                - strong [ref=f2e3906]: Attached links to media and archives.
                - text: Attaching a link that leads to something other than a web page, such as a video or an archive, now reads it as the file it is rather than trying to treat it as text.
                - link "Commit" [ref=f2e3907] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/886248de36e3a60c3687d1bee6af110e14110eca
              - listitem [ref=f2e3911]:
                - text: 🗒
                - strong [ref=f2e3912]: Editing a workflow from settings.
                - text: Opening the code editor for a ComfyUI workflow from the images settings now brings it to the front, where it opened behind the settings dialog and could not be reached at all.
                - link "#27648" [ref=f2e3913] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27648
                - text: ","
                - link "#27647" [ref=f2e3914] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27647
              - listitem [ref=f2e3918]:
                - text: 🖼
                - strong [ref=f2e3919]: Downloading a generated image.
                - text: Downloading an image from its preview now saves the image, where it could silently save a small file containing an authentication error instead, and a download that does fail now says so.
                - link "Commit" [ref=f2e3920] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2578174637e48cafa4bcb09adbb1b7f4b545a8d5
                - text: ","
                - link "#27723" [ref=f2e3921] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27723
                - text: ","
                - link "#27722" [ref=f2e3922] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27722
              - listitem [ref=f2e3926]:
                - text: 🗂
                - strong [ref=f2e3927]: Directory sync listing local accounts.
                - text: A directory service syncing accounts over SCIM now sees only the accounts that came from a directory, where it also listed and could modify accounts created with a password in Open WebUI itself.
                - link "Commit" [ref=f2e3928] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fb4f476316a2f83e4d2914d535c19b3440cbc490
              - listitem [ref=f2e3932]:
                - text: ↕
                - strong [ref=f2e3933]: Sorting a list of people.
                - text: Sorting the admin user list, or a channel's member list, now works when no search term has been entered, where the chosen order was ignored unless something was being searched for.
                - link "Commit" [ref=f2e3934] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fb4f476316a2f83e4d2914d535c19b3440cbc490
              - listitem [ref=f2e3938]:
                - text: 🧶
                - strong [ref=f2e3939]: Text dropped from a reply by a filter.
                - text: A filter that rewrites a reply as it streams, or a provider that sends something other than plain text in a chunk, no longer causes that part of the reply to vanish without explanation.
                - link "#28840" [ref=f2e3940] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28840
              - listitem [ref=f2e3944]:
                - text: 🏗
                - strong [ref=f2e3945]: Timers firing twice after a fork.
                - text: Branching a conversation that has a timer set no longer leaves the copy able to fire that timer as well.
                - link "#27663" [ref=f2e3946] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27663
                - text: ","
                - link "#27622" [ref=f2e3947] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27622
                - text: ","
                - link "#27745" [ref=f2e3948] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27745
              - listitem [ref=f2e3952]:
                - text: 🗣
                - strong [ref=f2e3953]: Sentences skipped in voice mode.
                - text: Voice mode now speaks every sentence of a reply, where any sentence that completed in the same piece of the reply as another was silently never read out, which happened routinely with providers that send whole paragraphs at a time.
                - link "Commit" [ref=f2e3954] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/495296346edfcd96a506a22fed4bb5b8faf3cd4d
                - text: ","
                - link "#28730" [ref=f2e3955] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28730
                - text: ","
                - link "#19861" [ref=f2e3956] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/19861
              - listitem [ref=f2e3960]:
                - text: 🖊
                - strong [ref=f2e3961]: Dragging a side panel wider than the window.
                - text: A side panel can no longer be dragged so wide that the chat beside it is squeezed away, and dragging one below its minimum width now closes it rather than sticking.
                - link "Commit" [ref=f2e3962] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ef455fcef9d6cb1136275c26e49bc3c5d6661795
                - text: ","
                - link "#28965" [ref=f2e3963] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28965
              - listitem [ref=f2e3967]:
                - text: 🎙
                - strong [ref=f2e3968]: The wrong model selected when reopening a chat.
                - text: Reopening a conversation where a reply was regenerated with a different model now selects the model behind the reply you are looking at, where it picked the one used for the first attempt, which might be a model no longer available.
                - link "#27674" [ref=f2e3969] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27674
                - text: ","
                - link "#25052" [ref=f2e3970] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/25052
                - text: ","
                - link "Commit" [ref=f2e3971] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8a170897bad569d93e069226a996942583ebde80
              - listitem [ref=f2e3975]:
                - text: 🛜
                - strong [ref=f2e3976]: Coding tools that speak Anthropic's format.
                - text: A tool such as Cline pointed at Open WebUI using Anthropic's own message format can reach models again, where every request failed before it was even sent, and once that was corrected the request was rejected by Anthropic for being signed the wrong way.
                - link "#27675" [ref=f2e3977] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27675
                - text: ","
                - link "#27595" [ref=f2e3978] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27595
                - text: ","
                - link "#27695" [ref=f2e3979] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27695
              - listitem [ref=f2e3983]:
                - text: 👯
                - strong [ref=f2e3984]: Code in pinned messages.
                - text: Opening the pinned messages of a channel now shows the code in those messages, where each block appeared empty and its contents were drawn into the channel behind the dialog instead, doubling them there.
                - link "#27740" [ref=f2e3985] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27740
                - text: ","
                - link "#27739" [ref=f2e3986] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27739
              - listitem [ref=f2e3990]:
                - text: 🧻
                - strong [ref=f2e3991]: Logs flooded by an unreachable server.
                - text: A terminal or tool server that cannot be reached now records one line per attempt rather than a full stack trace, where a few minutes of downtime could fill the log with hundreds of megabytes and drown out everything else.
                - link "#27755" [ref=f2e3992] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27755
                - text: ","
                - link "#27751" [ref=f2e3993] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27751
                - text: ","
                - link "#27757" [ref=f2e3994] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27757
                - text: ","
                - link "#27756" [ref=f2e3995] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27756
              - listitem [ref=f2e3999]:
                - text: 🖱
                - strong [ref=f2e4000]: Clicking inside a chat preview.
                - text: Clicking an image or a source in the preview that appears when you hover a chat in the sidebar no longer flashes a viewer open and shut, since the preview is meant only to be read.
                - link "#27770" [ref=f2e4001] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27770
                - text: ","
                - link "#27769" [ref=f2e4002] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27769
              - listitem [ref=f2e4006]:
                - text: 🛢
                - strong [ref=f2e4007]: Using pgvector with database access by role.
                - text: An instance on Amazon RDS that signs in to its database with a temporary credential rather than a stored password now starts when pgvector is the vector store, where the two could not be used together and the container exited on startup.
                - link "#27754" [ref=f2e4008] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27754
                - text: ","
                - link "#27752" [ref=f2e4009] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27752
              - listitem [ref=f2e4013]:
                - text: 📗
                - strong [ref=f2e4014]: Opening knowledge attached to a model or folder.
                - text: Clicking a knowledge item attached to a model or a folder opens it again, so it can be read and its retrieval mode changed between focused retrieval and the whole document, where since 0.11.0 neither was possible outside a chat.
                - link "#27686" [ref=f2e4015] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27686
                - text: ","
                - link "#27684" [ref=f2e4016] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27684
                - text: ","
                - link "#27801" [ref=f2e4017] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27801
                - text: ","
                - link "#28825" [ref=f2e4018] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28825
              - listitem [ref=f2e4022]:
                - text: 🎚
                - strong [ref=f2e4023]: Retrieval mode shown from another item.
                - text: The retrieval mode shown when opening a knowledge item is now that item's own, where it could show the setting of whichever item was opened before it.
                - link "#27686" [ref=f2e4024] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27686
                - text: ","
                - link "#27684" [ref=f2e4025] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27684
                - text: ","
                - link "#27801" [ref=f2e4026] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27801
                - text: ","
                - link "#28825" [ref=f2e4027] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28825
              - listitem [ref=f2e4031]:
                - text: 🔩
                - strong [ref=f2e4032]: A new chat shown as nearly full.
                - text: The indicator of how full a conversation is now counts tokens the same way the shortening does, where the two read different figures from providers that report both and a fresh chat could appear close to its limit.
                - link "#27620" [ref=f2e4033] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27620
                - text: ","
                - link "#27608" [ref=f2e4034] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27608
                - text: ","
                - link "Commit" [ref=f2e4035] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/978d2572140e4fe31ebbc33274f699c71b8cdc29
              - listitem [ref=f2e4039]:
                - text: 🫱
                - strong [ref=f2e4040]: Abandoned changes to a group's sharing setting.
                - text: Closing the edit dialog for a user group without saving now discards a change to who can share to that group, where the change stayed on screen and was written to the database the next time anything else about the group was saved.
                - link "#28076" [ref=f2e4041] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28076
                - text: ","
                - link "#28075" [ref=f2e4042] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28075
              - listitem [ref=f2e4046]:
                - text: 📛
                - strong [ref=f2e4047]: Editing the wrong group.
                - text: The dialog for editing a user group now stays with the group it was opened for, where a reordering of the list beneath it could leave it saving to a different group.
                - link "#28076" [ref=f2e4048] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28076
                - text: ","
                - link "#28075" [ref=f2e4049] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28075
              - listitem [ref=f2e4053]:
                - text: 🪢
                - strong [ref=f2e4054]: Signing people out from the identity provider.
                - text: A sign-out sent by an identity provider to end someone's session now works, where the check that the message was genuine could fail against providers whose signing keys need the same authentication as everything else, leaving the person signed in.
                - link "Commit" [ref=f2e4055] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/aeda6ff13a25d3b3ba1b303609f35382db22142c
              - listitem [ref=f2e4059]:
                - text: 🪣
                - strong [ref=f2e4060]: Files left behind when a knowledge base is emptied.
                - text: Emptying a knowledge base now removes the files it held, along with their stored copies and their search data, where all three were left behind with nothing in the interface to clear them.
                - link "Commit" [ref=f2e4061] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/363ad352fec9553469852d111bc0506b896504a6
                - text: ","
                - link "#27988" [ref=f2e4062] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27988
              - listitem [ref=f2e4066]:
                - text: ♻
                - strong [ref=f2e4067]: Blank errors when a tool server's saved sign-in cannot be read.
                - text: A tool server whose stored sign-in details cannot be decrypted, which happens when "WEBUI_SECRET_KEY" changes since the key protecting them follows it, now names the server and says to reconnect it, where every startup logged two errors with no message at all.
                - link "Commit" [ref=f2e4068] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/91917b23952af8ca4457f8bb3db70c75ab838fbf
                - text: ","
                - link "#28666" [ref=f2e4069] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28666
                - text: ","
                - link "#28665" [ref=f2e4070] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28665
              - listitem [ref=f2e4074]:
                - text: 🖍
                - strong [ref=f2e4075]: Clearing the supported media types.
                - text: Emptying the supported media types in the documents settings now stays empty, where the previous value came back on the next visit, so images kept being sent to the extraction engine instead of straight to a model that can read them.
                - link "#28750" [ref=f2e4076] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28750
                - text: ","
                - link "#28747" [ref=f2e4077] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28747
                - text: ","
                - link "Commit" [ref=f2e4078] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ecad20b77f9bd700bd818a2f447176f5994320c3
              - listitem [ref=f2e4082]:
                - text: 🫳
                - strong [ref=f2e4083]: Dropping a chat where it already was.
                - text: Dragging a chat in the sidebar and releasing it where it started no longer reloads the whole sidebar, which took around a dozen requests for a move that changed nothing.
                - link "#28664" [ref=f2e4084] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28664
                - text: ","
                - link "#28663" [ref=f2e4085] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28663
              - listitem [ref=f2e4089]:
                - text: 🖲
                - strong [ref=f2e4090]: Filtering while on a later page.
                - text: Changing a filter in the workspace, such as showing only what you created, now returns to the first page, where the list could come back empty with the page controls gone and no way back.
                - link "#28734" [ref=f2e4091] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28734
                - text: ","
                - link "Commit" [ref=f2e4092] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a914868e3c83b08be1399dbae1e4da25a0c00c87
              - listitem [ref=f2e4096]:
                - text: 🪺
                - strong [ref=f2e4097]: Workspace counts left behind.
                - text: The number beside each workspace tab now follows its list, where creating, copying, importing, or deleting something left the old number in place until you moved to another tab or reloaded, and the tools count ignored its search entirely.
                - link "#28983" [ref=f2e4098] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28983
                - text: ","
                - link "#28981" [ref=f2e4099] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28981
              - listitem [ref=f2e4103]:
                - text: 📞
                - strong [ref=f2e4104]: Links that start a voice call.
                - text: Opening a link that starts a call now starts one, where it opened the controls pane and stopped there, leaving the only way to begin a call from outside the application broken.
                - link "#28721" [ref=f2e4105] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28721
                - text: ","
                - link "#28677" [ref=f2e4106] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28677
                - text: ","
                - link "Commit" [ref=f2e4107] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8c1f3d382470edb81fa1efdf6cf4fb6bb188c460
              - listitem [ref=f2e4111]:
                - text: 🆔
                - strong [ref=f2e4112]: Signing in where the provider uses a numeric account id.
                - text: Signing in through GitHub, or any other provider that identifies people by a number, works again on PostgreSQL, where every attempt failed outright since 0.10.2, and on SQLite the existing account was not matched; accounts stored the old way are corrected on the next sign-in.
                - link "Commit" [ref=f2e4113] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a6834f089bc2980fced99a617670e785c988cc9f
                - text: ","
                - link "#28954" [ref=f2e4114] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28954
                - text: ","
                - link "#27760" [ref=f2e4115] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27760
              - listitem [ref=f2e4119]:
                - text: ☎
                - strong [ref=f2e4120]: Chats opening halfway up.
                - text: A conversation whose recent messages are short now opens at the latest message rather than somewhere in the middle, and older messages loaded while scrolling up no longer shift what you were reading.
                - link "#28657" [ref=f2e4121] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28657
                - text: ","
                - link "#28656" [ref=f2e4122] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28656
              - listitem [ref=f2e4126]:
                - text: 🛤
                - strong [ref=f2e4127]: The terminal picker vanishing mid-reply.
                - text: The terminal picker now stays in place while a reply is being written, greyed out until it finishes, where it disappeared from the message box entirely and took the name of the selected terminal with it.
                - link "Commit" [ref=f2e4128] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7a533d0d5b85981f8c5668636f931f8b4a97d604
              - listitem [ref=f2e4132]:
                - text: 🎧
                - strong [ref=f2e4133]: Who a channel says its members are.
                - text: The member list of a channel now includes its owner and everyone in a group that was granted access, where the owner never appeared and granting both a person and a group they were not in listed nobody at all while the count beside it said two.
                - link "#28289" [ref=f2e4134] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28289
                - text: ","
                - link "#28288" [ref=f2e4135] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28288
                - text: ","
                - link "Commit" [ref=f2e4136] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e3e82b14714661ba5bd24e2c47e42cef5594b132
              - listitem [ref=f2e4140]:
                - text: ⛳
                - strong [ref=f2e4141]: Embedding servers behind a password.
                - text: An embedding server protected by a username and password rather than a key now works, where an empty key still sent an authorisation header, which such a server rejected and which made document uploads fail.
                - link "#28684" [ref=f2e4142] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28684
                - text: ","
                - link "#28683" [ref=f2e4143] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28683
                - text: ","
                - link "Commit" [ref=f2e4144] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/97466deea105d6fdde60bf4d9401703fd32e03e9
              - listitem [ref=f2e4148]:
                - text: ✒
                - strong [ref=f2e4149]: Note edits lost without warning.
                - text: Typing in a note now reaches the database, where a save already waiting could be cancelled without a replacement, leaving the editor showing text that was never stored and nothing to say so; this affected notes written by a model or through the API, and any instance without Redis after a restart.
                - link "#28669" [ref=f2e4150] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28669
                - text: ","
                - link "#28667" [ref=f2e4151] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28667
              - listitem [ref=f2e4155]:
                - text: 🗄
                - strong [ref=f2e4156]: Browsing outside the home directory in a terminal.
                - text: A terminal server set to allow browsing the whole filesystem can be browsed above the home directory again, where the file panel pinned itself there and opening a file elsewhere quietly did nothing.
                - link "#29006" [ref=f2e4157] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29006
                - text: ","
                - link "#29000" [ref=f2e4158] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29000
              - listitem [ref=f2e4162]:
                - text: 🏞
                - strong [ref=f2e4163]: Clearing a model's picture.
                - text: A model's picture can be reset to the default logo again, where since 0.11.0 a custom one could only ever be replaced.
                - link "#29007" [ref=f2e4164] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29007
                - text: ","
                - link "#27685" [ref=f2e4165] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27685
                - text: ","
                - link "Commit" [ref=f2e4166] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/06e7aac219b3027a9d578624c473b041ad26a692
              - listitem [ref=f2e4170]:
                - text: 👤
                - strong [ref=f2e4171]: Fallback profile pictures.
                - text: A profile picture that fails to load, such as one belonging to a deleted account, now falls back to the default avatar instead of showing clipped placeholder text beside the message.
                - link "#28270" [ref=f2e4172] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28270
                - text: ","
                - link "#28269" [ref=f2e4173] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28269
              - listitem [ref=f2e4177]:
                - text: ⏱️
                - strong [ref=f2e4178]: Unanswered prompts in tools.
                - text: On deployments that set "WEBSOCKET_EVENT_CALLER_TIMEOUT", a question a tool asks you that goes unanswered now reports a timeout rather than an empty reply, and waiting too long no longer risks disconnecting a tab that is still open.
                - link "#28311" [ref=f2e4179] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28311
              - listitem [ref=f2e4183]:
                - text: 👪
                - strong [ref=f2e4184]: Group member counts updating.
                - text: Adding or removing someone from a group in the admin panel now updates that group's member count straight away, where it stayed at the old number until the page was reloaded.
                - link "Commit" [ref=f2e4185] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/18bf0ade7b35fb25ff7920ad3713624d93f04401
              - listitem [ref=f2e4189]:
                - text: 🕳️
                - strong [ref=f2e4190]: Blank messages left in a conversation.
                - text: Streamed events that never fill in an item no longer leave an empty assistant message saved in the conversation and sent back to the model on every later turn.
                - link "Commit" [ref=f2e4191] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2a0274a0a039dbe0a1ad4d24003b085aae7b896b
              - listitem [ref=f2e4195]:
                - text: 📓
                - strong [ref=f2e4196]: Notes opening blank.
                - text: A note whose shared editing session has not been started yet now opens with its stored content even when several people open it at once, where previously anyone but a lone first viewer got an empty document.
                - link "Commit" [ref=f2e4197] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5078d987f83943671f1d23ebe66bcc8d2af902c3
              - listitem [ref=f2e4201]:
                - text: 🤫
                - strong [ref=f2e4202]: Replies stopping silently after a tool ran.
                - text: When a provider rejects the follow-up request made after a tool finishes, the reason is now shown in the chat instead of the reply simply ending with nothing said.
                - link "Commit" [ref=f2e4203] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a610d77137fabf60a2e0daa961a8ef8f7320293a
                - text: ","
                - link "#28633" [ref=f2e4204] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28633
              - listitem [ref=f2e4208]:
                - text: 🎟️
                - strong [ref=f2e4209]: Connections whose tags were saved as plain text.
                - text: A connection with tags stored as plain text no longer breaks its editor panel or silently blanks the tags on every model coming from it.
                - link "Commit" [ref=f2e4210] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8be4c5fa6a849a9ff4a74f6a2870a115a836e68a
                - text: ","
                - link "#28749" [ref=f2e4211] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28749
              - listitem [ref=f2e4215]:
                - text: 🔌
                - strong [ref=f2e4216]: Stream filters on direct API calls.
                - text: A filter reading a streamed event as an object now works on requests made straight to the chat completions endpoint, matching every other path, where it used to raise and end the reply partway.
                - link "Commit" [ref=f2e4217] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/684111715f742f56a3c7efac9eb7a1e68e54a3ec
              - listitem [ref=f2e4221]:
                - text: 🔇
                - strong [ref=f2e4222]: Filter failures that said nothing.
                - text: When a filter's outlet or stream hook raises, the failure is now reported with the filter's name and a traceback at the default log level, where it was swallowed and left plugin authors with nothing to go on.
                - link "Commit" [ref=f2e4223] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/35fbde0a3fb303b7076b03465b1a2b0ba832df53
              - listitem [ref=f2e4227]:
                - text: 🪜
                - strong [ref=f2e4228]: Falling back when a base model is gone.
                - text: Chatting with a workspace model whose base model has been removed now falls back to the default model for everyone, where the fallback previously applied only for administrators and anyone else was refused whenever that base model had no workspace entry of its own, such as one supplied by a pipe.
                - link "Commit" [ref=f2e4229] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/20fe43d9da621957c48fc92104bc8f1cc0d691b7
              - listitem [ref=f2e4233]:
                - text: 🧠
                - strong [ref=f2e4234]: Conversations breaking after a model switch.
                - text: Switching to a different model once a reasoning model has answered no longer leaves the conversation unusable, where the earlier model's stored reasoning was replayed to a provider that then rejected every later request.
                - link "Commit" [ref=f2e4235] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c4b3e6840f34a5d267bc12c0ec1a82156a324d45
                - text: ","
                - link "#28240" [ref=f2e4236] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28240
              - listitem [ref=f2e4240]:
                - text: 👻
                - strong [ref=f2e4241]: Messages disappearing from a conversation.
                - text: Two things saving the same conversation at once no longer discard each other's changes, where a message could vanish from the screen while still counting toward the model's context and a file attached during a reply was lost on the next save.
                - link "Commit" [ref=f2e4242] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1c13fedb16e74c5888c52ccd928a5eb5bbb1068d
                - text: ","
                - link "#28742" [ref=f2e4243] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28742
              - listitem [ref=f2e4247]:
                - text: 🧬
                - strong [ref=f2e4248]: Workspace models pointing at themselves.
                - text: A workspace model whose base model was set to its own identifier is now saved without that reference, where the entry was thrown away while models were being combined so none of its settings ever took effect.
                - link "Commit" [ref=f2e4249] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/eadce55e343df69520e6bc86dbbdfdcdfdcafb30
                - text: ","
                - link "#28952" [ref=f2e4250] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28952
                - text: ","
                - link "#28923" [ref=f2e4251] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28923
              - listitem [ref=f2e4255]:
                - text: 📭
                - strong [ref=f2e4256]: A short model list sticking on every worker.
                - text: When one worker briefly reports fewer models than it should, that shorter list is no longer left in place for the whole deployment, where chatting with one of the missing models failed on every server until something restarted.
                - link "Commit" [ref=f2e4257] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6330350a406d8c1fd603f725e59a88324c8e2256
                - text: ","
                - link "#28777" [ref=f2e4258] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28777
              - listitem [ref=f2e4262]:
                - text: 📋
                - strong [ref=f2e4263]: Copying from the terminal file browser.
                - text: Copying a file path or a file's contents now works again, where it silently did nothing on deployments the browser does not treat as a secure origin.
                - link "Commit" [ref=f2e4264] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/aa3d56961049618b28717d87acff1d9360cad47a
                - text: ","
                - link "Commit" [ref=f2e4265] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2f97c9fce36b3794d14c925086eca78ff92adf4a
                - text: ","
                - link "#29015" [ref=f2e4266] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29015
              - listitem [ref=f2e4270]:
                - text: 🗺️
                - strong [ref=f2e4271]: Browsing the web through Microsoft Web IQ.
                - text: Fetching a page with the web loader set to Microsoft Web IQ now works, where every attempt failed before a single request was made and had done so ever since that loader was added.
                - link "Commit" [ref=f2e4272] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6dcc2d52692c3fa1993ff1b3ae84c07d35fd9f6b
                - text: ","
                - link "Commit" [ref=f2e4273] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/140d2cf4b59e71d2e9f4986d4d8649fccb47c83d
                - text: ","
                - link "#28688" [ref=f2e4274] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28688
              - listitem [ref=f2e4278]:
                - text: 🔛
                - strong [ref=f2e4279]: Enable or disable all automations only reaching the ones on screen.
                - text: Turning every automation on or off now covers every automation matching your current search and filter, where it only ever touched the ones loaded on the page you were looking at and left the rest running as they were.
                - link "Commit" [ref=f2e4280] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f4a0d3c9734d1662a3f78891f21934f2b82aed1e
          - generic [ref=f2e4281]:
            - generic [ref=f2e4282]: changed
            - generic [ref=f2e4283]:
              - listitem [ref=f2e4287]:
                - text: ⚠️
                - strong [ref=f2e4288]: Database Migrations
                - text: ": This release includes database schema changes; we strongly recommend backing up your database and all associated data before upgrading in production environments. If you are running a multi-worker, multi-server, or load-balanced deployment, all instances must be updated simultaneously, rolling updates are not supported and will cause application failures due to schema incompatibility."
              - listitem [ref=f2e4292]:
                - text: 🏋️
                - strong [ref=f2e4293]: What "THREAD_POOL_SIZE" now sizes.
                - text: The setting now governs both of the pools that background work runs in, where it previously governed only one and the other, carrying most of the blocking work including knowledge searches, sign-ins and file storage, was fixed at a small ceiling no setting could raise, so an instance that set it high will now use more threads than before, up to twice the configured value across the two pools, and one that relied on the old ceiling to hold thread use down should review it.
                - link "Commit" [ref=f2e4294] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4ec6ee14418edd04eaba9e34bd5868453f61df40
                - text: ","
                - link "#28168" [ref=f2e4295] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28168
              - listitem [ref=f2e4299]:
                - text: 💾
                - strong [ref=f2e4300]: Saving replies as they stream.
                - text: The "ENABLE_REALTIME_CHAT_SAVE" setting no longer has any effect, because a reply in progress is now held outside the database and written once when it finishes.
                - link "Commit" [ref=f2e4301] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a1579a01ff43cacb357269707d36267ad35e01d6
              - listitem [ref=f2e4305]:
                - text: 🎭
                - strong [ref=f2e4306]: Playwright web loader egress.
                - text: When a page is fetched with the Playwright loader, the page's own requests for its images, scripts, and stylesheets are now made by the Open WebUI backend instead of by the browser, so administrators using a remote browser through "PLAYWRIGHT_WS_URL" should expect that traffic to leave from the backend's address rather than the browser host, those using a private certificate authority should expect it to be trusted through "AIOHTTP_CLIENT_SSL_CERT_FILE" rather than the browser's own store, and those who set a proxy on the loader should know it no longer applies to these requests, which follow the environment's proxy settings instead.
                - link "#28634" [ref=f2e4307] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28634
              - listitem [ref=f2e4311]:
                - text: 🐌
                - strong [ref=f2e4312]: Slower Playwright page loads without async.
                - text: A page fetched with the Playwright loader on the synchronous path now fetches its images, scripts, and stylesheets one at a time rather than together, which in the change's own measurements took a page with thirty assets from 2.0 to 3.0 seconds, and one with eight slow assets from 1.1 to 4.5 seconds; the asynchronous path is unaffected.
                - link "#28634" [ref=f2e4313] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28634
              - listitem [ref=f2e4317]:
                - text: 🐳
                - strong [ref=f2e4318]: Test-only packages removed from the image.
                - text: The container no longer ships pytest, pytest-docker, the Docker SDK, or netcat, none of which anything in Open WebUI used, so the image is smaller; anyone whose own tools or functions relied on those being present will need to install them themselves.
                - link "#28726" [ref=f2e4319] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28726
              - listitem [ref=f2e4323]:
                - text: 🛡
                - strong [ref=f2e4324]: Forms in embedded pages now work by default.
                - text: A page shown inside a chat, such as an artifact or an HTML preview, may now submit forms unless you turn that off, where it was blocked unless you turned it on.
                - link "Commit" [ref=f2e4325] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3c66d639e31ba8a7477d337b37d8d671ea2430cf
              - listitem [ref=f2e4329]:
                - text: 🅰
                - strong [ref=f2e4330]: Connection prefixes now show in model names.
                - text: A connection's prefix appears in the name shown in the model picker, not only in its identifier, where whether it did depended on the shape of the provider's reply and so worked on some connections and not others; models on prefixed connections will now read differently than before.
                - link "#28950" [ref=f2e4331] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28950
                - text: ","
                - link "#28929" [ref=f2e4332] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28929
              - listitem [ref=f2e4336]:
                - text: 📊
                - strong [ref=f2e4337]: Default usage statistics range.
                - text: Usage statistics now cover the past two years by default for everyone, instead of starting from the date the account was created.
                - link "Commit" [ref=f2e4338] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8dbbc206c5a0706789722c42827479e5db10bb2b
        - generic [ref=f2e4339]:
          - generic [ref=f2e4340]:
            - heading "v0.11.0" [level=3] [ref=f2e4341]
