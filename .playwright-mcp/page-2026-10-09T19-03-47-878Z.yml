                - text: ","
                - link "#27374" [ref=f2e4898] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27374
                - text: ","
                - link "#27396" [ref=f2e4899] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27396
              - listitem [ref=f2e4903]:
                - text: 🪺
                - strong [ref=f2e4904]: Records read without a double pass.
                - text: Loading a model, tool, prompt, skill, note, knowledge base, channel or calendar no longer converts the record twice on the way out.
                - link "Commit" [ref=f2e4905] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f1409266feb224e74fe023d7459f1e2b5aad0b29
                - text: ","
                - link "#27377" [ref=f2e4906] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27377
              - listitem [ref=f2e4910]:
                - text: 🔧
                - strong [ref=f2e4911]: Faster tool and knowledge base listings.
                - text: Listing tools no longer loads each one's full source, and working out which tools and knowledge bases you can see takes a single check rather than one per item.
                - link "#27387" [ref=f2e4912] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27387
              - listitem [ref=f2e4916]:
                - text: 🧊
                - strong [ref=f2e4917]: Quicker collection checks on Chroma.
                - text: Checking whether a collection exists now asks for that one collection instead of listing them all, which grew slower with every knowledge base and file.
                - link "Commit" [ref=f2e4918] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/48ee357156fd7f567ea13eb5ddba0a25701c0351
                - text: ","
                - link "#27394" [ref=f2e4919] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27394
              - listitem [ref=f2e4923]:
                - text: 🔠
                - strong [ref=f2e4924]: Tokenizer loaded once.
                - text: The tokenizer used to split documents is now kept after first use rather than being loaded again for every file.
                - link "Commit" [ref=f2e4925] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7e31f64bc81b2264136a85efc7bb86c00f346784
                - text: ","
                - link "#27394" [ref=f2e4926] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27394
              - listitem [ref=f2e4930]:
                - text: 📗
                - strong [ref=f2e4931]: Faster knowledge base file lists.
                - text: Opening a knowledge base now loads just the file names and details instead of the entire extracted text of every document, so large collections appear almost instantly.
                - link "#27386" [ref=f2e4932] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27386
                - text: ","
                - link "#26144" [ref=f2e4933] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26144
              - listitem [ref=f2e4937]:
                - text: 🗝️
                - strong [ref=f2e4938]: Faster file access checks.
                - text: Working out whether you can open a file no longer scales with how many workspace models and knowledge bases exist, so opening files and listing folder contents stays quick on large instances.
                - link "#27383" [ref=f2e4939] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27383
              - listitem [ref=f2e4943]:
                - text: 🕰️
                - strong [ref=f2e4944]: Faster automation scheduling.
                - text: Working out when an automation that repeats every few minutes or hours runs next is now near instant, instead of taking twenty seconds or more and slowing further each year.
                - link "Commit" [ref=f2e4945] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b3aead23da6cf8ebeedbd9fa3b97c7ac1a3f54ec
                - text: ","
                - link "#26954" [ref=f2e4946] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26954
              - listitem [ref=f2e4950]:
                - text: 📁
                - strong [ref=f2e4951]: Faster folder loading.
                - text: Your folder list no longer runs a separate lookup for every folder to check where it sits, so it loads in a single pass.
                - link "Commit" [ref=f2e4952] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9a49b271aaf5d6eeaec24ab974be38a8c68ddd76
              - listitem [ref=f2e4956]:
                - text: 🎯
                - strong [ref=f2e4957]: One round of requests per folder click.
                - text: Selecting a folder in the sidebar now fetches the folder, the folder tree, and each expanded folder's chats once instead of two to four times.
                - link "#27540" [ref=f2e4958] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27540
                - text: ","
                - link "#27539" [ref=f2e4959] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27539
              - listitem [ref=f2e4963]:
                - text: 🎧
                - strong [ref=f2e4964]: No wasted work when nobody is listening.
                - text: Updates for a chat whose tab has been closed, or for requests made through the API, are no longer packaged up only to be discarded, which matters most on long streamed replies.
                - link "#27366" [ref=f2e4965] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27366
                - text: ","
                - link "Commit" [ref=f2e4966] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/858e9236df1c3d84782e373c22b56cfc312b6db8
              - listitem [ref=f2e4970]:
                - text: 📑
                - strong [ref=f2e4971]: Cheaper audit logging.
                - text: With audit logging on, each request is no longer authenticated a second time just to record the log entry, so audited instances carry noticeably less overhead.
                - link "#27373" [ref=f2e4972] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27373
              - listitem [ref=f2e4976]:
                - text: 🪧
                - strong [ref=f2e4977]: Cheaper tagging after each reply.
                - text: Saving the tags generated for a conversation now updates just that field instead of loading, rewriting and re-reading the whole conversation, which cost more the longer the chat.
                - link "#27382" [ref=f2e4978] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27382
              - listitem [ref=f2e4982]:
                - text: ✍️
                - strong [ref=f2e4983]: Faster saves across the app.
                - text: Saving a chat, note, prompt, tool or user setting no longer re-reads the record it just wrote, so writes finish sooner, most noticeably on long conversations.
                - link "#27381" [ref=f2e4984] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27381
                - text: ","
                - link "#27379" [ref=f2e4985] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27379
                - text: ","
                - link "Commit" [ref=f2e4986] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c182a95ffdb87bae3d47d93387ec1a26c97740a2
                - text: ","
                - link "Commit" [ref=f2e4987] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/977c7930623b860949410a73922579daf81705a7
              - listitem [ref=f2e4991]:
                - text: 🛢️
                - strong [ref=f2e4992]: Less database overhead per request.
                - text: SQLite installations no longer run a connection check before every database call, and requests that never touch the database skip the bookkeeping that used to run regardless.
                - link "#27385" [ref=f2e4993] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27385
              - listitem [ref=f2e4997]:
                - text: ⚡
                - strong [ref=f2e4998]: Faster memory lookups.
                - text: Stored memories are now indexed so retrieving them stays quick as the number you have grows.
                - link "Commit" [ref=f2e4999] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/28bdcb063b8d5d6a0b10943b1b2f87b16ff63621
                - text: ","
                - link "#26957" [ref=f2e5000] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26957
              - listitem [ref=f2e5004]:
                - text: 🪪
                - strong [ref=f2e5005]: Fewer checks before a reply starts.
                - text: Working out whether you may use a model now looks up the model and your group memberships once instead of repeating both, including for every model a workspace model is built on.
                - link "#27378" [ref=f2e5006] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27378
              - listitem [ref=f2e5010]:
                - text: 👤
                - strong [ref=f2e5011]: Lighter user activity checks.
                - text: Checking whether someone is currently active now reads only that timestamp rather than their whole profile, including their profile image.
                - link "Commit" [ref=f2e5012] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c8f2e09fdcafc800c1e3af6da1cd6f2581cd9191
                - text: ","
                - link "#27224" [ref=f2e5013] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27224
              - listitem [ref=f2e5017]:
                - text: 📨
                - strong [ref=f2e5018]: Fewer settings lookups when sending a message.
                - text: Sending a chat message now reads the settings behind tools, file retrieval, voice, skills and the code interpreter in fewer trips to the database, so replies start sooner.
                - link "#27223" [ref=f2e5019] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27223
              - listitem [ref=f2e5023]:
                - text: 🪄
                - strong [ref=f2e5024]: Lighter conversion for Ollama requests.
                - text: Preparing a request for an Ollama model no longer copies the entire conversation before sending it, which cost more with every message and repeated on each tool-call round.
                - link "#27371" [ref=f2e5025] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27371
              - listitem [ref=f2e5029]:
                - text: 🦙
                - strong [ref=f2e5030]: Fewer settings lookups on Ollama requests.
                - text: Ollama chat, generation and embedding requests now read their connection settings once instead of up to four times, so each request reaches the server sooner.
                - link "#27226" [ref=f2e5031] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27226
              - listitem [ref=f2e5035]:
                - text: 🧹
                - strong [ref=f2e5036]: Less repeated work on every response.
                - text: Security headers are now worked out once at startup rather than rebuilt for each response, and ordinary page requests skip the redirect handling they never needed, so responses carry less overhead.
                - link "#27229" [ref=f2e5037] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27229
              - listitem [ref=f2e5041]:
                - text: 🚀
                - strong [ref=f2e5042]: Lower per-request overhead.
                - text: Requests no longer each perform a settings lookup before they are handled, trimming a little latency from everything the app does.
                - link "Commit" [ref=f2e5043] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4493b56e424db29fa9e72310b1ca6b025c3e5f8b
                - text: ","
                - link "#27395" [ref=f2e5044] [cursor=pointer]:
