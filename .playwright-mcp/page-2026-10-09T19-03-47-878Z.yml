              - listitem [ref=f2e5712]:
                - text: 🎰
                - strong [ref=f2e5713]: Model choice on a fresh chat.
                - text: Starting a new chat now falls back to your default model when the previous selection is no longer available, instead of leaving the picker empty, while a model named in the link still wins.
                - link "Commit" [ref=f2e5714] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f91ac068d09eed381e14d35472d80ae4670fe52b
                - text: ","
                - link "#26697" [ref=f2e5715] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26697
              - listitem [ref=f2e5719]:
                - text: 📱
                - strong [ref=f2e5720]: Model selector on small screens.
                - text: The model list now stays fully on screen and sizes itself to the space available, instead of running past the edge or hiding behind the on-screen keyboard on phones.
                - link "Commit" [ref=f2e5721] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/79d3e34eea6dc2828d1945cc2b9fca5d662d825b
                - text: ","
                - link "Commit" [ref=f2e5722] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e39ff71532651438c32b2aa7ffe2b6068c94e6b2
                - text: ","
                - link "Commit" [ref=f2e5723] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ea31a3bd61fdf1a72206f9ed5f7252486d554c9b
              - listitem [ref=f2e5727]:
                - text: 📲
                - strong [ref=f2e5728]: Sidebar stays open over the calendar.
                - text: Opening the calendar from the account menu on a phone now closes the sidebar, as every other entry in that menu already did.
                - link "#26979" [ref=f2e5729] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26979
              - listitem [ref=f2e5733]:
                - text: 🗓️
                - strong [ref=f2e5734]: Automation dialog on narrow screens.
                - text: The buttons along the bottom of the automation dialog now sit on their own row on a phone, instead of the schedule and model pickers wrapping and pushing Cancel into the middle.
                - link "#27027" [ref=f2e5735] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27027
              - listitem [ref=f2e5739]:
                - text: 📐
                - strong [ref=f2e5740]: Input menu with keyboard open.
                - text: The message input's attachment menu now stays on screen and resizes to fit when the on-screen keyboard is open on mobile, instead of running off the edge.
                - link "Commit" [ref=f2e5741] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6e5efc1f757c614814ba88bbae6caa3aaddda528
              - listitem [ref=f2e5745]:
                - text: 🎈
                - strong [ref=f2e5746]: Dropdowns that follow their content.
                - text: A menu now stays in place as its contents grow or shrink, instead of running past the edge of the screen when a submenu swaps in taller content, and no longer bounces as it opens.
                - link "#27460" [ref=f2e5747] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27460
                - text: ","
                - link "#27458" [ref=f2e5748] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27458
              - listitem [ref=f2e5752]:
                - text: 🧾
                - strong [ref=f2e5753]: Attachment menus load once.
                - text: Opening a submenu of the attachment menu now requests its list a single time instead of twice.
                - link "#27461" [ref=f2e5754] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27461
                - text: ","
                - link "#27459" [ref=f2e5755] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27459
              - listitem [ref=f2e5759]:
                - text: 🔦
                - strong [ref=f2e5760]: Chat search on PostgreSQL.
                - text: Searching your chats now finds matches in current conversations on PostgreSQL setups, instead of only matching chats still stored in the older format.
                - link "Commit" [ref=f2e5761] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cc9a44569ef08b64ff44d15607c43966f362ce75
              - listitem [ref=f2e5765]:
                - text: 🧲
                - strong [ref=f2e5766]: Search quality with prefix-based embedding models.
                - text: Memories, knowledge base descriptions and searches against an external vector database now carry the query and content markers your embedding model expects, so results are no longer quietly worse than they should be on models that rely on them.
                - link "Commit" [ref=f2e5767] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c4f5ac65ee3cd20dd1d507eda04fca21a866910a
                - text: ","
                - link "#26958" [ref=f2e5768] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26958
                - text: ","
                - link "#26353" [ref=f2e5769] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26353
              - listitem [ref=f2e5773]:
                - text: 🥄
                - strong [ref=f2e5774]: Counting matches in knowledge base commands.
                - text: Piping text into a search inside knowledge base commands now honours the count and filenames-only flags, instead of returning the matching lines regardless.
                - link "#26721" [ref=f2e5775] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26721
                - text: ","
                - link "#26715" [ref=f2e5776] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26715
              - listitem [ref=f2e5780]:
                - text: 🔍
                - strong [ref=f2e5781]: Knowledge base file search.
                - text: Searching inside knowledge base files now returns matching lines with correct line numbers, and patterns that list alternatives separated by a pipe find matches instead of silently returning none.
                - link "#27249" [ref=f2e5782] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27249
                - text: ","
                - link "Commit" [ref=f2e5783] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e18e249d5da3d8fe701a885edc64341cc5dbf813
                - text: ","
                - link "Commit" [ref=f2e5784] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8d2fee5d4559d030b53575d377a0013e2c67b9fe
                - text: ","
                - link "#26795" [ref=f2e5785] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26795
                - text: ","
                - link "#26781" [ref=f2e5786] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26781
                - text: ","
                - link "#26744" [ref=f2e5787] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26744
              - listitem [ref=f2e5791]:
                - text: 🖨️
                - strong [ref=f2e5792]: PDF text recognition.
                - text: The text recognition package is now included again, so the application starts and PDFs with image text extraction enabled upload correctly instead of failing.
                - link "#26851" [ref=f2e5793] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26851
                - text: ","
                - link "#26646" [ref=f2e5794] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26646
                - text: ","
                - link "#26994" [ref=f2e5795] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26994
              - listitem [ref=f2e5799]:
                - text: 🧿
                - strong [ref=f2e5800]: Mistral OCR on a stock install.
                - text: Extracting documents with Mistral OCR now works out of the box, instead of failing on a missing name resolution library that the code assumed was present.
                - link "#27440" [ref=f2e5801] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27440
              - listitem [ref=f2e5805]:
                - text: 📧
                - strong [ref=f2e5806]: Outlook message uploads.
                - text: Uploading a .msg email now works, where it previously failed because the package it relied on could not be installed alongside the rest of the application at all.
                - link "#26704" [ref=f2e5807] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26704
                - text: ","
                - link "#26690" [ref=f2e5808] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26690
              - listitem [ref=f2e5812]:
                - text: 🖇️
                - strong [ref=f2e5813]: Uploads with PaddleOCR-VL selected.
                - text: With PaddleOCR-VL chosen as the document loader, only PDFs and images now go to it and everything else falls back to the usual handling, so text, markdown, spreadsheet and Word files index instead of being rejected.
                - link "#27529" [ref=f2e5814] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27529
                - text: ","
                - link "#24988" [ref=f2e5815] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/24988
                - text: ","
                - link "#26759" [ref=f2e5816] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26759
              - listitem [ref=f2e5820]:
                - text: 🪙
                - strong [ref=f2e5821]: Documents containing special tokens.
                - text: Splitting text by tokens no longer fails when the content contains reserved marker sequences, so those pages and files can be fetched and added to a knowledge base.
                - link "Commit" [ref=f2e5822] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/33cf3fbb7f017ab1b79dce5c5ca4d4e1c3092844
                - text: ","
                - link "#27094" [ref=f2e5823] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27094
              - listitem [ref=f2e5827]:
                - text: 📚
                - strong [ref=f2e5828]: Knowledge base upload reliability.
                - text: Adding a file directly to a knowledge base now finishes processing and linking the file before reporting success, so uploaded files are reliably searchable.
                - link "Commit" [ref=f2e5829] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f5b196c060805fd22e1aa1c9f738b60221ef0fd8
              - listitem [ref=f2e5833]:
                - text: 🛠️
                - strong [ref=f2e5834]: Web loader settings from the admin panel.
                - text: The web loader picked in admin settings is now actually used, along with its certificate checking, request pacing and proxy settings, so instances that fetch pages through an external loader work again instead of trying to reach the internet directly with whatever was configured at startup.
                - link "#26749" [ref=f2e5835] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26749
                - text: ","
                - link "#26747" [ref=f2e5836] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26747
                - text: ","
                - link "Commit" [ref=f2e5837] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/304cbe4569cddbc9e4641186e51bc9e8d5154533
                - text: ","
                - link "#27083" [ref=f2e5838] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27083
                - text: ","
                - link "#27025" [ref=f2e5839] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27025
                - text: ","
                - link "#27061" [ref=f2e5840] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27061
              - listitem [ref=f2e5844]:
                - text: 🚧
                - strong [ref=f2e5845]: Quoted entries in the web fetch filter list.
                - text: Stray quote marks around a filter entry, which Docker Compose passes through literally, no longer turn the list into one that blocks every web address.
                - link "#26910" [ref=f2e5846] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26910
                - text: ","
                - link "#26908" [ref=f2e5847] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26908
              - listitem [ref=f2e5851]:
                - text: 🌐
                - strong [ref=f2e5852]: Web fetching with certain plugins installed.
                - text: Fetching a web page and loading web search results work again on instances where a tool or function pulls in a replacement networking library, which previously made every fetch fail and return nothing.
                - link "#26796" [ref=f2e5853] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26796
                - text: ","
                - link "#26791" [ref=f2e5854] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26791
              - listitem [ref=f2e5858]:
                - text: 📢
                - strong [ref=f2e5859]: Web search failures explained.
                - text: When a search finds pages but cannot store them, the chat now says what went wrong and points at the document settings, instead of reporting sites searched and then no sources found.
                - link "#26883" [ref=f2e5860] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26883
              - listitem [ref=f2e5864]:
                - text: 🕸️
                - strong [ref=f2e5865]: Mixed web page extraction.
                - text: Fetching several web pages at once now reads each one according to its own format, instead of applying the first page's format to the whole batch and garbling the rest.
                - link "#27367" [ref=f2e5866] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27367
              - listitem [ref=f2e5870]:
                - text: 🧯
                - strong [ref=f2e5871]: Leftover browser sessions on web fetches.
                - text: Fetching pages through a remote Playwright server now closes each page and the browser even when a page times out or the search is abandoned partway, instead of leaving sessions open and slowing every later search until that server was restarted.
                - link "#27526" [ref=f2e5872] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27526
                - text: ","
                - link "#25880" [ref=f2e5873] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/25880
              - listitem [ref=f2e5877]:
                - text: 🖇️
                - strong [ref=f2e5878]: Sign-in profile pictures fetched safely.
                - text: The profile picture pulled in when someone signs in through a provider is now fetched through the same protected path as other outbound requests, so a host that changes its address between the check and the fetch can no longer point it at an internal service, taking the forwarded sign-in token with it.
                - link "#26699" [ref=f2e5879] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26699
              - listitem [ref=f2e5883]:
                - text: 🪃
                - strong [ref=f2e5884]: Backslashes in terminal proxy paths.
                - text: A request to the terminal proxy containing a backslash is now refused, closing a way to smuggle directory traversal past the path check to an upstream that treats it as a separator.
                - link "#27198" [ref=f2e5885] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27198
              - listitem [ref=f2e5889]:
                - text: 🧱
                - strong [ref=f2e5890]: Internal addresses disguised as public ones.
                - text: A web address that hides an internal target inside an IPv6 address, through the mapped, 6to4, Teredo or NAT64 forms, is now recognised and refused like any other internal address.
                - link "Commit" [ref=f2e5891] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1717b493d83c86afa82aa8bc50139250852dd2f3
              - listitem [ref=f2e5895]:
                - text: 🪤
                - strong [ref=f2e5896]: Tighter checks when a page is fetched.
                - text: Every request a fetched page makes is now checked against the address rules rather than only the page itself, each hop of a redirect is checked in turn, and background workers and socket connections the page tries to open are refused.
                - link "Commit" [ref=f2e5897] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bef63a2ae915571d50d2722a635e8bfa753d7877
                - text: ","
                - link "#27042" [ref=f2e5898] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27042
                - text: ","
                - link "#27008" [ref=f2e5899] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27008
              - listitem [ref=f2e5903]:
                - text: 🐢
                - strong [ref=f2e5904]: Dropped pages when fetches are paced.
                - text: Pages fetched through Firecrawl, Tavily, Microsoft Web IQ or Playwright are no longer discarded whenever the loader has to pause between requests, which quietly lost any page following close behind another and sometimes blamed it on a failed security check.
                - link "#27528" [ref=f2e5905] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27528
                - text: ","
                - link "#26079" [ref=f2e5906] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26079
              - listitem [ref=f2e5910]:
                - text: 🎙️
                - strong [ref=f2e5911]: Dictation repeating earlier speech.
                - text: Dictating into the message box no longer re-inserts everything you said in previous recordings, and cancelling a recording no longer inserts the text anyway.
                - link "#26793" [ref=f2e5912] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26793
                - text: ","
                - link "#26784" [ref=f2e5913] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26784
              - listitem [ref=f2e5917]:
                - text: 🧩
                - strong [ref=f2e5918]: Order of long transcriptions.
                - text: A long recording split into pieces for transcription is now reassembled in the order it was spoken, instead of sections sometimes appearing out of sequence in the transcript and everything read from it.
                - link "#27417" [ref=f2e5919] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27417
                - text: ","
                - link "#27143" [ref=f2e5920] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27143
              - listitem [ref=f2e5924]:
                - text: 🔊
                - strong [ref=f2e5925]: Text-to-speech reliability.
                - text: Text-to-speech playback and other streamed responses no longer intermittently cut out partway through when several requests run at once.
                - link "#26924" [ref=f2e5926] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26924
                - text: ","
                - link "#26922" [ref=f2e5927] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26922
              - listitem [ref=f2e5931]:
                - text: 🧮
                - strong [ref=f2e5932]: Anthropic usage reporting.
                - text: Responses from the Anthropic-compatible API now report accurate input and output token counts, pass through cache and server tool figures where the provider gives them, and leave the input count out entirely rather than reporting zero when it is unknown.
                - link "Commit" [ref=f2e5933] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e8b59b2ef35ecb727fa760cd565d6da20c9e7e79
                - text: ","
                - link "Commit" [ref=f2e5934] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/51ff386fd6461c07225d10a0de530019eebdd157
                - text: ","
                - link "Commit" [ref=f2e5935] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0576e8eeb5797a36b43eba5790a4e2a5dd8e5a4d
                - text: ","
                - link "Commit" [ref=f2e5936] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8e74cac8decc0a54137d7214e70c33b0dd52a99a
                - text: ","
                - link "Commit" [ref=f2e5937] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/93a34bb25b32ae0b3a876fd3161c7778227b76bf
                - text: ","
                - link "Commit" [ref=f2e5938] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4c2d864b3f4c1ae6c4c9bd93aea078d4bf520463
                - text: ","
                - link "#26790" [ref=f2e5939] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26790
                - text: ","
                - link "#27293" [ref=f2e5940] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27293
                - text: ","
                - link "Docs:#1328" [ref=f2e5941] [cursor=pointer]:
                  - /url: https://github.com/open-webui/docs/issues/1328
              - listitem [ref=f2e5945]:
                - text: 📨
                - strong [ref=f2e5946]: Non-streaming requests to strict providers.
                - text: A request that is not streaming no longer carries the streaming-only usage option, which some providers reject outright.
              - listitem [ref=f2e5950]:
                - text: 🪝
                - strong [ref=f2e5951]: Tool calls with structured arguments.
                - text: A provider that sends a tool call's arguments as an object, or as nothing at all, no longer breaks the reply partway through.
                - link "#27195" [ref=f2e5952] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27195
              - listitem [ref=f2e5956]:
                - text: 🧬
                - strong [ref=f2e5957]: Shared pipe model tool calls.
                - text: Non-admin users of a shared model built on a pipe or manifold model no longer see the response silently stop right after a tool call.
                - link "#26906" [ref=f2e5958] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26906
                - text: ","
                - link "#26900" [ref=f2e5959] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26900
              - listitem [ref=f2e5963]:
                - text: 🧑‍🔧
                - strong [ref=f2e5964]: Startup as an arbitrary user.
                - text: Running the image as a non-root account, as OpenShift and similar setups do, no longer fills the boot log with permission errors while it writes its own icons and manifest.
                - link "#26664" [ref=f2e5965] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26664
                - text: ","
                - link "#26662" [ref=f2e5966] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26662
              - listitem [ref=f2e5970]:
                - text: 🩹
                - strong [ref=f2e5971]: Startup with an ownerless tool or function.
                - text: A tool or function left without an owner no longer prevents the application from starting, which had blocked all chat responses until it was removed.
                - link "#26850" [ref=f2e5972] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26850
                - text: ","
                - link "#26843" [ref=f2e5973] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26843
              - listitem [ref=f2e5977]:
                - text: 🏷️
                - strong [ref=f2e5978]: Model names containing a connection prefix.
                - text: A prefix set on a connection is now removed only from the front of the model name, so a model whose own name contains that text is no longer mangled before the request is sent.
                - link "Commit" [ref=f2e5979] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ed663f16ecaaf99de194922d1634ecc5d906c703
              - listitem [ref=f2e5983]:
                - text: 🦙
                - strong [ref=f2e5984]: Newly pulled Ollama models.
                - text: Sending a message to a model that was pulled after the list was last built now refreshes the list and proceeds, instead of reporting the model as not found.
                - link "Commit" [ref=f2e5985] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ed663f16ecaaf99de194922d1634ecc5d906c703
                - text: ","
                - link "#27353" [ref=f2e5986] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27353
              - listitem [ref=f2e5990]:
                - text: 🗑️
                - strong [ref=f2e5991]: Deleting a model from the selector.
                - text: Removing a workspace model from the model selector menu now deletes just that model and leaves the underlying one in place, instead of failing with a not found error.
                - link "#26819" [ref=f2e5992] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26819
              - listitem [ref=f2e5996]:
                - text: 🔑
                - strong [ref=f2e5997]: Connecting a remote MCP server over OAuth.
                - text: Setting up a remote MCP server now reports plainly when its sign-in details cannot be discovered, rather than saving an unusable connection that failed with a server error the moment you tried to authorise it.
                - link "#26654" [ref=f2e5998] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26654
                - text: ","
                - link "#26647" [ref=f2e5999] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26647
              - listitem [ref=f2e6003]:
                - text: 🪢
                - strong [ref=f2e6004]: Tool servers with cross-referencing types.
                - text: A tool server whose description defines types that refer to each other now loads its tools instead of failing outright, so the integration appears in model and tool selection again.
                - link "#27413" [ref=f2e6005] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27413
                - text: ","
                - link "#27239" [ref=f2e6006] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27239
              - listitem [ref=f2e6010]:
                - text: 👥
                - strong [ref=f2e6011]: Previewing what someone can use.
                - text: The preview of a person's access now includes the models, knowledge bases and tools they own, not just the ones shared with them.
                - link "Commit" [ref=f2e6012] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a9a3e5b95c8e641881fedc1ce7431eedab9a371b
                - text: ","
                - link "#27423" [ref=f2e6013] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27423
                - text: ","
                - link "#27407" [ref=f2e6014] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/27407
              - listitem [ref=f2e6018]:
                - text: 🧰
                - strong [ref=f2e6019]: Model editor loading.
                - text: The model editor no longer fails to open when its tool list can't be loaded, falling back gracefully instead.
                - link "Commit" [ref=f2e6020] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/10724d057af13a826c52e92b1c01a031656768d5
              - listitem [ref=f2e6024]:
                - text: 🗃️
                - strong [ref=f2e6025]: Milvus Lite collection creation.
                - text: Setting up collections now succeeds on embedded Milvus Lite, which previously could fail while creating the resource index.
                - link "#26911" [ref=f2e6026] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26911
              - listitem [ref=f2e6030]:
                - text: 🧽
                - strong [ref=f2e6031]: Milvus log noise.
                - text: Instances backed by Milvus no longer fill their logs with deprecation warnings while indexing and retrieving, and keep working with future PyMilvus releases that drop the old interface entirely.
                - link "#27521" [ref=f2e6032] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27521
                - text: ","
                - link "#26978" [ref=f2e6033] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26978
              - listitem [ref=f2e6037]:
                - text: 🚏
                - strong [ref=f2e6038]: Stray terminal containers.
                - text: Terminal orchestrator connections that use a policy now send every request through that policy, so each person no longer ends up with a second unintended container alongside the intended one.
                - link "#26945" [ref=f2e6039] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26945
                - text: ","
                - link "Commit" [ref=f2e6040] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7088d245bb45fc69c0b22748563b9f3c6f0daa73
              - listitem [ref=f2e6044]:
                - text: 🔦
                - strong [ref=f2e6045]: Connections on hardened instances.
                - text: With the admin access bypass turned off, a connection that has no access grants yet is now reachable by administrators again, instead of being hidden from everyone including the admin who created it.
                - link "#27581" [ref=f2e6046] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27581
                - text: ","
                - link "#27580" [ref=f2e6047] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27580
                - text: ","
                - link "#27064" [ref=f2e6048] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27064
              - listitem [ref=f2e6052]:
                - text: ♻️
                - strong [ref=f2e6053]: Connection changes take effect immediately.
                - text: Saving connection settings now refreshes the model list straight away, instead of leaving the previous models in place until the server was restarted.
              - listitem [ref=f2e6057]:
                - text: 🚫
                - strong [ref=f2e6058]: Disabled OpenAI connections are enforced.
                - text: Turning off the OpenAI API now blocks chat requests to it and clears its models, rather than only hiding it from the interface.
              - listitem [ref=f2e6062]:
                - text: 🪛
                - strong [ref=f2e6063]: Deleting an Ollama connection.
                - text: Removing an Ollama connection now saves straight away, instead of reappearing until the Ollama API switch was toggled afterwards.
                - link "#27483" [ref=f2e6064] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27483
                - text: ","
                - link "#27482" [ref=f2e6065] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27482
              - listitem [ref=f2e6069]:
                - text: 🧹
                - strong [ref=f2e6070]: Orphaned sessions get cleaned up.
                - text: The instance that reaps sessions left behind by a crashed worker now keeps trying if another instance holds the job, rather than one instance giving up for good and leaving stale sessions to accumulate, and the lock it uses can no longer be released or renewed by an instance that does not hold it.
                - link "Commit" [ref=f2e6071] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bf35f64a7f14161933dfa608577a977d107b1569
                - text: ","
                - link "Commit" [ref=f2e6072] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/846ba80a9d5e75837d3db37185e9a23b1e6bfe78
              - listitem [ref=f2e6076]:
                - text: 🧊
                - strong [ref=f2e6077]: Redis cluster connections.
                - text: A deployment using Redis in cluster mode is no longer handed a connection built for a single server, or the reverse, when both point at the same address.
                - link "Commit" [ref=f2e6078] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fc4906c9e9df3fa42bb9073ac197383347caa853
              - listitem [ref=f2e6082]:
                - text: 🚏
                - strong [ref=f2e6083]: Stopping a reply when Redis is configured.
                - text: The stop button now actually halts generation on Redis-backed deployments, where the listener that carries stop requests between instances quietly died after a few idle seconds and left tokens streaming on, and a new "REDIS_SOCKET_TIMEOUT" setting controls that timeout.
                - link "#27104" [ref=f2e6084] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27104
                - text: ","
                - link "#26779" [ref=f2e6085] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26779
              - listitem [ref=f2e6089]:
                - text: 🛟
                - strong [ref=f2e6090]: Redis failover on timeouts.
                - text: A Redis connection that times out now retries against a freshly resolved primary instead of failing, so Sentinel setups recover from a failover rather than erroring out.
                - link "Commit" [ref=f2e6091] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/75a8a0046b5b2ebd9942b25035b346aa953f81cc
                - text: ","
                - link "#27210" [ref=f2e6092] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27210
              - listitem [ref=f2e6096]:
                - text: 👣
                - strong [ref=f2e6097]: First sign-in through a trusted header.
                - text: Two requests arriving together for someone signing in for the first time through a trusted header no longer create two accounts for the same person, and the database now refuses a second account for an address that already exists, whatever its capitalisation.
                - link "Commit" [ref=f2e6098] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b190dcf3caa00dc8b7b9c7312828298d9143f60d
                - text: ","
                - link "Commit" [ref=f2e6099] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/50e050e1957de40caa9df479b4c0d9b814f1f623
                - text: ","
                - link "#27571" [ref=f2e6100] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27571
                - text: ","
                - link "#27117" [ref=f2e6101] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27117
              - listitem [ref=f2e6105]:
                - text: 🔧
                - strong [ref=f2e6106]: Sign-on settings from environment variables.
                - text: Single sign-on settings supplied through environment variables are no longer overridden by stale values saved at first startup, so changing them takes effect.
                - link "#26928" [ref=f2e6107] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26928
                - text: ","
                - link "#26917" [ref=f2e6108] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26917
              - listitem [ref=f2e6112]:
                - text: 🎫
                - strong [ref=f2e6113]: Expired identity tokens sent to tools.
                - text: A sign-in session is now refreshed before the earliest of its tokens expires, so tools and pipes that forward your identity no longer hand a downstream service a token it rejects.
                - link "#27520" [ref=f2e6114] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27520
                - text: ","
                - link "#27066" [ref=f2e6115] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27066
              - listitem [ref=f2e6119]:
                - text: 🎫
                - strong [ref=f2e6120]: Sign-in tokens that never expire.
                - text: A provider that returns no expiry and no way to refresh is now taken at its word, instead of being given an invented one-hour lifetime that left the session unusable afterwards.
                - link "Commit" [ref=f2e6121] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98656b7c5e29383b61d2113164466b8d4ab1d424
                - text: ","
                - link "#26802" [ref=f2e6122] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26802
                - text: ","
                - link "#26141" [ref=f2e6123] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26141
              - listitem [ref=f2e6127]:
                - text: 🔓
                - strong [ref=f2e6128]: Single sign-on after a key rotation.
                - text: Signing in with OIDC now recovers when the provider rotates its signing key, refreshing the cached keys and retrying instead of failing with an invalid credentials error.
                - link "#27310" [ref=f2e6129] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27310
                - text: ","
                - link "#26407" [ref=f2e6130] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26407
              - listitem [ref=f2e6134]:
                - text: 🔑
                - strong [ref=f2e6135]: Signing in after a session expires.
                - text: An expired session now cleanly returns you to the sign-in page and back to where you were afterwards, instead of bouncing you away from the sign-in page or leaving a stale session behind.
                - link "Commit" [ref=f2e6136] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/609cc6ad9b597c6a3f4df6f9dba93d6ff6ec1f18
                - text: ","
                - link "Commit" [ref=f2e6137] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/29782aba01b8f34625949170dc9ee9e1c5872893
                - text: ","
                - link "#26751" [ref=f2e6138] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26751
                - text: ","
                - link "#26731" [ref=f2e6139] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26731
              - listitem [ref=f2e6143]:
                - text: 🫥
                - strong [ref=f2e6144]: Temporary chats and channels write nothing.
                - text: Generating or editing an image and status updates in a temporary chat or a channel message no longer try to save themselves against a conversation that was never stored, and the task list tools are no longer offered there at all rather than being offered and then failing.
                - link "Commit" [ref=f2e6145] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d484a2a99e3a0c21fdcad007a50ebc412fffbb2e
                - text: ","
                - link "Commit" [ref=f2e6146] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d2936c880cfc8cb71bb5c235926048ae189bba25
                - text: ","
                - link "Commit" [ref=f2e6147] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b45c020f68a9499b66e598e854b17a3f232b6cf2
                - text: ","
                - link "Commit" [ref=f2e6148] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/71c4da8c065491a96e41da3c9f0c663e5f759468
                - text: ","
                - link "#27432" [ref=f2e6149] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27432
              - listitem [ref=f2e6153]:
                - text: 🎞️
                - strong [ref=f2e6154]: Artifacts panel reopening itself.
                - text: The artifacts panel now opens once when a finished block is detected, so closing it partway through a reply no longer sees it forced back open on every word that follows.
                - link "Commit" [ref=f2e6155] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4856afcef8251969f751ade5760cefea9577c051
                - text: ","
                - link "#27399" [ref=f2e6156] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27399
              - listitem [ref=f2e6160]:
                - text: 🏞️
                - strong [ref=f2e6161]: Images returned by a tool.
                - text: Images a tool produces are now passed to the model in a form the OpenAI-compatible providers accept, so it can actually look at them instead of receiving a result it cannot read.
                - link "Commit" [ref=f2e6162] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/dd86b984bd508cf2841f08dae90411dfb5fe407f
              - listitem [ref=f2e6166]:
                - text: 🖼️
                - strong [ref=f2e6167]: External message images.
                - text: Images hosted on other sites and referenced in a message now display inline instead of being replaced with a placeholder.
                - link "Commit" [ref=f2e6168] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/890bfd0d9771d1919ce24f04e11b6c96589fca5b
              - listitem [ref=f2e6172]:
                - text: 🔣
                - strong [ref=f2e6173]: Names containing a vertical bar.
                - text: What you insert with the at sign or a slash is now recorded by the key you typed rather than guessed from its name, so a prompt or model whose name contains a vertical bar is no longer mistaken for a skill.
                - link "Commit" [ref=f2e6174] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e28b391e514384ec329ca871d02189aa81fb1a00
              - listitem [ref=f2e6178]:
                - text: 〰️
                - strong [ref=f2e6179]: Text above a collapsible block.
                - text: A line written directly above a collapsible section is no longer turned into a large heading, and the section itself still renders as a collapsible widget rather than leaking its markup.
                - link "Commit" [ref=f2e6180] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7d77efe0f1cfa4782893ffde78419a96a95240f4
                - text: ","
                - link "#27148" [ref=f2e6181] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27148
                - text: ","
                - link "#27001" [ref=f2e6182] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27001
              - listitem [ref=f2e6186]:
                - text: ✳️
                - strong [ref=f2e6187]: Asterisks in the message input.
                - text: Wrapping a word in asterisks no longer silently turns it italic and swallows the asterisks, so your prompt reaches the model exactly as you typed it.
                - link "Commit" [ref=f2e6188] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/001775d8e868ce44f125e0d683dd50363f0e8318
              - listitem [ref=f2e6192]:
                - text: 📶
                - strong [ref=f2e6193]: Reconnect warnings on mobile.
                - text: Switching back to Open WebUI after using another app no longer flashes a connection lost warning while the tab wakes up and reconnects on its own.
                - link "Commit" [ref=f2e6194] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/63ada247066dfc51e0e9559366f0cfd9a98db40b
              - listitem [ref=f2e6198]:
                - text: 🧭
                - strong [ref=f2e6199]: Sidebar access from the automation editor.
                - text: Opening an automation on a phone no longer hides the sidebar button, so you can move around without leaving the editor first.
              - listitem [ref=f2e6203]:
                - text: 🔣
                - strong [ref=f2e6204]: Chats containing unusual characters.
                - text: Broken character sequences are now cleaned out of text before it is stored, so a conversation that picked one up still saves and still opens instead of failing to load.
                - link "Commit" [ref=f2e6205] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/43e7eefa959918baf9fbf867a12b5d721fd782af
                - text: ","
                - link "#27201" [ref=f2e6206] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27201
                - text: ","
                - link "#27081" [ref=f2e6207] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27081
              - listitem [ref=f2e6211]:
                - text: 📛
                - strong [ref=f2e6212]: Failures after a tool call.
                - text: A reply that fails while continuing after a tool call or a code interpreter run now says so, instead of stopping mid-answer with nothing to explain why.
                - link "Commit" [ref=f2e6213] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8ab44ed3b153dd8d8d57a444c98d100f281f7f7e
                - text: ","
                - link "#27426" [ref=f2e6214] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27426
                - text: ","
                - link "#27411" [ref=f2e6215] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27411
              - listitem [ref=f2e6219]:
                - text: 💾
                - strong [ref=f2e6220]: Errors kept after reloading.
                - text: An error that ends a streamed reply is now saved to the conversation, so it is still there when you reload instead of disappearing.
                - link "#27365" [ref=f2e6221] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27365
                - text: ","
                - link "#27074" [ref=f2e6222] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27074
              - listitem [ref=f2e6226]:
                - text: 💬
                - strong [ref=f2e6227]: Readable error messages.
                - text: Errors in a conversation now always show readable text that wraps instead of running off the edge, including errors that arrive wrapped inside another error.
              - listitem [ref=f2e6231]:
                - text: 🪝
                - strong [ref=f2e6232]: Blocked webhook targets look like failures.
                - text: A webhook pointing at an address that is not publicly reachable is now skipped with a short warning, instead of an error and a full traceback that read like the server crashing on startup.
                - link "Commit" [ref=f2e6233] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0671b7aa2b59f5c6235bfa85d6aba54e2ba91353
                - text: ","
                - link "#26975" [ref=f2e6234] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26975
              - listitem [ref=f2e6238]:
                - text: 🕵️
                - strong [ref=f2e6239]: Values printed in error logs.
                - text: A failure no longer prints the contents of nearby variables alongside its traceback, which could put keys and message content into the logs, and a new "LOGURU_DIAGNOSE" setting turns that detail back on for debugging.
                - link "Commit" [ref=f2e6240] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6aebfd88e938d1cd139068b5737a83a82ff393ed
                - text: ","
                - link "#26814" [ref=f2e6241] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26814
              - listitem [ref=f2e6245]:
                - text: 🪵
                - strong [ref=f2e6246]: Empty audit exclusion list.
                - text: Clearing the list of paths excluded from audit logging no longer switches off auditing altogether, so requests are recorded as intended.
                - link "#27370" [ref=f2e6247] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27370
                - text: ","
                - link "Commit" [ref=f2e6248] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2ef6c76f5126ccdef5d1c814004920941275f45d
              - listitem [ref=f2e6252]:
                - text: 🗒️
                - strong [ref=f2e6253]: Readable audit log bodies.
                - text: Audit logs that record response bodies now store them as readable text instead of compressed data, so entries are legible whenever a browser requested compression.
                - link "#27369" [ref=f2e6254] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27369
              - listitem [ref=f2e6258]:
                - text: 👍
                - strong [ref=f2e6259]: Rating in feedback events.
                - text: Events sent when someone rates a response now carry the rating that was given, instead of reporting it as empty.
                - link "Commit" [ref=f2e6260] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/300302d43259e119cd88247b3f246bea82b4dd8e
                - text: ","
                - link "#26840" [ref=f2e6261] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26840
              - listitem [ref=f2e6265]:
                - text: ⏱️
                - strong [ref=f2e6266]: Accurate request timing header.
                - text: The processing time reported on each response now includes fractions of a second instead of rounding everything under a second down to zero.
                - link "#27368" [ref=f2e6267] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27368
              - listitem [ref=f2e6271]:
                - text: 📋
                - strong [ref=f2e6272]: Provider rejection logging.
                - text: When a model provider rejects a request, the reason it gave is now recorded in the server logs, so administrators can diagnose failures without querying the provider directly.
                - link "#27238" [ref=f2e6273] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27238
                - text: ","
                - link "#27237" [ref=f2e6274] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27237
                - text: ","
                - link "#26253" [ref=f2e6275] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26253
              - listitem [ref=f2e6279]:
                - text: ⏳
                - strong [ref=f2e6280]: Faster licensed startup.
                - text: Instances with a license key no longer wait on the license server during startup, so the app becomes ready to serve traffic without that delay.
                - link "Commit" [ref=f2e6281] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8f7753331752e72b17ef8f055318ab548a73f4b8
                - text: ","
                - link "Commit" [ref=f2e6282] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0c7ddbdb4f7dbd46f1dadc3242dbb13b81b47758
              - listitem [ref=f2e6286]:
                - text: 📅
                - strong [ref=f2e6287]: Calendar invitation responses.
                - text: Whether you have accepted an invitation is now decided by your own response rather than by whoever created the event, and invitations you decline disappear from your calendar.
                - link "#27007" [ref=f2e6288] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27007
              - listitem [ref=f2e6292]:
                - text: 🗓️
                - strong [ref=f2e6293]: Schedules written by hand.
                - text: A recurrence rule is now read the same way whether it is written in upper or lower case, a start date in the rule is respected, second-by-second rules are understood, and a rule that cannot be supported is refused with a clear message instead of behaving unpredictably.
                - link "Commit" [ref=f2e6294] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c4ae8c86786fed521960466f6d8eef8af22c2946
                - text: ","
                - link "Commit" [ref=f2e6295] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2d928df30443516a9a3d6b71b0f31426a2362499
                - text: ","
                - link "#27470" [ref=f2e6296] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27470
              - listitem [ref=f2e6300]:
                - text: 📅
                - strong [ref=f2e6301]: One calendar event stalling the server.
                - text: Working out when a repeating event happens next now walks its rule once rather than re-counting from the beginning for every occurrence, so an event repeating every minute from an old start date can no longer occupy the server for everyone.
                - link "#27468" [ref=f2e6302] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27468
              - listitem [ref=f2e6306]:
                - text: ⏰
                - strong [ref=f2e6307]: Recurring automation scheduling.
                - text: Automations that repeat every few minutes or hours now align to the clock and are no longer wrongly rejected as having no upcoming runs when the server clock is ahead of your timezone.
                - link "Commit" [ref=f2e6308] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b3aead23da6cf8ebeedbd9fa3b97c7ac1a3f54ec
                - text: ","
                - link "#26954" [ref=f2e6309] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26954
          - generic [ref=f2e6310]:
            - generic [ref=f2e6311]: changed
            - generic [ref=f2e6312]:
              - listitem [ref=f2e6316]:
                - text: ⚠️
                - strong [ref=f2e6317]: Database Migrations
                - text: ": This release includes database schema changes; we strongly recommend backing up your database and all associated data before upgrading in production environments. If you are running a multi-worker, multi-server, or load-balanced deployment, all instances must be updated simultaneously, rolling updates are not supported and will cause application failures due to schema incompatibility."
              - listitem [ref=f2e6321]:
                - text: 🛠️
                - strong [ref=f2e6322]: Admin settings moved into settings.
                - text: Admin settings and the analytics dashboard are no longer separate pages and now open alongside your personal settings in the settings window, under their own Admin section, with the old links redirecting there.
                - link "Commit" [ref=f2e6323] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c1460570b7e2897a3e648441a0206ad25e603b8c
                - text: ","
                - link "Commit" [ref=f2e6324] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3ce3c529365a3cd9e5631b14bfffead6baa2b1ed
                - text: ","
                - link "Commit" [ref=f2e6325] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/667cba1a9561166941f59faf3bfa24038288b449
              - listitem [ref=f2e6329]:
                - text: 📁
                - strong [ref=f2e6330]: Workspace actions in one menu.
                - text: Creating, importing, and exporting workspace items no longer have their own buttons on each page and are now reached from a single Create menu in the workspace header, with creating a prompt or knowledge base opening a dialog rather than a separate page.
                - link "Commit" [ref=f2e6331] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/05e3f713175c1eea43a99f29521eb01700c21d3c
                - text: ","
                - link "Commit" [ref=f2e6332] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f8350360dfd60ff890b73fe2f39aaf20a52ad28b
                - text: ","
                - link "Commit" [ref=f2e6333] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/91277726cd666276ce4b41a722a142eb539089b8
                - text: ","
                - link "Commit" [ref=f2e6334] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1760b073c7595d4075a91b986520ff8eeeaebc35
              - listitem [ref=f2e6338]:
                - text: 🔐
                - strong [ref=f2e6339]: Administrators no longer reach other people's automations.
                - text: Viewing, editing, running and deleting an automation is now limited to the person who created it, so an administrator with a link to someone else's automation is refused rather than allowed through.
                - link "Commit" [ref=f2e6340] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f798d05586a140f1a6b51f1e51b2b2a63d079d45
              - listitem [ref=f2e6344]:
                - text: 🏷️
                - strong [ref=f2e6345]: Shorter titles without emojis.
                - text: Automatically generated titles for chats and notes are now two to four words and no longer include an emoji, and anyone who prefers the old style can restore it by editing the title generation prompt in admin settings.
                - link "Commit" [ref=f2e6346] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/50d3c927bfed3b8dd94fd9f79bff258a84ecbd92
                - text: ","
                - link "Commit" [ref=f2e6347] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7a9928ef172b7c280c377c86cb52957e39340158
              - listitem [ref=f2e6351]:
                - text: 🗂️
                - strong [ref=f2e6352]: Archived chats moved to settings.
                - text: The Archived Chats shortcut is no longer in the user menu, and your archived conversations are now reached through Settings, where they can also be searched and sorted.
                - link "Commit" [ref=f2e6353] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9f17c5960a0e47a09773da4bba12997a31222fc8
                - text: ","
                - link "Commit" [ref=f2e6354] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8dd862d3383978f21111e63fb2d6029711abed9a
              - listitem [ref=f2e6358]:
                - text: 🔢
                - strong [ref=f2e6359]: Usage now reports the latest call separately.
                - text: In a response's usage block, "prompt_tokens" and "completion_tokens" now carry the counts from the most recent model call rather than the running total, while "input_tokens", "output_tokens" and "total_tokens" stay cumulative, so anything reading the first pair for billing should read the second set instead.
                - link "Commit" [ref=f2e6360] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/df94268e892cbb66675170a6c78846aef23f6e89
                - text: ","
                - link "#27031" [ref=f2e6361] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27031
              - listitem [ref=f2e6365]:
                - text: 🧳
                - strong [ref=f2e6366]: The "python-jose" library is no longer installed.
                - text: Nothing in Open WebUI imports it anymore, so it and the two packages it pulled in have been dropped from the image, and any tool or function that imports it directly now needs to install it itself.
                - link "#27444" [ref=f2e6367] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27444
              - listitem [ref=f2e6371]:
                - text: 📦
                - strong [ref=f2e6372]: Storage emulator no longer bundled.
                - text: The optional Google Cloud Storage emulator is no longer installed as part of the full package, so anyone who relied on it for local storage testing now needs to install "gcp-storage-emulator" themselves.
                - link "Commit" [ref=f2e6373] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/30415c925a18b1ea1c3f2739bd944dd939f020cf
