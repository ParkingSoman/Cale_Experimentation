              - listitem [ref=f2e5456]:
                - text: 🧪
                - strong [ref=f2e5457]: Filter edits that survive a reload.
                - text: A change a filter makes to a finished response is now saved with the conversation, instead of showing on screen and reverting the next time the chat is opened.
                - link "#27414" [ref=f2e5458] [cursor=pointer]:
