              - listitem [ref=f2e1920]:
                - text: 🤏
                - strong [ref=f2e1921]: More room in file previews on touch screens.
                - text: File previews on phones and tablets no longer show zoom buttons that sit over an already small preview, leaving pinch to zoom to do the job.
                - link "#29176" [ref=f2e1922] [cursor=pointer]:
