                - link "#27392" [ref=f2e5058] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27392
              - listitem [ref=f2e5062]:
                - text: 🚦
                - strong [ref=f2e5063]: No filter bookkeeping without filters.
                - text: Streamed API responses only build up the full reply for outlet filters when the model actually has one configured, instead of doing it for every request.
                - link "Commit" [ref=f2e5064] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/315a6b5995663eabe1c96776d66b6593860d47d6
                - text: ","
                - link "#27391" [ref=f2e5065] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27391
              - listitem [ref=f2e5069]:
                - text: ✂️
                - strong [ref=f2e5070]: Cheaper tag detection while streaming.
                - text: Watching a reply for reasoning and code blocks now examines only the newly arrived text rather than rescanning the whole answer on every chunk, so a long answer no longer costs progressively more as it grows.
                - link "#27360" [ref=f2e5071] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27360
              - listitem [ref=f2e5075]:
                - text: 🌊
                - strong [ref=f2e5076]: Steadier long responses.
                - text: Building up a streamed reply no longer costs more work as it grows, so long answers keep pace instead of slowing down toward the end.
                - link "#27231" [ref=f2e5077] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27231
