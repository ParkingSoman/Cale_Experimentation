              - listitem [ref=f2e5515]:
                - text: 🔌
                - strong [ref=f2e5516]: Dropped sessions during keepalive.
                - text: Live connections no longer break on a routine keepalive check, which had cut the session so that anything the server needed to run in your browser failed afterwards, most visibly the code execution tool reporting the client as disconnected on every run.
                - link "#27553" [ref=f2e5517] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27553
                - text: ","
