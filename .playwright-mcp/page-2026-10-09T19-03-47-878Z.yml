              - listitem [ref=f2e3171]:
                - text: 💬
                - strong [ref=f2e3172]: Direct messages after an account is deleted.
                - text: A direct message conversation no longer counts a deleted account among its members, and opening a direct message with someone finds the existing conversation instead of starting a second one alongside it.
                - link "Commit" [ref=f2e3173] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a41faa3c226b20e7db7508c49c7d1d015ac9e973
                - text: ","
