              - listitem [ref=f2e1987]:
                - text: 🧊
                - strong [ref=f2e1988]: Streaming no longer stalls on reasoning models.
                - text: A reply from a reasoning model now streams through to the end instead of showing its first few words and then freezing until generation finishes.
                - link "#29053" [ref=f2e1989] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29053
                - text: ","
