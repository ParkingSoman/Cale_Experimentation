                - text: 🎛️
                - strong [ref=f2e2133]: Valves dialog stays in bounds.
                - text: A valve whose selected options form a long line no longer stretches its input past the edge of the dialog and over the page behind it.
                - link "#29203" [ref=f2e2134] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29203
                - text: ","
                - link "#29202" [ref=f2e2135] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29202
              - listitem [ref=f2e2139]:
                - text: 🧹
                - strong [ref=f2e2140]: Shared chats search resets.
                - text: Reopening the shared chats dialog now starts with an empty search box and the full list, rather than a leftover search term above unfiltered results.
                - link "#29082" [ref=f2e2141] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29082
                - text: ","
                - link "#29081" [ref=f2e2142] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29081
              - listitem [ref=f2e2146]:
                - text: 🔎
                - strong [ref=f2e2147]: Case-insensitive search beyond English.
                - text: Searching and filtering by tag now ignore letter case for accented and non-Latin text on installations backed by SQLite, where only unaccented English letters were matched whatever their case.
                - link "Commit" [ref=f2e2148] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/26f37426b7ef6c0c3b1363f413ac9a83ccaaeb71
              - listitem [ref=f2e2152]:
                - text: 🏷️
                - strong [ref=f2e2153]: Labels with colons and example URLs translate correctly.
                - text: Interface text such as
                - code [ref=f2e2154]: "Warning:"
                - text: ","
                - code [ref=f2e2155]: http://localhost:8000
                - text: ", and"
                - code [ref=f2e2156]: https://mineru.net/api/v4
                - text: now appears correctly instead of being misread by the translation system.
                - link "#29161" [ref=f2e2157] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29161
                - text: ","
                - link "#29154" [ref=f2e2158] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29154
              - listitem [ref=f2e2162]:
                - text: 🔑
                - strong [ref=f2e2163]: Precise account matching on SQLite.
                - text: Signing in through an identity provider now matches your account on its exact identifier, so accounts whose identifier is an unusually long or zero-padded number are no longer at risk of being confused with another.
                - link "Commit" [ref=f2e2164] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/17cc566707cd2ee78b460e39c7fad23b9c258c70
              - listitem [ref=f2e2168]:
                - text: 🗃️
                - strong [ref=f2e2169]: Knowledge list loads reliably.
                - text: The Knowledge page in the workspace now fills in its list on opening instead of occasionally staying empty.
                - link "Commit" [ref=f2e2170] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e6031ea6daec897eddbcf0c8b03c2d6fad2b506e
              - listitem [ref=f2e2174]:
                - text: 🎟️
                - strong [ref=f2e2175]: Tool servers without a key.
                - text: A tool server connection saved without a key is no longer sent an empty authorization header, which some servers refused outright.
                - link "Commit" [ref=f2e2176] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/26f37426b7ef6c0c3b1363f413ac9a83ccaaeb71
              - listitem [ref=f2e2180]:
                - text: 🐍
                - strong [ref=f2e2181]: Code interpreter starts on Windows.
                - text: The built-in code interpreter now serves its script and WebAssembly files with the browser-safe file types Windows hosts sometimes overwrite, so Pyodide can load instead of failing before code runs.
                - link "#29139" [ref=f2e2182] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29139
                - text: ","
                - link "#29133" [ref=f2e2183] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29133
          - generic [ref=f2e2184]:
            - generic [ref=f2e2185]: changed
            - generic [ref=f2e2186]:
              - listitem [ref=f2e2190]:
                - text: ⏱️
                - strong [ref=f2e2191]: Daily limit on repeats.
                - text: A calendar event can no longer be set to repeat more often than once a day, and saving one that repeats more often is now refused with a message explaining the limit.
                - link "Commit" [ref=f2e2192] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a93c5080380447e3ab9113cacb73b61c57cbc308
              - listitem [ref=f2e2196]:
                - text: 🏷️
                - strong [ref=f2e2197]: High Contrast Mode is now Accessibility Mode.
                - text: The interface setting previously called 'High Contrast Mode' is now called 'Accessibility Mode', with the same switch in the same place.
                - link "Commit" [ref=f2e2198] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e6031ea6daec897eddbcf0c8b03c2d6fad2b506e
        - generic [ref=f2e2199]:
          - generic [ref=f2e2200]:
            - heading "v0.11.1" [level=3] [ref=f2e2201]
            - generic [ref=f2e2202]: Aug 25, 2026
          - generic [ref=f2e2203]:
            - generic [ref=f2e2204]: added
            - generic [ref=f2e2205]:
              - listitem [ref=f2e2209]:
                - text: 🚦
                - strong [ref=f2e2210]: Human in the loop tool approval.
                - text: Where an administrator has turned it on, you can switch a conversation from letting tools run freely to being asked first, so a model that wants to use a tool stops and waits for you to allow or deny it, one call at a time in a saved conversation, by button or by keyboard shortcut, with your choice remembered for this conversation and for future ones, switching back to running freely releasing anything already waiting, and automations, channel replies, and temporary chats unaffected.
                - link "Commit" [ref=f2e2211] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7d99b2716a0472b2100b3a71825d8eb3fcbbe877
                - text: ","
                - link "Commit" [ref=f2e2212] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ec36972c2b5a8d48713f1a240b0ed305e535b4cc
                - text: ","
                - link "Commit" [ref=f2e2213] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/653562d660398c32a9a193450bbbee300d7195c3
                - text: ","
                - link "Commit" [ref=f2e2214] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fa94a5ab2431edba064150651a14dd4992ef29e8
                - text: ","
                - link "Commit" [ref=f2e2215] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/55c202e841e76cd69679206cd0ecb4a65b039ea4
                - text: ","
                - link "Commit" [ref=f2e2216] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/30f82788bc75e6965da3766e3bf43840dd971eed
                - text: ","
                - link "Commit" [ref=f2e2217] [cursor=pointer]:
