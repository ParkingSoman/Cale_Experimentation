                - text: 🔢
                - strong [ref=f2e3289]: Token counts for background chats.
                - text: Conversations started by automations, timers, sub-agents, and channels now report their token usage like any other chat, rather than arriving without it even when the model is set up to provide it.
                - link "#27661" [ref=f2e3290] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27661
                - text: ","
