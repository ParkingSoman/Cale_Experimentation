                - strong [ref=f2e5580]: Memories from structured replies.
                - text: A reply delivered as structured output is now read when memories are reviewed after a turn, so nothing worth remembering is skipped just because of how the answer arrived.
                - link "Commit" [ref=f2e5581] [cursor=pointer]:
