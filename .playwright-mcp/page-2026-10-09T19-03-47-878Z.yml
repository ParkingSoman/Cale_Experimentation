              - listitem [ref=f2e1861]:
                - text: 🔤
                - strong [ref=f2e1862]: Custom interface fonts reach more of the app.
                - text: The font chosen in interface settings now applies to dropdowns and other interface text that previously fell back to the standard font.
                - link "Commit" [ref=f2e1863] [cursor=pointer]:
