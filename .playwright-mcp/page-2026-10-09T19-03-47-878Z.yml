              - listitem [ref=f2e3185]:
                - text: 💭
                - strong [ref=f2e3186]: Readable errors on chat actions.
                - text: When moving, renaming, or otherwise changing a chat fails, the message explaining why now appears in place of an unhelpful object placeholder.
                - link "#28260" [ref=f2e3187] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28260
                - text: ","
                - link "#28259" [ref=f2e3188] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28259
              - listitem [ref=f2e3192]:
                - text: 🪪
                - strong [ref=f2e3193]: Authorship in shared chats.
                - text: A chat shared with you now shows the name and picture of whoever wrote it, in the message list and in the overview panel, rather than crediting the messages to you.
                - link "#28274" [ref=f2e3194] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28274
                - text: ","
                - link "#28273" [ref=f2e3195] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28273
              - listitem [ref=f2e3199]:
                - text: 🖇️
                - strong [ref=f2e3200]: Adding terminals over plain connections.
                - text: Saving a terminal connection now works when the interface is served without HTTPS, where the dialog would sit there doing nothing because the browser withholds the tool used to generate its identifier.
                - link "Commit" [ref=f2e3201] [cursor=pointer]:
