              - listitem [ref=f2e4392]:
                - text: 🤖
                - strong [ref=f2e4393]: Sub-agents.
                - text: Administrators can now enable sub-agents, which let a model hand parts of a task to background helper agents that run their own tool-driven conversations and report results back into the chat, tuned through new "ENABLE_SUBAGENTS", concurrency, iteration, and system-prompt settings.
                - link "Commit" [ref=f2e4394] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7088d245bb45fc69c0b22748563b9f3c6f0daa73
                - text: ","
                - link "Commit" [ref=f2e4395] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2f37e853d1259a901f736a823bad29dcc2c3b130
                - text: ","
                - link "Commit" [ref=f2e4396] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/959558fd82eb2a3c980231acd500b73ba4b698b3
                - text: ","
                - link "Commit" [ref=f2e4397] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3005b7bc71fcbd5abc6e73c3e4caa4ea781cdb76
              - listitem [ref=f2e4401]:
                - text: 📂
                - strong [ref=f2e4402]: Folder pages.
                - text: Opening a folder now takes you to its own page, where its chats load a page at a time, can be sorted by title or last updated, and you can start a new chat straight from the folder.
                - link "Commit" [ref=f2e4403] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/409fb39717be9ab7becd9e8c01801a08c5bae318
              - listitem [ref=f2e4407]:
                - text: ⏲️
                - strong [ref=f2e4408]: Chat timers.
                - text: The assistant can now set a timer that brings a prompt back into the conversation later, after a delay or at a set time, and can drop it automatically if you read the chat or reply before it fires.
                - link "Commit" [ref=f2e4409] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b23ddeb2800098c6352203ec8fbe9fca40ba415c
              - listitem [ref=f2e4413]:
                - text: 🔔
                - strong [ref=f2e4414]: Notification targets.
                - text: Notifications now have their own settings tab where you can send them to several webhook destinations, each picking which events it wants, from chats finishing or failing to channel messages and calendar alerts, with a test button and a choice between always notifying or only when you are away, and any webhook you already had is carried over for you.
                - link "Commit" [ref=f2e4415] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c55e373b994d3a14c99a97f44261422012f63266
                - text: ","
                - link "Commit" [ref=f2e4416] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cf235738f5a44db415012b3b0ebc1f6e752f5439
                - text: ","
                - link "Commit" [ref=f2e4417] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/200d447f6289faca42f2a666bbabae2c7f3ebadf
                - text: ","
                - link "#24750" [ref=f2e4418] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/24750
              - listitem [ref=f2e4422]:
                - text: 🗯️
                - strong [ref=f2e4423]: Full replies in channels.
                - text: A reply from the assistant in a channel is now saved and shown in full, with its reasoning, tool calls and other structured parts, where it previously came through blank.
                - link "Commit" [ref=f2e4424] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/498cdab9a548d7d2fd19c389204ee26236fc7efe
                - text: ","
                - link "#26720" [ref=f2e4425] [cursor=pointer]:
