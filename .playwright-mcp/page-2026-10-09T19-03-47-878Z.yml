              - listitem [ref=f2e5522]:
                - text: ✂️
                - strong [ref=f2e5523]: Context compaction turn boundaries.
                - text: Long-conversation compaction now summarizes only completed earlier turns instead of sometimes cutting through the middle of a single turn, keeping the current turn's tool calls and results intact.
                - link "#27035" [ref=f2e5524] [cursor=pointer]:
