              - listitem [ref=f2e5084]:
                - text: 📦
                - strong [ref=f2e5085]: Faster JSON handling as an option.
                - text: Administrators can now switch the whole application to a faster encoder through a new "ENABLE_ORJSON" setting, covering request bodies, responses, upstream provider payloads and live updates, where the encoding of live updates was the largest single cost on the workers handling them in clustered deployments; it stays off by default because the faster encoder is stricter about what it accepts.
                - link "#27583" [ref=f2e5086] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27583
              - listitem [ref=f2e5090]:
                - text: ⚙️
                - strong [ref=f2e5091]: Faster Redis handling.
                - text: The compiled "hiredis" parser now ships as a dependency and is used automatically, so deployments backed by Redis spend noticeably less processor time reading responses.
                - link "#27282" [ref=f2e5092] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27282
              - listitem [ref=f2e5096]:
                - text: 🔗
                - strong [ref=f2e5097]: Fewer Redis round trips per chat.
                - text: Deployments backed by Redis now look up the model and connected sessions once per request instead of twice, and fetch the model list in a single call.
                - link "#27225" [ref=f2e5098] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27225
              - listitem [ref=f2e5102]:
                - text: 🛰️
                - strong [ref=f2e5103]: Fewer Sentinel lookups.
                - text: Redis Sentinel deployments no longer ask which server is the primary and open a fresh connection before every single command, which had caused heavy connection churn and stalls under load.
                - link "Commit" [ref=f2e5104] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/75a8a0046b5b2ebd9942b25035b346aa953f81cc
                - text: ","
                - link "#27213" [ref=f2e5105] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27213
                - text: ","
                - link "#27210" [ref=f2e5106] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27210
              - listitem [ref=f2e5110]:
                - text: 📡
                - strong [ref=f2e5111]: Lighter live connection handling.
                - text: Typing indicators, shared document edits and reconnections no longer re-read your account or copy the full participant list each time, and idle sessions are no longer rewritten every few seconds.
                - link "Commit" [ref=f2e5112] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/021c4c7a2e8b5b213f49800ecd331b1b18c2ef99
                - text: ","
                - link "#27393" [ref=f2e5113] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27393
              - listitem [ref=f2e5117]:
                - text: 🏎️
                - strong [ref=f2e5118]: Faster chat search on PostgreSQL.
                - text: Searching chats on PostgreSQL now reads from the message table instead of unpacking each conversation's stored data row by row, so results stay quick as your history grows.
                - link "Commit" [ref=f2e5119] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cc9a44569ef08b64ff44d15607c43966f362ce75
                - text: ","
                - link "#27221" [ref=f2e5120] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27221
              - listitem [ref=f2e5124]:
                - text: ⚡
                - strong [ref=f2e5125]: Lighter model lists.
                - text: Model lists no longer carry embedded profile images in their data, so they load faster.
                - link "Commit" [ref=f2e5126] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9281adc5647b7046e3ddcc53ac4b84be7f650221
                - text: ","
                - link "Commit" [ref=f2e5127] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f3a35507845e4a911c3d278d680a9989bb8d99ad
              - listitem [ref=f2e5131]:
                - text: 🏗️
                - strong [ref=f2e5132]: Fewer queries when building the model list.
                - text: Assembling the model list now makes fewer database round trips and no longer fetches every plugin's source code along the way, so it comes together faster.
                - link "Commit" [ref=f2e5133] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6b655689ccbdf2111620d005a8e6dedb8fb673f8
                - text: ","
                - link "#27389" [ref=f2e5134] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27389
              - listitem [ref=f2e5138]:
                - text: 🪶
                - strong [ref=f2e5139]: Model lists without knowledge text.
                - text: Model lists no longer include the extracted text of files attached to a model as knowledge, so they stay small regardless of how large those knowledge bases are.
                - link "Commit" [ref=f2e5140] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/48625e657ff11161c3588af2747598f102c1a4d1
                - text: ","
                - link "#27287" [ref=f2e5141] [cursor=pointer]:
