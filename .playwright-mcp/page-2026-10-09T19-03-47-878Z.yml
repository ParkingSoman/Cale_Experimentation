              - listitem [ref=f2e5505]:
                - text: 🪫
                - strong [ref=f2e5506]: Terminal choice cleared on load.
                - text: Your selected terminal is no longer dropped while the list of terminals is still loading, so it survives a page refresh.
                - link "Commit" [ref=f2e5507] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9707d3a5c21d2fedada602f2cfd8a104cdc5e5d1
