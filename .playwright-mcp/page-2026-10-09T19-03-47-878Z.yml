              - listitem [ref=f2e2055]:
                - text: 📆
                - strong [ref=f2e2056]: Moved calendar events stay visible.
                - text: Changing an event's date no longer makes it disappear from the calendar, and events already stuck in that state show up again.
                - link "#29085" [ref=f2e2057] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29085
                - text: ","
                - link "#29067" [ref=f2e2058] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29067
              - listitem [ref=f2e2062]:
                - text: 🔁
                - strong [ref=f2e2063]: Repeats follow the event.
                - text: A repeating event now works out its occurrences from its own date and time, where a repeat rule carrying a start date of its own could place them on the wrong weekday or at the wrong hour.
                - link "Commit" [ref=f2e2064] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a93c5080380447e3ab9113cacb73b61c57cbc308
              - listitem [ref=f2e2068]:
                - text: 🔟
                - strong [ref=f2e2069]: Repeating automations keep their count.
                - text: An automation set to run a fixed number of times is no longer shown as running once and quietly rewritten to a single run the next time you open and save it.
