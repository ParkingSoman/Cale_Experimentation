                - text: ","
                - link "Commit" [ref=f2e2218] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7fc5fa1ff3f6cd6f0efcbf847064ca8d21620ba6
                - text: ","
                - link "Commit" [ref=f2e2219] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3eb65f47151af4fb4ccfaf33d6e77154546e7259
                - text: ","
                - link "Commit" [ref=f2e2220] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/62fc436999ad32e82d1405ac14d1f03e0f0341ec
              - listitem [ref=f2e2224]:
                - text: 🙋‍♂️
                - strong [ref=f2e2225]: Models that can ask you a question.
                - text: A new built-in tool lets a model pause and put up to three multiple-choice questions to you before continuing, with room to type your own answer instead, and the question survives a reload in a saved conversation, so you can come back and answer it later rather than losing the conversation.
                - link "Commit" [ref=f2e2226] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4465f52a3eb521854cf190f91b0ea7cf3fa21830
                - text: ","
                - link "Commit" [ref=f2e2227] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/133549a87ee371577453d897c2db2d8071223f27
                - text: ","
                - link "Commit" [ref=f2e2228] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b018feb7419e68314378b3cdd8b7b1b389400a98
                - text: ","
                - link "Commit" [ref=f2e2229] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/083e35144152d6a301bed01aa6d898db3871ddcf
                - text: ","
                - link "Commit" [ref=f2e2230] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/256cce505be8ddd4930e8cb2536faea718d3f789
                - text: ","
                - link "Commit" [ref=f2e2231] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/14e4d72d9a21a10196e8e6efb04180cd9104b8e6
                - text: ","
                - link "Commit" [ref=f2e2232] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/57bd08304e45f707768a898de9f50894929008dd
                - text: ","
                - link "Commit" [ref=f2e2233] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d9014b3483d4c6e8d99e50395afcdc538bcf05cd
              - listitem [ref=f2e2237]:
                - text: 🖇
                - strong [ref=f2e2238]: Agents can now display terminal files directly.
                - text: A model can now show a file it made in a terminal directly in its reply, with a preview and a download button, instead of describing a path that led nowhere when clicked, and a new interface setting chooses whether these open in the reply or in the files pane.
                - link "Commit" [ref=f2e2239] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/78f48a21eef330c0b78c33f2b5fc2169b084997c
                - text: ","
                - link "Commit" [ref=f2e2240] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e623c02acc70c4ee5d7f2eb2f32d9b7f39287663
                - text: ","
                - link "Commit" [ref=f2e2241] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f64c0c87e8d1bfdbe060ea5e5a3dee24c0323657
                - text: ","
                - link "#27650" [ref=f2e2242] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27650
              - listitem [ref=f2e2246]:
                - text: 📶
                - strong [ref=f2e2247]: Streaming rebuilt from the ground up.
                - text: A reply now streams as small pieces of new text instead of resending the whole message so far with every update, so the data sent over a reply grows with its length rather than with its length squared, which on a server with many people chatting at once means far less processor time spent encoding, passing, and decoding those updates, far less load and memory on the shared cache that carries them between instances, and far less work in your browser, which no longer takes in the whole reply again and redraws the parts of it that have not changed on every update, cutting the data sent and the server work spent appending to a message by up to 1000x on a very long reply, and a reply still in progress is now kept aside on the server, so reopening the conversation after a refresh picks it up where it is rather than showing a blank message, on deployments backed by Redis.
                - link "Commit" [ref=f2e2248] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a1579a01ff43cacb357269707d36267ad35e01d6
                - text: ","
                - link "Commit" [ref=f2e2249] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c755ef60c6bd47ea25306bd898d9a6d1bd8e871d
                - text: ","
                - link "Commit" [ref=f2e2250] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d02b6a21fc02fb073782e25356968cfee3c45c36
                - text: ","
                - link "Commit" [ref=f2e2251] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3e186abdd91edee9e97e43c9b345714643a84cf5
              - listitem [ref=f2e2255]:
                - text: 🪵
                - strong [ref=f2e2256]: Much faster throughout.
                - text: Hundreds of places across the application no longer assemble detailed log text that is switched off and thrown away unread, so sending messages, uploading and indexing files, running searches, signing in, and loading admin pages all get that time back, with the largest gains on busy servers, in long conversations, and on chats that draw from a large knowledge base.
                - link "#27834" [ref=f2e2257] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27834
                - text: ","
                - link "#27837" [ref=f2e2258] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27837
              - listitem [ref=f2e2262]:
                - text: 🚀
                - strong [ref=f2e2263]: Faster model list lookups.
                - text: Title generation, tag suggestions, autocomplete, and other background steps of a chat turn now fetch the model list in one go, which keeps other people's responses flowing on busy Redis-backed instances with many models.
                - link "#27821" [ref=f2e2264] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27821
              - listitem [ref=f2e2268]:
                - text: 🛰️
                - strong [ref=f2e2269]: Cheaper log export.
                - text: Deployments that export their logs to a telemetry collector, with "ENABLE_OTEL" and "ENABLE_OTEL_LOGS" both set, now prepare each exported line once instead of twice, which matters more than it used to now that log text is only assembled when something will actually read it.
                - link "#27840" [ref=f2e2270] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27840
              - listitem [ref=f2e2274]:
                - text: 📇
                - strong [ref=f2e2275]: Faster permission checks on large instances.
                - text: Working out which groups you belong to is now a direct lookup rather than a scan of every membership on the server, so chats and the admin user list stay quick as an organization grows.
                - link "#27822" [ref=f2e2276] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27822
              - listitem [ref=f2e2280]:
                - text: ⚙️
                - strong [ref=f2e2281]: Much faster JSON handling.
                - text: Saving and opening chats, reading settings, returning results from built-in tools, streaming replies, signing in and signing up, working out your permissions, and reading stored chunk details during knowledge base searches on Valkey and Oracle vector storage are all handled much faster across the application when the "ENABLE_ORJSON" option is turned on.
                - link "Commit" [ref=f2e2282] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bb0f898b431d5aa45efa7805956657ed9c3dd78d
                - text: ","
                - link "#28396" [ref=f2e2283] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28396
                - text: ","
                - link "#27841" [ref=f2e2284] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27841
                - text: ","
                - link "#27807" [ref=f2e2285] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27807
                - text: ","
                - link "#27805" [ref=f2e2286] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27805
                - text: ","
                - link "#27813" [ref=f2e2287] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27813
              - listitem [ref=f2e2291]:
                - text: 📤
                - strong [ref=f2e2292]: Much faster outbound requests.
                - text: Conversations and embedding batches sent to Ollama and Anthropic models are packaged for delivery much faster, which is most noticeable in long chats when the "ENABLE_ORJSON" option is turned on.
                - link "#27811" [ref=f2e2293] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27811
                - text: ","
                - link "#27810" [ref=f2e2294] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27810
              - listitem [ref=f2e2298]:
                - text: 🐍
                - strong [ref=f2e2299]: Much faster code interpreter output.
                - text: Printed output and generated images from code run in chat appear much faster when the "ENABLE_ORJSON" option is turned on.
                - link "#27812" [ref=f2e2300] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27812
              - listitem [ref=f2e2304]:
                - text: 🪶
                - strong [ref=f2e2305]: Lighter page loads.
                - text: Several small requests the interface makes on every page load, along with a few administrative ones, no longer set up database access they never used, which took several times longer than the rest of the request put together.
                - link "#28178" [ref=f2e2306] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28178
              - listitem [ref=f2e2310]:
                - text: ♻️
                - strong [ref=f2e2311]: One less read per message.
                - text: Sending a message no longer loads the whole conversation from the database twice over, which mattered most in long chats where that record is largest.
                - link "#28809" [ref=f2e2312] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28809
              - listitem [ref=f2e2316]:
                - text: 🏁
                - strong [ref=f2e2317]: Faster skills on large instances.
                - text: Opening the skills list, or sending a message that uses one, no longer checks every skill on the instance one at a time, so both are far quicker where many skills exist and most of them are not yours.
                - link "#28798" [ref=f2e2318] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28798
              - listitem [ref=f2e2322]:
                - text: 🩻
                - strong [ref=f2e2323]: Faster tools on large instances.
                - text: Listing or exporting tools no longer checks every tool on the instance one at a time, so the integrations menu and the tools workspace open faster where many exist.
                - link "Commit" [ref=f2e2324] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4807866a1cf47340f1b5ea76fded95f8114305f9
              - listitem [ref=f2e2328]:
                - text: 🧊
                - strong [ref=f2e2329]: Faster file access checks.
                - text: Checking whether you may reach a file no longer walks every workspace model you can see looking for it, so opening a folder of files, downloading one, or retrieving from one is much quicker on instances with many models.
                - link "#28802" [ref=f2e2330] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28802
              - listitem [ref=f2e2334]:
                - text: 🧱
                - strong [ref=f2e2335]: Faster folder listings.
                - text: Listing your folders now works out your group memberships once for the whole listing rather than again for every item in every folder.
                - link "#28810" [ref=f2e2336] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28810
              - listitem [ref=f2e2340]:
                - text: 🧼
                - strong [ref=f2e2341]: Less work per update in a long chat.
                - text: Each update saved while a reply streams no longer re-examines the entire conversation, only the part being added, so the cost of an update stops growing with the length of the chat.
                - link "#28820" [ref=f2e2342] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28820
              - listitem [ref=f2e2346]:
                - text: 🗃
                - strong [ref=f2e2347]: Cheaper attaching of sources and files to a reply.
                - text: Adding a source, file, or embedded item to a reply now reads just that one field rather than rebuilding the whole conversation to find it, which on a two hundred message chat is around 3.1 ms per item down to 0.65 ms, and no longer grows with the length of the conversation.
                - link "Commit" [ref=f2e2348] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/536b9edec00547d5b84ef2e6ea0f929c054c1333
                - text: ","
                - link "Commit" [ref=f2e2349] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9dff5e93277aa1a2236d702e7e2f55dbb35ea7fa
              - listitem [ref=f2e2353]:
                - text: 🚏
                - strong [ref=f2e2354]: Faster workspace model lookups.
                - text: Working out which workspace models you may edit no longer loads every model on the instance and discards most of them, which also speeds up exporting models and the file access checks that relied on it.
                - link "#28795" [ref=f2e2355] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28795
              - listitem [ref=f2e2359]:
                - text: 📮
                - strong [ref=f2e2360]: Faster handing off a streaming reply.
                - text: Passing a reply in progress between instances now writes it once rather than converting it back and forth and scanning it for characters that only matter elsewhere, which on a large non-English conversation took most of the time spent on each write.
                - link "#28833" [ref=f2e2361] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28833
              - listitem [ref=f2e2365]:
                - text: 🥵
                - strong [ref=f2e2366]: Constant load on an idle instance.
                - text: An instance sitting idle no longer works through every chat you have once a second looking for timers that are due, which on a large history kept about a quarter of a processor core busy doing nothing and could exhaust memory until the application was killed.
                - link "#27663" [ref=f2e2367] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27663
                - text: ","
                - link "#27622" [ref=f2e2368] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27622
                - text: ","
                - link "#27745" [ref=f2e2369] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27745
              - listitem [ref=f2e2373]:
                - text: 📍
                - strong [ref=f2e2374]: Sidebar folders fetched once.
                - text: Refreshing the sidebar now asks for your folders once rather than three times, on page load and on every action that refreshes it.
                - link "#28662" [ref=f2e2375] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28662
                - text: ","
                - link "#28661" [ref=f2e2376] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28661
              - listitem [ref=f2e2380]:
                - text: 💤
                - strong [ref=f2e2381]: Far fewer writes just from being signed in.
                - text: Recording that someone is online now writes at most once a minute for each person rather than on every single request, where an open tab alone caused two write transactions a minute before anyone touched anything.
                - link "#28177" [ref=f2e2382] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28177
                - text: ","
                - link "#28165" [ref=f2e2383] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28165
              - listitem [ref=f2e2387]:
                - text: 🛰
                - strong [ref=f2e2388]: Less overhead on every request.
                - text: The layers each request passes through before it is handled are now one instead of five, which also removes a quarter of that cost from every piece of a streamed reply on instances that set security headers.
                - link "Commit" [ref=f2e2389] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b96d2b12dae5e953e520bec03f74e9b85b955dc7
                - text: ","
                - link "#28171" [ref=f2e2390] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28171
              - listitem [ref=f2e2394]:
                - text: 🎏
                - strong [ref=f2e2395]: Turning off compression of live updates.
                - text: A new "UVICORN_WS_PER_MESSAGE_DEFLATE" setting stops the server compressing every live update it sends, which costs processor time on each one for almost no saving now that a reply streams as small pieces; compression stays on unless it is turned off.
                - link "#28613" [ref=f2e2396] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28613
              - listitem [ref=f2e2400]:
                - text: 🌡
                - strong [ref=f2e2401]: Faster chat list and unread counts.
                - text: Opening the sidebar, and the unread markers on folders, no longer read through your whole chat history to produce a short list, which on an instance with 15000 chats took 2 to 4 seconds.
                - link "#27663" [ref=f2e2402] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27663
                - text: ","
                - link "#27622" [ref=f2e2403] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27622
                - text: ","
                - link "#27745" [ref=f2e2404] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27745
              - listitem [ref=f2e2408]:
                - text: 🥁
                - strong [ref=f2e2409]: Long replies no longer slow as they grow.
                - text: A long reply is no longer re-examined from the beginning for reasoning and code blocks on every piece that arrives, so the work stops growing with the length of the reply, which on a long reply is around 190x less time spent on it.
                - link "#28861" [ref=f2e2410] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28861
              - listitem [ref=f2e2414]:
                - text: 💽
                - strong [ref=f2e2415]: Faster saving of long chats.
                - text: A chat is now written to the database in one go rather than one message at a time, so saving a long conversation is much quicker and puts far less strain on the database, and saving one where nothing has changed writes nothing at all.
                - link "#28806" [ref=f2e2416] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28806
              - listitem [ref=f2e2420]:
                - text: 📦
                - strong [ref=f2e2421]: Faster loading of shared folders.
                - text: Folders shared with you now load in a couple of queries rather than one for each folder and each owner, so the list appears sooner for anyone with many of them.
                - link "#28804" [ref=f2e2422] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28804
              - listitem [ref=f2e2426]:
                - text: ⚡
                - strong [ref=f2e2427]: Uninterrupted chat during knowledge search.
                - text: Responses now keep streaming for everyone on the server while knowledge base searches run, instead of pausing until each search finishes.
                - link "#27824" [ref=f2e2428] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27824
              - listitem [ref=f2e2432]:
                - text: 🔍
                - strong [ref=f2e2433]: Smarter chat search.
                - text: Searching your chats now finds conversations containing all of your words in any order rather than only the exact phrase you typed, with exact matches still listed first, and the preview snippet points at whichever word it found.
                - link "Commit" [ref=f2e2434] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0800c21c64c64810f24c2ec88cca5e36daebb10e
              - listitem [ref=f2e2438]:
                - text: ⌨️
                - strong [ref=f2e2439]: Model switching from the message box.
                - text: Typing "/model" now tells you which model you are on, switching to another by name with "/model" followed by its id, or opening the model picker straight from the slash menu without reaching for the mouse.
                - link "Commit" [ref=f2e2440] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/29eeda9f9abeaedf77176908cb036ace7f175e76
                - text: ","
                - link "Commit" [ref=f2e2441] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9c7ce154e79a3baea3a8223ab1e5b1371ce80dbb
              - listitem [ref=f2e2445]:
                - text: 📎
                - strong [ref=f2e2446]: Sending while attachments upload.
                - text: Sending a message before its files have finished uploading now queues it and sends it automatically once they are ready, instead of refusing with an error, and each queued message shows the progress of its attachments.
                - link "Commit" [ref=f2e2447] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6c4d0ace163a89aba6e8cd2aa9fef185167ebe0f
                - text: ","
                - link "Commit" [ref=f2e2448] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c1c07cbe0f847e4dd04e21f2a6c5f12cdc0fc7ee
                - text: ","
                - link "#28381" [ref=f2e2449] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28381
                - text: ","
                - link "#28380" [ref=f2e2450] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28380
              - listitem [ref=f2e2454]:
                - text: 📖
                - strong [ref=f2e2455]: Opening a document at the right page.
                - text: A model showing you a PDF, Word document, or slide deck from a terminal can now open it at a particular page or slide, so a reply that cites something on page 76 can put that page in front of you.
                - link "Commit" [ref=f2e2456] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fd8cc2ba4a226ccbf51e114c71f156676eabb2d9
                - text: ","
                - link "Commit" [ref=f2e2457] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cf4ac9c8db67031627f196fae894764367fba5b4
                - text: ","
                - link "Commit" [ref=f2e2458] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6cb2449ab70ed6aa5124fcd2b1291b48527af4cd
              - listitem [ref=f2e2462]:
                - text: 💼
                - strong [ref=f2e2463]: Attachments that go straight to a terminal.
                - text: A terminal connection can now be set to receive files attached in chat into its own working directory rather than into the conversation, which also means files can be attached while using a model that cannot read them itself.
                - link "Commit" [ref=f2e2464] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8a42aa53e826d5f25d6443ca95e0173e3cf034cf
                - text: ","
                - link "Commit" [ref=f2e2465] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d7d935275a77fb185586a5130cd37acf1175ca0a
                - text: ","
                - link "Commit" [ref=f2e2466] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1b3b9375bb4de0f360782dd2f9d8c7c2903b8baa
                - text: ","
                - link "Commit" [ref=f2e2467] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d17f06a23501e5c39cf98d9c9642178da25343fb
              - listitem [ref=f2e2471]:
                - text: 🔦
                - strong [ref=f2e2472]: Searching files in the terminal browser.
                - text: The file browser now has a search box that finds files by name and by what is inside them, and opening a result takes you to the matching line.
                - link "Commit" [ref=f2e2473] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7abe11346a1cc309da2c3fcec2f61faaeb47b96a
              - listitem [ref=f2e2477]:
                - text: 🌲
                - strong [ref=f2e2478]: Browsing files as a tree.
                - text: The terminal file browser now expands folders in place rather than only navigating into them, remembers what you had open, offers a right-click menu, can show hidden files, sorts by size, expands a folder you hover over while dragging something onto it, and moves a whole selection in one go when you drop it.
                - link "Commit" [ref=f2e2479] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7dfbdd221ac0f7a839dd049e3e82b6a84c316860
                - text: ","
                - link "Commit" [ref=f2e2480] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/516cf1a9a6154336182475b9df2d333b1579516d
              - listitem [ref=f2e2484]:
                - text: 🧰
                - strong [ref=f2e2485]: Managing models on more servers.
                - text: Administrators can now download, load, and unload models on llama.cpp and LM Studio connections from the manage models dialog, remove them on llama.cpp, and start a download straight from the model picker's search box, alongside the Ollama support that was already there.
                - link "Commit" [ref=f2e2486] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/85c3d0ae2fad58ffc2b92b1733a6c8bc7ab471db
                - text: ","
                - link "Commit" [ref=f2e2487] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8260d527ee97372a207ce9bd9c6dab4909061281
                - text: ","
                - link "Commit" [ref=f2e2488] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/25802c048e6123fa602182949ad2a9f349e1e863
                - text: ","
                - link "Commit" [ref=f2e2489] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/31c1ffd55a018a74c7e53a35fb9f9bbe33774b6f
                - text: ","
                - link "#28766" [ref=f2e2490] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28766
              - listitem [ref=f2e2494]:
                - text: 📢
                - strong [ref=f2e2495]: Automations that post to a channel.
                - text: An automation can now be pointed at a channel instead of a chat, so its scheduled run appears as a message there for everyone to see, chosen from a new destination picker that also covers folders.
                - link "Commit" [ref=f2e2496] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2649e3305c49cb37101c112ae10ffd8beacb5885
              - listitem [ref=f2e2500]:
                - text: 🙋
                - strong [ref=f2e2501]: Mentioning people in a channel.
                - text: Typing an at sign in a channel now lists that channel's own members first, before everyone else on the server, so the people you are likely to mean are at the top.
                - link "Commit" [ref=f2e2502] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ba885d0026ad3cce70c7cc36d1d6f59775264a12
                - text: ","
                - link "Commit" [ref=f2e2503] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/dcff244f9e87e615ee0a3f345f7f801c5ebe370d
                - text: ","
                - link "#28883" [ref=f2e2504] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28883
              - listitem [ref=f2e2508]:
                - text: 🔗
                - strong [ref=f2e2509]: Attaching any link.
                - text: Pasting a link into a chat or a knowledge base now works out what is behind it, downloading a document or image as a real attachment rather than treating everything as a web page to be read as text.
                - link "Commit" [ref=f2e2510] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8fbfd14a8b3fe7236883594fd18760076e4de0d5
              - listitem [ref=f2e2514]:
                - text: 🔎
                - strong [ref=f2e2515]: Searching tools and skills in chat.
                - text: The integrations menu now has a search box for tools and for skills, so a long list can be narrowed by name instead of scrolled through.
                - link "#26709" [ref=f2e2516] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26709
                - text: ","
                - link "Commit" [ref=f2e2517] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/954613944b317a78d5929456ae1388543aa052c8
                - text: ","
                - link "#28807" [ref=f2e2518] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28807
                - text: ","
                - link "#28812" [ref=f2e2519] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28812
              - listitem [ref=f2e2523]:
                - text: 🧭
                - strong [ref=f2e2524]: More from the message box.
                - text: The slash menu now offers settings and, in a new chat, a toggle for temporary chat, alongside the commands that were already there.
                - link "Commit" [ref=f2e2525] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a5ea732c1e3d0d1f70a7e4b6a20c30c336114784
              - listitem [ref=f2e2529]:
                - text: 🚨
                - strong [ref=f2e2530]: Being told when a file fails to process.
                - text: A file that cannot be processed for a knowledge base now raises a notification naming the file and what went wrong, and keeps that reason on the file, instead of quietly being marked as failed.
                - link "#27666" [ref=f2e2531] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27666
                - text: ","
                - link "#6311" [ref=f2e2532] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/6311
                - text: ","
                - link "Commit" [ref=f2e2533] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1a376ac17fa0c3f957656a997b6f8ffacb1f6f30
              - listitem [ref=f2e2537]:
                - text: 🔬
                - strong [ref=f2e2538]: Zoom controls on previewed images.
                - text: An image opened in the file browser now has zoom in, zoom out, and a reset button showing the current zoom, and pinching, scrolling, and holding a modifier key while scrolling now zoom and pan as they do elsewhere.
                - link "Commit" [ref=f2e2539] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2befa8f796266e92fa55861bb8eaa81639ff4053
                - text: ","
                - link "Commit" [ref=f2e2540] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bfb68feea766e8d5408fb6e278be56cbca0c4afe
                - text: ","
                - link "Commit" [ref=f2e2541] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ec9bf5a64f9f718e472123350ec83bce1b064884
                - text: ","
                - link "Commit" [ref=f2e2542] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/467be93e6d7e4a31358f9c75ee67bfac1200c0a1
              - listitem [ref=f2e2546]:
                - text: 🗂️
                - strong [ref=f2e2547]: Recognisable file icons.
                - text: The terminal file browser now marks each file with an icon for its type, so code, images, archives, documents, and configuration files can be told apart at a glance instead of sharing one generic page icon.
                - link "Commit" [ref=f2e2548] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/60feca71a6a77b7d1eef1c172a61624d5fe48150
