              - listitem [ref=f2e3260]:
                - text: ↕️
                - strong [ref=f2e3261]: Expand button in the message box.
                - text: The button that enlarges the message box no longer sits on top of a tagged model's dismiss button or the first attached file, and stays reachable in long prompts.
