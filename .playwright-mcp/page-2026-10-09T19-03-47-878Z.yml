                - text: ","
                - link "Commit" [ref=f2e5056] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f578d8d67ec2c109b0d8c38d90eaeb4448f83610
                - text: ","
                - link "Commit" [ref=f2e5057] [cursor=pointer]:
