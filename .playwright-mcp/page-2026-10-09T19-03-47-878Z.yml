              - listitem [ref=f2e3218]:
                - text: 🖼️
                - strong [ref=f2e3219]: Images that no longer exist.
                - text: A message whose image file has been deleted now shows a small unavailable placeholder that cannot be opened, rather than a broken image that spilled the whole reply text into the picture frame and still opened full screen.
                - link "#27730" [ref=f2e3220] [cursor=pointer]:
