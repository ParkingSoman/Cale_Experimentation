              - listitem [ref=f2e2027]:
                - text: 🧰
                - strong [ref=f2e2028]: Pinned models start with their own tools.
                - text: Starting a chat from a pinned model in the sidebar now applies that model's tools and skills instead of carrying over the ones from the model you used last.
                - link "#29058" [ref=f2e2029] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29058
                - text: ","
                - link "#29050" [ref=f2e2030] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29050
              - listitem [ref=f2e2034]:
                - text: ❓
                - strong [ref=f2e2035]: Rejected ask_user calls no longer kill the reply.
                - text: If a model asks the user a question in a way Open WebUI refuses, the model now receives that error and can continue or retry, instead of leaving the chat stopped with no answer.
                - link "#29252" [ref=f2e2036] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29252
                - text: ","
                - link "#29077" [ref=f2e2037] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29077
              - listitem [ref=f2e2041]:
                - text: 🚫
                - strong [ref=f2e2042]: Disabled models no longer vanish.
                - text: Turning a model off in the admin Models list now keeps it in view so you can turn it back on, instead of it disappearing with no way to recover it.
                - link "#29037" [ref=f2e2043] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29037
                - text: ","
                - link "#29036" [ref=f2e2044] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29036
              - listitem [ref=f2e2048]:
                - text: ✂️
                - strong [ref=f2e2049]: Message text kept intact.
                - text: Text containing angle brackets and a dollar sign is no longer mistaken for a skill mention and silently removed before your message reaches the model.
