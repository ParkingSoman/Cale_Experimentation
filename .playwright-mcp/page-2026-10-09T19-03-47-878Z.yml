              - listitem [ref=f2e3136]:
                - text: 🧠
                - strong [ref=f2e3137]: Faster follow-ups with memory enabled.
                - text: The memories handed to the model now appear in a stable order from one message to the next, so servers that reuse their work between turns no longer reprocess the whole conversation each time you reply.
