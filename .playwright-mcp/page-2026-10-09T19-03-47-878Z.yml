              - listitem [ref=f2e5572]:
                - text: 📐
                - strong [ref=f2e5573]: System prompt lost during tool calls.
                - text: A model's system prompt now stays in place through every round of tool calls, instead of being dropped after the first one and, with memories enabled, replaced by the memory block alone.
                - link "#26857" [ref=f2e5574] [cursor=pointer]:
