              - listitem [ref=f2e5587]:
                - text: 🎲
                - strong [ref=f2e5588]: Stable skill ordering.
                - text: Skills available to a model are now listed in the same order on every request, instead of shuffling between requests and quietly defeating prompt caching.
                - link "Commit" [ref=f2e5589] [cursor=pointer]:
