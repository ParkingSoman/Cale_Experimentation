              - listitem [ref=f2e5554]:
                - text: 🔟
                - strong [ref=f2e5555]: Context size after tool calls.
                - text: The context meter and long-conversation compaction now read the size of the latest request rather than adding up every call in a tool loop, and understand the counts reported by Ollama and llama.cpp as well as the OpenAI-style ones, so compaction no longer fires far below its threshold, or never at all, and the usage shown is no longer inflated.
                - link "Commit" [ref=f2e5556] [cursor=pointer]:
