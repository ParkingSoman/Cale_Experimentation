              - listitem [ref=f2e1973]:
                - text: 💥
                - strong [ref=f2e1974]: Replies stop breaking mid-chat.
                - text: A conversation no longer fails in the browser and stops showing the assistant reply until you reload, and chats already saved in that state display and can be edited again.
