              - listitem [ref=f2e3212]:
                - text: 🎚️
                - strong [ref=f2e3213]: ColBERT reranker startup.
                - text: Loading a ColBERT reranker now names the model in the log rather than printing a logging error and a traceback in its place.
                - link "#27838" [ref=f2e3214] [cursor=pointer]:
