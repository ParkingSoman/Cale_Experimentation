              - listitem [ref=f2e5242]:
                - text: 🔄
                - strong [ref=f2e5243]: General improvements.
                - text: Various improvements were implemented across the application to enhance performance, stability, and security.
              - listitem [ref=f2e5247]:
                - text: 🌐
                - strong [ref=f2e5248]: Translation updates.
                - text: Slovenian is now available, and translations for English (UK), Finnish, German, Japanese, Portuguese (Brazil) and Portuguese (Portugal) were enhanced and expanded.
          - generic [ref=f2e5249]:
            - generic [ref=f2e5250]: fixed
            - generic [ref=f2e5251]:
              - listitem [ref=f2e5255]:
                - text: 🛡️
                - strong [ref=f2e5256]: Security Advisory
                - text: ": This release includes security and access-control fixes. We recommend updating production deployments at your earliest convenience. Not all security fixes in this version may be enumerated in the fixed section. Some may be withheld for a short time to give administrators time to upgrade."
                - link "Advisories" [ref=f2e5257] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/security
              - listitem [ref=f2e5261]:
                - text: 🔒
                - strong [ref=f2e5262]: Terminal file preview isolation.
                - text: Previewing an HTML file in the system terminal now runs it in an isolated context by default, closing a cross-site scripting hole that could expose your login session or, for privileged accounts, run code on the server.
                - link "#26907" [ref=f2e5263] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26907
              - listitem [ref=f2e5267]:
                - text: ➗
                - strong [ref=f2e5268]: Malformed maths in a message.
                - text: Maths that fails to render is now shown as plain text rather than being placed into the page as markup, closing a way for a crafted formula in a chat, channel or shared conversation to run code in the browser of anyone reading it.
                - link "#26718" [ref=f2e5269] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26718
              - listitem [ref=f2e5273]:
                - text: 🔩
                - strong [ref=f2e5274]: Updated file upload parsing library.
                - text: The library that parses file uploads and form submissions has been updated to a release that addresses a security advisory affecting that parsing path.
                - link "#26991" [ref=f2e5275] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26991
              - listitem [ref=f2e5279]:
                - text: 🛑
                - strong [ref=f2e5280]: Deactivated accounts lose live access.
                - text: Real-time connections now apply the same role check as the rest of the application, so an account moved out of the user or admin role can no longer keep its channels and shared notes open on an existing token.
                - link "#27537" [ref=f2e5281] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27537
              - listitem [ref=f2e5285]:
                - text: 🛅
                - strong [ref=f2e5286]: Writing into someone else's chat.
                - text: Completion and action requests now confirm you own the chat they name before anything is written to it, so a filter or action can no longer be pointed at another person's conversation.
                - link "#27486" [ref=f2e5287] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27486
              - listitem [ref=f2e5291]:
                - text: 🎟️
                - strong [ref=f2e5292]: Ollama version no longer readable anonymously.
                - text: Reading the configured Ollama backend's version now requires signing in, closing a route that let anyone learn the version in use and count how many backends are configured.
                - link "#27199" [ref=f2e5293] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27199
              - listitem [ref=f2e5297]:
                - text: 🔐
                - strong [ref=f2e5298]: Folder sharing permission.
                - text: The folder sharing setting in default and group permissions now saves instead of being silently discarded, so allowing or restricting folder sharing actually takes effect.
                - link "#27296" [ref=f2e5299] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27296
                - text: ","
                - link "#27120" [ref=f2e5300] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27120
              - listitem [ref=f2e5304]:
                - text: 🔕
                - strong [ref=f2e5305]: Webhook permission enforcement.
                - text: People without permission to use webhooks can no longer save webhook notification destinations to their settings, so the permission is enforced when settings are saved rather than only reflected in the interface.
                - link "#27297" [ref=f2e5306] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27297
                - text: ","
                - link "Commit" [ref=f2e5307] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/af629177f46fa4595175f914c971c47701d1a676
              - listitem [ref=f2e5311]:
                - text: 🛎️
                - strong [ref=f2e5312]: Stopping someone else's generation.
                - text: Deleting a chat now checks who you are before anything is cancelled, so knowing another person's chat id no longer lets you cut off their reply or title generation on a request that is refused anyway.
                - link "#27006" [ref=f2e5313] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27006
              - listitem [ref=f2e5317]:
                - text: 🚥
                - strong [ref=f2e5318]: Automation limits in chat.
                - text: Automations that the assistant creates or reschedules on your behalf now respect the same maximum count and minimum interval as the ones you set up yourself, instead of being able to exceed both.
                - link "#27523" [ref=f2e5319] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27523
                - text: ","
                - link "#27121" [ref=f2e5320] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27121
              - listitem [ref=f2e5324]:
                - text: ⏲️
                - strong [ref=f2e5325]: Cancelling someone else's timers.
                - text: Marking a chat as read now only clears your own pending timers on it, instead of clearing everyone's, which had let another person's scheduled prompt be silently cancelled without them being told.
                - link "#27472" [ref=f2e5326] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27472
              - listitem [ref=f2e5330]:
                - text: 🗑️
                - strong [ref=f2e5331]: Deleting a shared folder's subfolders.
                - text: Deleting a folder is now limited to its owner or an administrator at every level, so someone with write access to a shared folder can no longer delete a subfolder and take the owner's chats with it.
                - link "#27003" [ref=f2e5332] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27003
              - listitem [ref=f2e5336]:
                - text: 📕
                - strong [ref=f2e5337]: Tool source shown to people who can only use it.
                - text: Opening a tool you were given read access to no longer returns its source code, which read access was never meant to include.
                - link "#27005" [ref=f2e5338] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27005
              - listitem [ref=f2e5342]:
                - text: 🎯
                - strong [ref=f2e5343]: Model settings in the list endpoint.
                - text: Listing models no longer includes each one's parameters and system prompt for people with read access only, matching what opening a single model already returned.
                - link "#27004" [ref=f2e5344] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27004
              - listitem [ref=f2e5348]:
                - text: 🖌️
                - strong [ref=f2e5349]: Image generation and web search without permission.
                - text: Turning on image generation or web search through the older request format now checks your permission first, so someone denied those features can no longer trigger them, and the billing that comes with them, by asking for that format.
                - link "#26703" [ref=f2e5350] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26703
              - listitem [ref=f2e5354]:
                - text: 🎗️
                - strong [ref=f2e5355]: Terminal single sign-on tokens.
                - text: The token forwarded to a terminal server for single sign-on is now taken from your own session on the server rather than from a header the browser supplied, so a caller can no longer send someone else's token in its place.
                - link "#26719" [ref=f2e5356] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26719
              - listitem [ref=f2e5360]:
                - text: 🫗
                - strong [ref=f2e5361]: Web search results scoped to you.
                - text: The temporary collections holding a web search's pages are now tied to the person who ran the search, closing the one place where that scoping was not applied.
                - link "#26706" [ref=f2e5362] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26706
              - listitem [ref=f2e5366]:
                - text: 🧺
                - strong [ref=f2e5367]: Knowledge base cleanup reaching other collections.
                - text: Tidying up a knowledge base now acts only on files and folders that belong to it, so someone with write access to one knowledge base can no longer delete folders or search data belonging to another.
                - link "#26722" [ref=f2e5368] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26722
              - listitem [ref=f2e5372]:
                - text: ⌛
                - strong [ref=f2e5373]: Searches that could stall the server.
                - text: A search pattern inside knowledge base commands now runs under a time budget, so a pattern that would take minutes to evaluate can no longer hold up everyone else on the instance.
                - link "#27471" [ref=f2e5374] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27471
              - listitem [ref=f2e5378]:
                - text: 🚫
                - strong [ref=f2e5379]: Disabled terminal servers are refused.
                - text: A terminal connection an administrator has turned off can no longer be reached by browsing its files, opening a session, or calling its tools, rather than only disappearing from the interface.
                - link "Commit" [ref=f2e5380] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7537989235675ac84a40bf70c91ec3e16fc0d8db
              - listitem [ref=f2e5384]:
                - text: 🧫
                - strong [ref=f2e5385]: Files attached to a shared folder.
                - text: Adding files to a folder is now refused unless the folder's owner can read them, and a folder's files are checked against what its owner can still read before they are used as knowledge in chat, so a collaborator can no longer place files into someone else's folder or keep serving files the owner has since lost access to.
                - link "#27464" [ref=f2e5386] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27464
                - text: ","
                - link "Commit" [ref=f2e5387] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/56183fcb17142088e2a34d1e35228f013749030c
              - listitem [ref=f2e5391]:
                - text: 🧷
                - strong [ref=f2e5392]: Knowledge claimed by a direct connection.
                - text: Files listed as knowledge on a model supplied by the browser for a direct connection are now filtered against your own access before anything is retrieved, so a crafted request can no longer pull in documents you cannot otherwise open.
                - link "Commit" [ref=f2e5393] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/305880f2e2aeb2dda2f4b2a18a20bdcd558f7134
                - text: ","
                - link "#26723" [ref=f2e5394] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26723
              - listitem [ref=f2e5398]:
                - text: 🪜
                - strong [ref=f2e5399]: Reaching a restricted model through a shared one.
                - text: A shared workspace model can no longer be used to reach an underlying model the person could not otherwise use, which previously slipped through when that model had no entry of its own.
                - link "#26905" [ref=f2e5400] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26905
                - text: ","
                - link "#26900" [ref=f2e5401] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26900
              - listitem [ref=f2e5405]:
                - text: 🖌️
                - strong [ref=f2e5406]: Shared image checkpoint changes.
                - text: Only administrators can now change the instance-wide Automatic1111 checkpoint, so an ordinary image generation request no longer switches the image model for everyone.
                - link "#27244" [ref=f2e5407] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27244
              - listitem [ref=f2e5411]:
                - text: 💬
                - strong [ref=f2e5412]: Channel message ownership.
                - text: Only the author of a channel message, or an administrator, can now edit or delete it, instead of anyone able to post in that channel.
                - link "#27197" [ref=f2e5413] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27197
              - listitem [ref=f2e5417]:
                - text: 🗄️
                - strong [ref=f2e5418]: Chats shared with an administrator.
                - text: An administrator can now open a chat that was deliberately shared with them even when broad admin access to other people's chats is turned off, instead of being refused a chat any other recipient could read.
                - link "#27127" [ref=f2e5419] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27127
              - listitem [ref=f2e5423]:
                - text: 📓
                - strong [ref=f2e5424]: Notes in folder knowledge are access checked.
                - text: Notes attached to a folder are now filtered against your own access before the list reaches the assistant, rather than relying on later checks further along.
                - link "#26739" [ref=f2e5425] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26739
              - listitem [ref=f2e5429]:
                - text: 🧱
                - strong [ref=f2e5430]: Code interpreter module blocking.
                - text: Modules an administrator has blocked for the code interpreter are now actually blocked, and other imports inside interpreter code work again.
                - link "#27245" [ref=f2e5431] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27245
              - listitem [ref=f2e5435]:
                - text: 📉
                - strong [ref=f2e5436]: Charts in the code interpreter.
                - text: Code that draws a chart now runs in the default code interpreter setup, instead of failing with a syntax error unless file persistence was turned on.
                - link "#26800" [ref=f2e5437] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26800
                - text: ","
                - link "#26660" [ref=f2e5438] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26660
              - listitem [ref=f2e5442]:
                - text: 🎬
                - strong [ref=f2e5443]: Chat action availability.
                - text: Chat actions can no longer be triggered when they are disabled, not assigned to the model in use, or on a model the caller cannot access, matching the actions the interface actually offers.
                - link "#27243" [ref=f2e5444] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27243
              - listitem [ref=f2e5448]:
                - text: 🗨️
                - strong [ref=f2e5449]: Response text where it was missing.
                - text: Assistant replies are no longer stored without their text, so copying, exporting, searching and reusing a conversation return the reply instead of nothing.
                - link "Commit" [ref=f2e5450] [cursor=pointer]:
