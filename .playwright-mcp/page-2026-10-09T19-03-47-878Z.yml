              - listitem [ref=f2e5594]:
                - text: 🛑
                - strong [ref=f2e5595]: Stopping an answer the moment it starts.
                - text: Each answer in a chat now carries its own task identifier from the first event onward, so stopping one immediately after sending no longer misses.
                - link "Commit" [ref=f2e5596] [cursor=pointer]:
