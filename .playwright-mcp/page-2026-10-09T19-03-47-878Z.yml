              - listitem [ref=f2e5546]:
                - text: 🧷
                - strong [ref=f2e5547]: Context compaction continuity.
                - text: After a compaction, the retained recent messages now stay in the prompt on every following turn instead of disappearing after the first, preserving conversational continuity and prompt caching.
