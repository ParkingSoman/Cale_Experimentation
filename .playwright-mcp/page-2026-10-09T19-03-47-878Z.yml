              - listitem [ref=f2e3232]:
                - text: 🪟
                - strong [ref=f2e3233]: Starting up on Windows.
                - text: The Windows start script now creates the secret key it needs on a fresh installation, instead of printing a run of file not found messages and then refusing to start, and it copes with an installation path that contains spaces.
                - link "#28061" [ref=f2e3234] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28061
                - text: ","
                - link "#28060" [ref=f2e3235] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28060
              - listitem [ref=f2e3239]:
                - text: 🕸️
                - strong [ref=f2e3240]: Overlapping branches in the overview.
                - text: Branch nodes in a chat's overview keep a clear gap between them when the interface is scaled up, rather than sitting on top of one another.
                - link "#27995" [ref=f2e3241] [cursor=pointer]:
