              - listitem [ref=f2e3144]:
                - text: 🎯
                - strong [ref=f2e3145]: Custom model parameters combining.
                - text: Setting a custom parameter on a model no longer silently discards every custom parameter defined in the global defaults, and a value sent directly in an API request is no longer overwritten by the model's saved settings.
                - link "Commit" [ref=f2e3146] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/11739a2de8eddf7ef26378356aff8a1bcab4a349
                - text: ","
                - link "#28241" [ref=f2e3147] [cursor=pointer]:
