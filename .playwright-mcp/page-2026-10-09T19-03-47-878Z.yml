              - listitem [ref=f2e1994]:
                - text: 💭
                - strong [ref=f2e1995]: Thinking stays in Thoughts.
                - text: After a model uses a tool, its reasoning for the next step now appears in the collapsed Thoughts section instead of being written into the reply as ordinary text.
                - link "#29052" [ref=f2e1996] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29052
                - text: ","
                - link "#29040" [ref=f2e1997] [cursor=pointer]:
