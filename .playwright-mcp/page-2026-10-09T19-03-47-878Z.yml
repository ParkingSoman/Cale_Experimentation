              - listitem [ref=f2e5530]:
                - text: 🪆
                - strong [ref=f2e5531]: Summaries on a direct connection.
                - text: Summarizing a long conversation on a direct connection can now use the configured summary model rather than being limited to the connection's own model.
                - link "#26806" [ref=f2e5532] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26806
              - listitem [ref=f2e5536]:
                - text: 🪟
                - strong [ref=f2e5537]: System prompt through compaction.
                - text: The system message now stays at the front of the conversation when a long chat is summarized, instead of being folded into the summary and lost from that point on.
                - link "Commit" [ref=f2e5538] [cursor=pointer]:
