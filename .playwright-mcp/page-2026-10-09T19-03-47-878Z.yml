              - listitem [ref=f2e1849]:
                - text: 💥
                - strong [ref=f2e1850]: Chat branches stay connected after reloads.
                - text: A reply saved under an earlier message now stays listed under that message, so branch arrows, exports, reloads, and later edits keep the whole conversation in view, and chats already saved with that link missing are repaired when opened.
