              - listitem [ref=f2e5463]:
                - text: 📃
                - strong [ref=f2e5464]: Action functions receive the response text.
                - text: Running an action on a response now passes the assistant's text to the function, instead of handing it an empty message.
                - link "#26798" [ref=f2e5465] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26798
                - text: ","
                - link "#26672" [ref=f2e5466] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26672
              - listitem [ref=f2e5470]:
                - text: 🍎
                - strong [ref=f2e5471]: Blank messages on Safari.
                - text: Assistant responses no longer render as empty in Safari and on iPhone and iPad, where a browser painting bug left on-screen messages unpainted.
                - link "#26805" [ref=f2e5472] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26805
                - text: ","
                - link "#26712" [ref=f2e5473] [cursor=pointer]:
