              - listitem [ref=f2e5485]:
                - text: 🪟
                - strong [ref=f2e5486]: Tool result prompt submission.
                - text: Interactive tool result embeds that send a prompt back to the chat work again, showing the confirmation dialog before submitting instead of silently doing nothing.
                - link "#26914" [ref=f2e5487] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26914
                - text: ","
                - link "#26912" [ref=f2e5488] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26912
              - listitem [ref=f2e5492]:
                - text: 📻
                - strong [ref=f2e5493]: Live updates in a second tab.
                - text: Opening Open WebUI again while already connected now joins the new tab to your event stream, so notifications and chat updates reach every open tab instead of only the first one.
                - link "Commit" [ref=f2e5494] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d14fddf25405cd58184fdef3d2af012503e4edd8
              - listitem [ref=f2e5498]:
                - text: 🔁
                - strong [ref=f2e5499]: Connection recovery on new chats.
                - text: Chats started from the home page now recover automatically after a dropped connection, such as from mobile backgrounding, a VPN or IP change, or waking from sleep, instead of getting stuck loading until a manual refresh.
                - link "#26913" [ref=f2e5500] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26913
                - text: ","
