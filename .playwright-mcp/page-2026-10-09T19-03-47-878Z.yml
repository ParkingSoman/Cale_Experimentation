              - listitem [ref=f2e1890]:
                - text: ⚡
                - strong [ref=f2e1891]: Less overhead on every message.
                - text: Deployments without pipelines configured, which is the default, no longer pay setup work for them on each chat message and background task.
                - link "#29146" [ref=f2e1892] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29146
              - listitem [ref=f2e1896]:
                - text: 🏎️
                - strong [ref=f2e1897]: Lighter model list refreshes.
                - text: On deployments running several workers, a refresh that finds the model list unchanged no longer has every worker rewrite the whole list to the shared cache, cutting the work and the traffic each refresh costs.
                - link "#29264" [ref=f2e1898] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29264
              - listitem [ref=f2e1902]:
                - text: 🧵
                - strong [ref=f2e1903]: Smoother busy websocket servers.
                - text: Large Redis-backed websocket deployments now spend far less time sweeping old sessions, reading their own session data back from Redis, and checking every outgoing websocket message for file attachments Open WebUI does not send, so channel posts, collaboration updates, heartbeats, and live chat updates put less load on busy servers.
                - link "#28835" [ref=f2e1904] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/28835
                - text: ","
                - link "#28180" [ref=f2e1905] [cursor=pointer]:
