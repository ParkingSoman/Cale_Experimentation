              - listitem [ref=f2e1909]:
                - text: 🧰
                - strong [ref=f2e1910]: A new request filter step.
                - text: Filter authors can now use
                - code [ref=f2e1911]: request
                - text: to adjust the payload right before each model call, including follow-up calls after tool use, while existing
                - code [ref=f2e1912]: inlet
                - text: ","
                - code [ref=f2e1913]: stream
                - text: ", and"
                - code [ref=f2e1914]: outlet
                - text: filters keep working as before.
