              - listitem [ref=f2e3151]:
                - text: 👥
                - strong [ref=f2e3152]: Sharing with people already added.
                - text: The access picker no longer offers people and groups that already have access, and the Users heading no longer appears above an empty list.
                - link "Commit" [ref=f2e3153] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/385d08bea5899bcb160391db466662b0a0a6f801
                - text: ","
                - link "#28253" [ref=f2e3154] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28253
              - listitem [ref=f2e3158]:
                - text: 🔧
                - strong [ref=f2e3159]: Full tool parameter descriptions.
                - text: A tool whose parameter description runs over several lines now passes the whole description to the model instead of only its first line.
                - link "Commit" [ref=f2e3160] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b606e13da3753027ead0e92e35e1399b60c96c8e
              - listitem [ref=f2e3164]:
                - text: 📝
                - strong [ref=f2e3165]: Notes saved in an unexpected shape.
                - text: A note whose content was stored as structured data rather than text no longer breaks the notes page for everything else, and opens with that content shown as a formatted code block.
                - link "Commit" [ref=f2e3166] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8d1c205d8e7335ef7c292afb125a7270976f327b
                - text: ","
                - link "#28222" [ref=f2e3167] [cursor=pointer]:
