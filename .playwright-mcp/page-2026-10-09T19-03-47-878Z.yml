                  - /url: https://github.com/open-webui/open-webui/issues/26656
              - listitem [ref=f2e4432]:
                - text: 📣
                - strong [ref=f2e4433]: Notifications from the assistant.
                - text: The assistant can now send you a notification itself when something is worth your attention, so a long task can reach you after you have moved on to something else.
                - link "Commit" [ref=f2e4434] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c55e373b994d3a14c99a97f44261422012f63266
                - text: ","
                - link "Commit" [ref=f2e4435] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/200d447f6289faca42f2a666bbabae2c7f3ebadf
              - listitem [ref=f2e4439]:
                - text: 🌎
                - strong [ref=f2e4440]: Share a chat with anyone holding the link.
                - text: A shared chat can now be set to Open so it opens without signing in, with visitors no longer bounced to the sign-in page on their way to it, which administrators must first allow through a new "Chats Open Sharing" permission that stays off by default, and such pages ask search engines not to index them.
                - link "Commit" [ref=f2e4441] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1f0dc90abe879a55f654f2333e29fb0f630831c7
                - text: ","
                - link "Commit" [ref=f2e4442] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0e0d08382ac0d05b1ad98c47e8a2e37df2a185bb
              - listitem [ref=f2e4446]:
                - text: 🔖
                - strong [ref=f2e4447]: Chat variables.
                - text: A model's system prompt can now declare fields such as text boxes and dropdown lists that you fill in for a conversation, with the values saved alongside the chat and carried over when it is forked or cloned.
                - link "Commit" [ref=f2e4448] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bef8ae4b2f05ca49ed88a02ab7a3cdc11b62c4f1
                - text: ","
                - link "Commit" [ref=f2e4449] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4e869011cd5040b5d6a197fc83d5f50d2425dbc2
                - text: ","
                - link "Commit" [ref=f2e4450] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1e88367cc837b39c0e9958fefbe053803336dce2
                - text: ","
                - link "Commit" [ref=f2e4451] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8cbb7f765cfc9c9b3237a6c5593cd93f849033f0
                - text: ","
                - link "Commit" [ref=f2e4452] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b35e2d265a4e4a2f2a075b31917d48be1dd9ef19
                - text: ","
                - link "Commit" [ref=f2e4453] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/239cb740077a14e452ad002a1e671a09ab558e40
                - text: ","
                - link "#26915" [ref=f2e4454] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/26915
              - listitem [ref=f2e4458]:
                - text: 🗄️
                - strong [ref=f2e4459]: LDAP group synchronization.
                - text: Administrators can now map LDAP groups to Open WebUI groups from the authentication settings, with optional automatic creation of missing groups, so a user's group memberships are kept in step with the directory each time they sign in.
                - link "#27263" [ref=f2e4460] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27263
                - text: ","
                - link "#18015" [ref=f2e4461] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/18015
              - listitem [ref=f2e4465]:
                - text: 👥
                - strong [ref=f2e4466]: Restrict sharing with groups.
                - text: Admins can now stop resources from being shared with entire groups through a new "USER_PERMISSIONS_ACCESS_GRANTS_ALLOW_GROUPS" permission, which stays enabled by default so existing group sharing keeps working untouched.
                - link "Commit" [ref=f2e4467] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4ed19d504bd30c0fc801e9228d9816669ec1c09c
                - text: ","
                - link "Commit" [ref=f2e4468] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f84dabe3d97ff701c097055023f28f3f2f7ebd07
                - text: ","
                - link "Commit" [ref=f2e4469] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/77da3d8c81b9a6fda4354619de94f5d433328d8e
                - text: ","
                - link "Commit" [ref=f2e4470] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/84e4d6ef8277f4b4f3ac4d355b3219e9b5a37268
                - text: ","
                - link "#27124" [ref=f2e4471] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27124
              - listitem [ref=f2e4475]:
                - text: 🤝
                - strong [ref=f2e4476]: Shared folder collaboration.
                - text: People with access to a shared folder can now use its files and system prompt as knowledge in chat and, with write access, rename and manage the folder, all according to their read or write permission.
                - link "Commit" [ref=f2e4477] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/797293c74957bd79e42262d1dc0fd637a45d0357
                - text: ","
                - link "Commit" [ref=f2e4478] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/caa2457c17e592587b804f21054cc000944af75c
                - text: ","
                - link "Commit" [ref=f2e4479] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/009715cd63d1c8b5320aba68e9a70afcde519016
                - text: ","
                - link "Commit" [ref=f2e4480] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/53ccd718a53de25bb6d61476a6617bfb3f130a44
              - listitem [ref=f2e4484]:
                - text: 👁️
                - strong [ref=f2e4485]: Chat previews in the sidebar.
                - text: Hovering a chat in the sidebar now shows a compact preview of its recent messages, so you can find the conversation you want without opening it.
                - link "Commit" [ref=f2e4486] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d0f7da4f45b8831b09b2ab3ec8f91aa354d90ba3
                - text: ","
                - link "Commit" [ref=f2e4487] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/aaf2834db758bfec69408ab4cabcf324965c221c
                - text: ","
                - link "Commit" [ref=f2e4488] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1513ddaf58fe18029086880461d7cad0649a699c
                - text: ","
                - link "Commit" [ref=f2e4489] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/93bd05271c07c249978d69abf3297fd2841900f9
              - listitem [ref=f2e4493]:
                - text: 🕗
                - strong [ref=f2e4494]: Local message timestamps.
                - text: Message timestamps now appear on hover in your device's local date and time format, with the full weekday and date shown in a tooltip.
                - link "Commit" [ref=f2e4495] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/797293c74957bd79e42262d1dc0fd637a45d0357
                - text: ","
                - link "Commit" [ref=f2e4496] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f84dabe3d97ff701c097055023f28f3f2f7ebd07
              - listitem [ref=f2e4500]:
                - text: 📇
                - strong [ref=f2e4501]: User variables.
                - text: You can now store your own values in account settings, such as your role or how you like answers written, and a model's system prompt can insert them wherever they are needed.
                - link "Commit" [ref=f2e4502] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bd5d7b2e879511882429075d804d9222956f4a1a
                - text: ","
                - link "Commit" [ref=f2e4503] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/212eec408ca320edfa2271e604d10e14b6a9bc1a
                - text: ","
                - link "Commit" [ref=f2e4504] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/793a43d9c48225925929eb312fe2b70d5914d1da
              - listitem [ref=f2e4508]:
                - text: 🧺
                - strong [ref=f2e4509]: Automations that file their chats away.
                - text: An automation can now be pointed at one of your folders, from the dialog, the editor or by asking the assistant, so each run lands there instead of loose in your chat list, and the folder is cleared automatically if it is later deleted.
                - link "Commit" [ref=f2e4510] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f798d05586a140f1a6b51f1e51b2b2a63d079d45
                - text: ","
                - link "Commit" [ref=f2e4511] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bab71ed08b5af6f4a8ff2daa02792baae9edab03
                - text: ","
                - link "Commit" [ref=f2e4512] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/db5c092299471444c356216d5ef39b382ba1aa1e
              - listitem [ref=f2e4516]:
                - text: 🔵
                - strong [ref=f2e4517]: See what you have not read yet.
                - text: Folders in the sidebar now carry a count of chats with something new in them, a folder's own page marks unread chats with a dot, shows a spinner on any still generating, clears the dot as you open one, and keeps itself up to date as replies finish elsewhere, unread chats sort to the top of a folder, and you can mark a single chat unread again mark everything in a folder read, or mark every chat read at once from the sidebar.
                - link "Commit" [ref=f2e4518] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f798d05586a140f1a6b51f1e51b2b2a63d079d45
                - text: ","
                - link "Commit" [ref=f2e4519] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f867825bf3b7699bc2bd967ef46b2bb63e48b098
                - text: ","
                - link "Commit" [ref=f2e4520] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1de36d600f7191c28a98bf4b347b44cf8f1bef43
                - text: ","
                - link "Commit" [ref=f2e4521] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/85c47fb467177ed811ba77dfe62461dfbe8e2548
                - text: ","
                - link "Commit" [ref=f2e4522] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b7489bbc6c4e376c017edffd8da3c2eb4e6c1c8e
                - text: ","
                - link "Commit" [ref=f2e4523] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3cd72ee6a8e93dc39a4d4c173117056e25326c8a
                - text: ","
                - link "Commit" [ref=f2e4524] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6f93ecd4fd77b0d51a5fbbd2fc3fd6d151036a55
                - text: ","
                - link "Commit" [ref=f2e4525] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e5a08d52208e8b1ed07ff94906e27d174146b1ca
                - text: ","
                - link "Commit" [ref=f2e4526] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8ddf119570b3c0b04b673d41cb2363370c23939b
              - listitem [ref=f2e4530]:
                - text: 🗜️
                - strong [ref=f2e4531]: Compact a chat on demand.
                - text: Typing a compact command in a long conversation now summarizes the earlier turns straight away, instead of waiting for it to happen automatically once the conversation grows past the threshold.
                - link "Commit" [ref=f2e4532] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7a9928ef172b7c280c377c86cb52957e39340158
                - text: ","
                - link "Commit" [ref=f2e4533] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/75894161e46aafe30a7db4ecc946af60f04495e4
              - listitem [ref=f2e4537]:
                - text: 🌿
                - strong [ref=f2e4538]: Fork a chat.
                - text: Every response now has a fork button that copies the conversation up to that point into a new chat which remembers where it branched, so you can carry on down a different path without touching the original.
                - link "Commit" [ref=f2e4539] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/63ada247066dfc51e0e9559366f0cfd9a98db40b
                - text: ","
                - link "Commit" [ref=f2e4540] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cf887b68ea58bcd1d8b035842c4ea35a5113ed8b
                - text: ","
                - link "Commit" [ref=f2e4541] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/73421c5b42ac5c2ebc5faa520b7ed3fa0e39f10d
                - text: ","
                - link "Commit" [ref=f2e4542] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e769f9ff4f9fa7b0faebdd4f34ff98fe0dcc300d
              - listitem [ref=f2e4546]:
                - text: 📌
                - strong [ref=f2e4547]: Pin the conversation map.
                - text: The chat overview now has a pin control that stops it recentring on the newest message, so you can keep looking at the branch you were reading while a reply comes in.
                - link "#25736" [ref=f2e4548] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/25736
              - listitem [ref=f2e4552]:
                - text: 📊
                - strong [ref=f2e4553]: Chat status at a glance.
                - text: The slash menu now shows how full the context window is, and a new status command opens a panel with context usage, queued messages, running tasks, and the chat ID.
                - link "Commit" [ref=f2e4554] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/7a9928ef172b7c280c377c86cb52957e39340158
                - text: ","
                - link "Commit" [ref=f2e4555] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/263bbc77d803e83b9af4b04c0cae29705af5f072
              - listitem [ref=f2e4559]:
                - text: 🎹
                - strong [ref=f2e4560]: Customizable keyboard shortcuts.
                - text: Most keyboard shortcuts can now be rebound to key combinations of your choosing in settings, which saves them to your account, warns you when two actions share a combination, and offers a reset to the defaults, with moving to the previous or next chat and opening the controls panel available to bind as well.
                - link "Commit" [ref=f2e4561] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/343eb1d659262cc9d762a2ce49bef25434a03bfa
                - text: ","
                - link "Commit" [ref=f2e4562] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/de681aa543b356d456b83c13ad88c7f9941319e7
                - text: ","
                - link "#26624" [ref=f2e4563] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26624
              - listitem [ref=f2e4567]:
                - text: ⌨️
                - strong [ref=f2e4568]: Turn keyboard shortcuts off.
                - text: A new switch in the keyboard settings disables every configurable shortcut and hides its hint, so combinations that clash with your browser or operating system pass straight through.
                - link "#27300" [ref=f2e4569] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27300
                - text: ","
                - link "#1008" [ref=f2e4570] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/1008
              - listitem [ref=f2e4574]:
                - text: ⌨️
                - strong [ref=f2e4575]: Skills in slash commands.
                - text: Typing a slash in the message input now lists your skills alongside your prompts, grouped under headings and with descriptions on hover, so you can attach a skill without leaving the keyboard.
                - link "Commit" [ref=f2e4576] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9588c97e64e10d161a9a0ab1ab9ba3fee6cbb94d
              - listitem [ref=f2e4580]:
                - text: 📎
                - strong [ref=f2e4581]: Attach anything with the at menu.
                - text: Typing an at sign in the message input now searches your folders, knowledge collections, and individual files as well as your models, and pasting a link offers it as a web page or YouTube attachment.
                - link "Commit" [ref=f2e4582] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e8b4c7f9e212253267b8c79dc5360894f0d91bec
              - listitem [ref=f2e4586]:
                - text: 📝
                - strong [ref=f2e4587]: Chat with a note.
                - text: Chatting with a note now gives you the full chat experience, including model choice, tools and file attachments, alongside suggested prompts, a button to insert a response straight into the note, edits that appear in the note as the assistant makes them, and as many separate conversations per note as you want to keep.
                - link "Commit" [ref=f2e4588] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/423cafd4e75e34b487f3b5d10ec1c506f073b3da
                - text: ","
                - link "Commit" [ref=f2e4589] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/185bca8552ee3f87ea95fdcad32a433924881b9a
              - listitem [ref=f2e4593]:
                - text: ↕️
                - strong [ref=f2e4594]: Sort your lists.
                - text: The notes, prompts, models, knowledge, skills, tools and functions lists can now be sorted by title or by when they were last updated, in either direction, by clicking the column headings.
                - link "Commit" [ref=f2e4595] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/30c91e46e5d237bee3c8805bd54749408cc2727a
                - text: ","
                - link "Commit" [ref=f2e4596] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/56f2cb530259df5393ea1ae844bad5cc6b2c810c
                - text: ","
                - link "#27457" [ref=f2e4597] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27457
                - text: ","
                - link "#27456" [ref=f2e4598] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/27456
              - listitem [ref=f2e4602]:
                - text: 🗒️
                - strong [ref=f2e4603]: Notes without stored contents.
                - text: A note whose contents were never filled in now opens and saves normally instead of failing.
                - link "Commit" [ref=f2e4604] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6c59ef313fdaac7fa8e9089be758c4651f8b9412
              - listitem [ref=f2e4608]:
                - text: 📄
                - strong [ref=f2e4609]: Note attachments.
                - text: Notes now have an upload option in their menu and show attached files above the note itself, where you can open or remove them, instead of only accepting files dropped onto the page.
                - link "Commit" [ref=f2e4610] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c4c4ab57e33bb4359b51a4c255f4569fa38a5058
                - text: ","
                - link "Commit" [ref=f2e4611] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0dc93b8ae798ad834e7f3327571452bfdf4c218f
              - listitem [ref=f2e4615]:
                - text: 🗂️
                - strong [ref=f2e4616]: The assistant can search your attachments.
                - text: A new Files capability lets the model list the files attached to the chat and search them by meaning or by exact text, and read the parts it needs, rather than having their whole contents pushed into the conversation up front, and knowledge collections or notes attached to a chat are now announced to the model so it can query those the same way.
                - link "Commit" [ref=f2e4617] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/57e60423b9963c4a69fdfda7ae5799efc5583010
                - text: ","
                - link "Commit" [ref=f2e4618] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/55e0801dab8fe5f8bceff7d7c49772676724b8b1
                - text: ","
                - link "#26711" [ref=f2e4619] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26711
                - text: ","
                - link "#27232" [ref=f2e4620] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27232
                - text: ","
                - link "#26708" [ref=f2e4621] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26708
              - listitem [ref=f2e4625]:
                - text: 🔎
                - strong [ref=f2e4626]: Search in the attachment menu.
                - text: The attachment menu now lets you search your knowledge bases, notes, files, and chats instead of scrolling to find them, with matching text shown for chats.
                - link "Commit" [ref=f2e4627] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/668f9fe3905fea5fdfccb2b9b308c8f4d7d2f061
              - listitem [ref=f2e4631]:
                - text: ⚗️
                - strong [ref=f2e4632]: Default file upload mode.
                - text: You can now choose in settings how attached files are handled by default, rather than picking that on each upload.
                - link "#20900" [ref=f2e4633] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/20900
                - text: ","
                - link "#18431" [ref=f2e4634] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/18431
              - listitem [ref=f2e4638]:
                - text: ⬇️
                - strong [ref=f2e4639]: Response auto-scroll toggle.
                - text: A new interface setting lets you stop the view following a reply as it is written, so you can read earlier text while generation continues.
                - link "Commit" [ref=f2e4640] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cea991260f279f004489dab5d930bc25b0abf612
                - text: ","
                - link "#26826" [ref=f2e4641] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26826
              - listitem [ref=f2e4645]:
                - text: 📜
                - strong [ref=f2e4646]: Client certificates for SearXNG.
                - text: Web search can now present a client certificate to a SearXNG instance that requires one, through new "SEARXNG_CLIENT_CERT_FILE" and "SEARXNG_CLIENT_KEY_FILE" settings.
                - link "Commit" [ref=f2e4647] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/def26ce266c2e1d80e31b3ad12099db61a674832
                - text: ","
                - link "#26992" [ref=f2e4648] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26992
              - listitem [ref=f2e4652]:
                - text: 🔭
                - strong [ref=f2e4653]: OpenSERP web search.
                - text: Web search can now run against a self-hosted OpenSERP instance, which returns results from several major search engines without any API key, configured through a new "OPENSERP_BASE_URL" setting.
                - link "#27437" [ref=f2e4654] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27437
                - text: ","
                - link "#27438" [ref=f2e4655] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27438
              - listitem [ref=f2e4659]:
                - text: 🥇
                - strong [ref=f2e4660]: Model order as a setting.
                - text: Administrators can now set the order models appear in through a new "MODEL_ORDER_LIST" variable, so the arrangement survives a restart on instances that do not persist configuration.
                - link "#27420" [ref=f2e4661] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27420
                - text: ","
                - link "#27206" [ref=f2e4662] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27206
              - listitem [ref=f2e4666]:
                - text: ⏱️
                - strong [ref=f2e4667]: Idle cap for streamed replies.
                - text: Administrators can now set an "AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT" that ends a streamed reply when the provider stops sending anything for that long, instead of holding the connection open until the overall timeout expires.
                - link "Commit" [ref=f2e4668] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/4a7d4ebadac27d652ec200fa3939f10e9a5c17ed
                - text: ","
                - link "Commit" [ref=f2e4669] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c727643e05f3597395ee1a60b17117d04f693a18
              - listitem [ref=f2e4673]:
                - text: 🖼️
                - strong [ref=f2e4674]: Media types an extraction engine may handle.
                - text: Administrators can now list which image and video types the configured content extraction engine is allowed to process, instead of media being passed to it only when the engine is the external one, so an engine with its own text recognition can take images.
                - link "Commit" [ref=f2e4675] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/db2d24896b0682191a54f41c6b9f0b9d2971637f
                - text: ","
                - link "#26940" [ref=f2e4676] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26940
                - text: ","
                - link "#14768" [ref=f2e4677] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/14768
              - listitem [ref=f2e4681]:
                - text: 🧵
                - strong [ref=f2e4682]: Where a channel reply lands.
                - text: Administrators can now choose whether a reply to a mention posts in a thread under that message or straight into the channel.
                - link "Commit" [ref=f2e4683] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/db2d24896b0682191a54f41c6b9f0b9d2971637f
                - text: ","
                - link "#27410" [ref=f2e4684] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27410
              - listitem [ref=f2e4688]:
                - text: 📚
                - strong [ref=f2e4689]: Limits for knowledge tools.
                - text: Administrators can now set how much a knowledge search or file view may return, how many files one search may scan, and how many matches are reported, and a knowledge command's whole output is now capped so a single call cannot flood the conversation.
                - link "Commit" [ref=f2e4690] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/11e61b69ebd922602edc37ded7b42fdd43bb8456
                - text: ","
                - link "#27524" [ref=f2e4691] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27524
                - text: ","
                - link "#27327" [ref=f2e4692] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27327
                - text: ","
                - link "#26139" [ref=f2e4693] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26139
              - listitem [ref=f2e4697]:
                - text: 🎛️
                - strong [ref=f2e4698]: File streaming chunk size.
                - text: Administrators can now tune how large each chunk of a streamed file transfer is through a new "AIOHTTP_FILE_STREAM_CHUNK_SIZE" setting.
                - link "Commit" [ref=f2e4699] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/429f2df50cd2f0ec8d0a1bb4136a46e2f94a4bf5
              - listitem [ref=f2e4703]:
                - text: 🪛
                - strong [ref=f2e4704]: Model for summarizing long chats.
                - text: Administrators can now pick a dedicated model to write context compaction summaries, separate from the task model, with the conversation's own model used when none is chosen.
                - link "#26806" [ref=f2e4705] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26806
                - text: ","
                - link "#27051" [ref=f2e4706] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27051
              - listitem [ref=f2e4710]:
                - text: 📏
                - strong [ref=f2e4711]: Context compaction token cap.
                - text: Administrators can now set a "Token Cap" that limits how high per-model context compaction thresholds are allowed to reach, giving finer control over long-conversation summarization.
                - link "Commit" [ref=f2e4712] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5c389ad93f0668d4bab717d14bd189b679338ef2
                - text: ","
                - link "Commit" [ref=f2e4713] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/31996a5acfe1458720fa19f1b9fb4da95749b5e6
                - text: ","
                - link "Commit" [ref=f2e4714] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/44c2a27ce0695d8e9c7e72f9a84dc325cb15096a
              - listitem [ref=f2e4718]:
                - text: ⚖️
                - strong [ref=f2e4719]: Retained messages after compaction.
                - text: Administrators can now set what share of recent messages survives when a long conversation is summarized, between a tenth and half of it.
                - link "Commit" [ref=f2e4720] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/33cf3fbb7f017ab1b79dce5c5ca4d4e1c3092844
                - text: ","
                - link "#27050" [ref=f2e4721] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27050
              - listitem [ref=f2e4725]:
                - text: 🧠
                - strong [ref=f2e4726]: Memory as a per-model capability.
                - text: Whether a model receives your stored memories is now a switch on the model itself, so it can be left on for everyday assistants and off for ones that should start from nothing.
                - link "Commit" [ref=f2e4727] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6732852ce6c1a2a445bc001b122c60cf12e0278b
                - text: ","
                - link "#26861" [ref=f2e4728] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26861
                - text: ","
                - link "#18610" [ref=f2e4729] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/18610
              - listitem [ref=f2e4733]:
                - text: ☑️
                - strong [ref=f2e4734]: Searchable model pickers.
                - text: When editing a model, the Tools, Skills, Knowledge, Voice, Filters and Actions pickers now let you search and toggle items in place, select or clear them all at once, and see what is active at a glance.
                - link "Commit" [ref=f2e4735] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e355959e9156fd61a1105953d731d007fbb4bae3
                - text: ","
                - link "Commit" [ref=f2e4736] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/e1f96aa20ef80c8b01e3a81039d2cca3001d0ef5
                - text: ","
                - link "Commit" [ref=f2e4737] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fa889837e9e90c7284def56fac2daed20a3ce699
                - text: ","
                - link "Commit" [ref=f2e4738] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/5424ac58917d2a21f21256b62d1c42f1a8c51c51
                - text: ","
                - link "Commit" [ref=f2e4739] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ea2e3d0afc76fa99f2af665fd50425dd28d000d5
                - text: ","
                - link "Commit" [ref=f2e4740] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cda5bdb9d42886dfe74d05907179e3f96097030c
                - text: ","
                - link "#26758" [ref=f2e4741] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26758
              - listitem [ref=f2e4745]:
                - text: 🎚️
                - strong [ref=f2e4746]: Switch for single sign-on.
                - text: OAuth and OIDC now have their own on and off switch in the authentication settings, matching the LDAP one above it, so sign-in through a provider can be turned off without clearing the configuration.
                - link "#26988" [ref=f2e4747] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26988
              - listitem [ref=f2e4751]:
                - text: 🖲️
                - strong [ref=f2e4752]: One sign-in attempt at a time.
                - text: The sign-in, sign-up and LDAP form now disables its buttons while a request is in flight, so a slow response no longer turns repeated clicks or Enter presses into several concurrent attempts.
                - link "#27416" [ref=f2e4753] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27416
                - text: ","
                - link "#27264" [ref=f2e4754] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27264
              - listitem [ref=f2e4758]:
                - text: 🛂
                - strong [ref=f2e4759]: Trusted clients for token exchange.
                - text: Administrators can now list which OAuth clients may have their tokens exchanged for a session, through a new "OAUTH_TOKEN_EXCHANGE_TRUSTED_CLIENT_IDS" setting, so a token a person obtained by signing in to an unrelated application of the same provider can no longer be turned into a session as that person.
                - link "#27546" [ref=f2e4760] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27546
                - text: ","
                - link "Commit" [ref=f2e4761] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b190dcf3caa00dc8b7b9c7312828298d9143f60d
                - text: ","
                - link "Commit" [ref=f2e4762] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c4332be71e6e9c314e8a13b9d2819a6932561630
              - listitem [ref=f2e4766]:
                - text: 🚪
                - strong [ref=f2e4767]: Throttle for token exchange.
                - text: Administrators can now cap how often the OAuth token exchange endpoint may be called from one address through new "OAUTH_TOKEN_EXCHANGE_RATE_LIMIT" and "OAUTH_TOKEN_EXCHANGE_RATE_LIMIT_WINDOW" settings, which bound automated attempts with leaked or guessed tokens and stay off until set.
                - link "Commit" [ref=f2e4768] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/453b9fb0291c0de8957a2713988c7c53dbcc5465
              - listitem [ref=f2e4772]:
                - text: 🔏
                - strong [ref=f2e4773]: PKCE for every sign-in provider.
                - text: The code challenge setting now applies to Google, Microsoft and GitHub sign-in as well as OpenID Connect, so the same protection covers every provider.
                - link "Commit" [ref=f2e4774] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/40320c113637f80e0466e30cae63ab9ac1ba596e
                - text: ","
                - link "#27302" [ref=f2e4775] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27302
              - listitem [ref=f2e4779]:
                - text: 🔤
                - strong [ref=f2e4780]: Embeddings through the OpenAI-compatible API.
                - text: Integrations built on OpenAI client libraries can now create embeddings through the Ollama proxy, so embedding requests go through the same sign-in and model access rules as chat instead of needing direct access to Ollama.
                - link "#27332" [ref=f2e4781] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27332
                - text: ","
                - link "Commit" [ref=f2e4782] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/9f00b62b3a005b030ffaf638fd1da4c27e3c0586
                - text: ","
                - link "#27328" [ref=f2e4783] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/27328
                - text: ","
                - link "Docs:#1331" [ref=f2e4784] [cursor=pointer]:
                  - /url: https://github.com/open-webui/docs/pull/1331
              - listitem [ref=f2e4788]:
                - text: 🎚️
                - strong [ref=f2e4789]: Passthrough parameters per connection.
                - text: Administrators can now list request parameters that a connection should receive untranslated, under a new Advanced section in connection settings, so provider-specific options reach the upstream API intact.
                - link "Commit" [ref=f2e4790] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bb12b1a18b77d80829cedb2d5bf965808222415b
              - listitem [ref=f2e4794]:
                - text: 🅰️
                - strong [ref=f2e4795]: Anthropic requests passed straight through.
                - text: Requests to the Anthropic-compatible API aimed at an Anthropic or LiteLLM connection now reach the provider untouched rather than being translated on the way, and LiteLLM is selectable as a connection type.
                - link "Commit" [ref=f2e4796] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b81627b2c95aad184a6abf59145ca3b18a32bb2c
              - listitem [ref=f2e4800]:
                - text: 💭
                - strong [ref=f2e4801]: Reasoning in Anthropic responses.
                - text: Responses from the Anthropic-compatible API now carry the model's reasoning as thinking blocks, in both streamed and complete responses.
                - link "Commit" [ref=f2e4802] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bb12b1a18b77d80829cedb2d5bf965808222415b
              - listitem [ref=f2e4806]:
                - text: 🧩
                - strong [ref=f2e4807]: Structured output through the Anthropic-compatible API.
                - text: Requests can now ask for a JSON schema or JSON object response and set a reasoning effort, which are carried through to the upstream model.
                - link "Commit" [ref=f2e4808] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bb12b1a18b77d80829cedb2d5bf965808222415b
              - listitem [ref=f2e4812]:
                - text: 🪧
                - strong [ref=f2e4813]: Group names in forwarded headers.
                - text: Custom headers on a connection can now carry the groups a person belongs to, by name or by id, so an upstream service or gateway can apply its own rules per group.
                - link "#27236" [ref=f2e4814] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27236
                - text: ","
                - link "#26834" [ref=f2e4815] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26834
              - listitem [ref=f2e4819]:
                - text: 🪪
                - strong [ref=f2e4820]: User identity forwarded to Mistral OCR.
                - text: Document extraction through Mistral OCR now carries the requesting user's identity when user info forwarding is enabled, so a gateway in front of it can attribute requests per user like other outbound integrations already do.
                - link "#27253" [ref=f2e4821] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27253
                - text: ","
                - link "#27250" [ref=f2e4822] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27250
              - listitem [ref=f2e4826]:
                - text: 🔢
                - strong [ref=f2e4827]: Anthropic token-counting endpoint.
                - text: The Anthropic-compatible API now offers a token-counting endpoint, so integrations can check how many input tokens a request will use before sending it.
                - link "Commit" [ref=f2e4828] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/08dacd19da1b0eefd9d274d24ed59ec1e5d5a2de
                - text: ","
                - link "Commit" [ref=f2e4829] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/23062e9fcaace42cf06db33f9533127bbbcd33d9
              - listitem [ref=f2e4833]:
                - text: 🖲️
                - strong [ref=f2e4834]: Terminal instructions read fresh.
                - text: The instructions a terminal server provides are now fetched for each request, so changing them on the server takes effect immediately instead of after re-saving the connection or restarting.
                - link "#27242" [ref=f2e4835] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27242
              - listitem [ref=f2e4839]:
                - text: 🖥️
                - strong [ref=f2e4840]: Live terminal server policies.
                - text: Administrators can now read an orchestrator terminal server's current policy and lifecycle settings directly in connection settings rather than relying on a locally cached copy.
                - link "Commit" [ref=f2e4841] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2f37e853d1259a901f736a823bad29dcc2c3b130
                - text: ","
                - link "Commit" [ref=f2e4842] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/3005b7bc71fcbd5abc6e73c3e4caa4ea781cdb76
              - listitem [ref=f2e4846]:
                - text: 🌍
                - strong [ref=f2e4847]: Model privacy at a glance.
                - text: Admins can now make a model public or private straight from its menu in the model list, where each model is marked as public, shared, or private.
                - link "Commit" [ref=f2e4848] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/fb2ea272952ed96b0db5ac59a861637204100cb6
              - listitem [ref=f2e4852]:
                - text: 📈
                - strong [ref=f2e4853]: Personal usage dashboard.
                - text: A new Usage tab in settings shows your own activity over time, including a token-activity heatmap, current and longest streaks, lifetime and peak token counts, your longest active chat, and your most used models and tools.
                - link "Commit" [ref=f2e4854] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/af9a315ac30b83241f3df5556d7a2abfcd5d25b0
              - listitem [ref=f2e4858]:
                - text: 🧠
                - strong [ref=f2e4859]: Memories in settings.
                - text: Your memories are now listed directly in personalization settings where you can search, add, edit, and remove them, instead of being tucked behind a separate manage dialog.
                - link "Commit" [ref=f2e4860] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/db934a3b4ff16532b48670d7cc75e7048a6db993
              - listitem [ref=f2e4864]:
                - text: 💾
                - strong [ref=f2e4865]: Import notes and automations.
                - text: Notes can now be brought in from text and markdown files, and automations can be exported and imported as files, so you can move them between instances.
                - link "Commit" [ref=f2e4866] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f8350360dfd60ff890b73fe2f39aaf20a52ad28b
                - text: ","
                - link "Commit" [ref=f2e4867] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/2018546a7baeb853bb4d98e2fb2a092ef20aa431
              - listitem [ref=f2e4871]:
                - text: 🧮
                - strong [ref=f2e4872]: Counts in the tabs.
                - text: The workspace tabs now show how many models, knowledge bases, prompts, skills, and tools you have, and the admin tabs do the same for users, groups, leaderboard entries, and feedback, so you can see the size of each section without opening it.
                - link "Commit" [ref=f2e4873] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/05e3f713175c1eea43a99f29521eb01700c21d3c
                - text: ","
                - link "Commit" [ref=f2e4874] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/727041da78bcfcb44c0e4c83c4e6a641b7061b90
                - text: ","
                - link "Commit" [ref=f2e4875] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f8ea15b84a274712dca33daa970f63ed7368043e
              - listitem [ref=f2e4879]:
                - text: 🧾
                - strong [ref=f2e4880]: Group permissions at a glance.
                - text: The groups list now shows whether each group uses custom or default permissions, without opening it.
                - link "Commit" [ref=f2e4881] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ccb1ab7739fbeb77c810036dcac240570034a56a
                - text: ","
                - link "Commit" [ref=f2e4882] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/1d1f60ab440b167b9c6ab8f4011b884caa99f27d
              - listitem [ref=f2e4886]:
                - text: 📤
                - strong [ref=f2e4887]: Streamed file transfers.
                - text: Uploading a model, pipeline or audio file now sends it in chunks instead of holding the whole thing in memory, and reading and writing files no longer blocks other requests, so large transfers no longer spike memory or stall the server.
                - link "Commit" [ref=f2e4888] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/429f2df50cd2f0ec8d0a1bb4136a46e2f94a4bf5
                - text: ","
                - link "#27351" [ref=f2e4889] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27351
                - text: ","
                - link "#27349" [ref=f2e4890] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27349
              - listitem [ref=f2e4894]:
                - text: 🧰
                - strong [ref=f2e4895]: Built-in tool descriptions built once.
                - text: The descriptions handed to the model for the built-in tools are now worked out once at startup rather than rebuilt on every message.
                - link "Commit" [ref=f2e4896] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d727ee4d1febb2b72d5f6c26668c562eadca54f1
                - text: ","
                - link "Commit" [ref=f2e4897] [cursor=pointer]:
