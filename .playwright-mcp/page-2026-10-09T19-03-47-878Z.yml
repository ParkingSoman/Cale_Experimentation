              - listitem [ref=f2e5145]:
                - text: 🔛
                - strong [ref=f2e5146]: Functions can react to being switched on or off.
                - text: Two new events fire just before a function is enabled or disabled, and the function being enabled receives its own event even though it is not active yet, so it can run whatever setup or teardown it needs.
                - link "Commit" [ref=f2e5147] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/94a60b04573acf6423e9c0519997b779f82e0560
                - text: ","
                - link "#26754" [ref=f2e5148] [cursor=pointer]:
