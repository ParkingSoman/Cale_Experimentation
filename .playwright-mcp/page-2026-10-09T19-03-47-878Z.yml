              - listitem [ref=f2e5478]:
                - text: ➡️
                - strong [ref=f2e5479]: Prompts opened from a link.
                - text: A prompt passed in through a link that sends automatically now waits for tool servers to finish loading, so external tools are available on that first message instead of the model reporting it has none.
                - link "Commit" [ref=f2e5480] [cursor=pointer]:
