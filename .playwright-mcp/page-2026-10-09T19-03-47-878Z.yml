                - link "#26748" [ref=f2e5149] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/discussions/26748
              - listitem [ref=f2e5153]:
                - text: 🔛
                - strong [ref=f2e5154]: Multiple choice settings in plugins.
                - text: A tool or function can now offer a setting where you tick several options from a list, fixed or worked out at the time it is shown, instead of asking you to type a comma-separated list of allowed values.
                - link "#26884" [ref=f2e5155] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/26884
                - text: ","
                - link "#26848" [ref=f2e5156] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26848
              - listitem [ref=f2e5160]:
                - text: 🔌
                - strong [ref=f2e5161]: Disable plugins entirely.
                - text: Administrators can now completely turn off the built-in Tools and Functions plugin surfaces through a new "ENABLE_PLUGINS" setting, which hides them across the workspace and admin areas and removes their execution paths.
                - link "Commit" [ref=f2e5162] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/bd6e0b61c2ae073aba9556ae46c345f4749acb84
                - text: ","
                - link "Commit" [ref=f2e5163] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8e46450acd7ae11a4dee166d19a7c9833d991e79
                - text: ","
                - link "Commit" [ref=f2e5164] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/951f96021a970fbd4837a4ee441565c0cf3d2824
                - text: ","
                - link "Commit" [ref=f2e5165] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/252e6fd855099e1c880f4def18aa09aedbe1733a
              - listitem [ref=f2e5169]:
                - text: 🧵
                - strong [ref=f2e5170]: Lighter chat listings and search.
                - text: Building a page of chat search results or a folder listing no longer copies each full conversation to read its title and dates, so those pages come together faster and use far less memory while they are built.
                - link "#27388" [ref=f2e5171] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27388
              - listitem [ref=f2e5175]:
                - text: 📮
                - strong [ref=f2e5176]: Name lookups off the thread pool.
                - text: Looking up a hostname no longer occupies one of the limited threads shared by every other piece of blocking work, so model calls, searches, page fetches and tool calls stop queueing behind each other once a few lookups are slow.
                - link "#27440" [ref=f2e5177] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27440
              - listitem [ref=f2e5181]:
                - text: 🥬
                - strong [ref=f2e5182]: Faster web page parsing.
                - text: Pages pulled in by web search and web retrieval are now read with a faster parser, cutting roughly a tenth off the time spent on a ten result search.
                - link "#27439" [ref=f2e5183] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27439
              - listitem [ref=f2e5187]:
                - text: 🧭
                - strong [ref=f2e5188]: No pointless lookups when filtering search results.
                - text: Filtering web search results against a domain list no longer resolves every result to an address first, which had turned a three second search into half a minute wherever the resolver was slow or a name did not resolve.
                - link "Commit" [ref=f2e5189] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/42ea8a5a2f04b6a57ccb47a61611a62479b60b78
                - text: ","
                - link "#26920" [ref=f2e5190] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26920
              - listitem [ref=f2e5194]:
                - text: 🚄
                - strong [ref=f2e5195]: Leaner passthrough streaming.
                - text: Responses the server only relays now go straight through in whole network reads instead of being split line by line, roughly halving the work spent shuttling a streamed reply on those routes.
                - link "#27384" [ref=f2e5196] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27384
              - listitem [ref=f2e5200]:
                - text: 🧶
                - strong [ref=f2e5201]: Web page parsing off the critical path.
                - text: Reading those pages no longer holds up everything else on the server, so other people's replies, live updates and health checks keep flowing during a search instead of stalling for a second or more.
                - link "#27446" [ref=f2e5202] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27446
              - listitem [ref=f2e5206]:
                - text: 🈶
                - strong [ref=f2e5207]: Faster uploads of non-English text files.
                - text: Working out the encoding of an uploaded text file now samples the part that needs it rather than scanning the whole file, taking a four megabyte Japanese or Chinese document from several seconds down to well under one.
                - link "#27445" [ref=f2e5208] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27445
              - listitem [ref=f2e5212]:
                - text: ♿
                - strong [ref=f2e5213]: Improved UI accessibility.
                - text: Keyboard and screen reader users can now tell which chat in the sidebar is the one being viewed, open reasoning and detail blocks in a response, expand sidebar sections and open a folder without a mouse, sort the admin user list from the keyboard and hear which column it is sorted by, open a dropdown and its submenus with the keyboard, close them again with Escape and land back where they started, hear which value a dropdown is set to rather than only its label, hear what each admin settings switch, group permission toggle, checkbox, API key field and advanced model parameter slider controls, have the message box announced by its placeholder instead of as an unnamed field, press Enter on Cancel in a confirmation dialog without triggering the delete, reach the regenerate control, jump straight past the sidebar to the conversation with a skip link, hear what an icon-only button does across chat, calls, file previews, modals and the admin pages rather than an unlabelled button, placeholder text, section headings, field descriptions, inactive tab labels, timestamps, counters and icons are now readable against their background when High Contrast Mode is on, and sidebar buttons across notes, automations, the playground, and admin pages announce whether they open or close the sidebar.
                - link "#27510" [ref=f2e5214] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/27510
