              - listitem [ref=f2e1867]:
                - text: 🔌
                - strong [ref=f2e1868]: Disconnect OAuth only where there is OAuth.
                - text: The disconnect control on a tool server reached over MCP now appears only where that server signs in through OAuth and an account is connected, rather than on servers that use no sign-in at all.
