              - listitem [ref=f2e5564]:
                - text: 💭
                - strong [ref=f2e5565]: Reasoning that arrives late or empty.
                - text: Reasoning sent by a provider after the answer has started is now shown in its proper place above the answer rather than appended after it, and reasoning notes carrying nothing no longer open an empty thinking block.
                - link "Commit" [ref=f2e5566] [cursor=pointer]:
