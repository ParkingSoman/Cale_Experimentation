              - listitem [ref=f2e3246]:
                - text: 🗑️
                - strong [ref=f2e3247]: Delete offered only when allowed.
                - text: The chat deletion controls in the sidebar, the chat menu, search, archived chats, and data controls no longer appear for people whose permissions do not allow deleting, where using them produced an access denied error.
