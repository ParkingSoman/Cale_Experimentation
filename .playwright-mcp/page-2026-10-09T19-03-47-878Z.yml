              - listitem [ref=f2e1829]:
                - text: ♿
                - strong [ref=f2e1830]: Accessibility mode reaches the menus.
                - text: Accessibility mode now marks the menu entry you are pointing at and the model already chosen with a stronger background, across the dropdown menus, their submenus, and the model picker together with its filter and compare controls, so those cues carry the contrast the accessibility guidelines ask for in both themes.
                - link "Commit" [ref=f2e1831] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a6f9751401589ee73208295b6f6a7f6eae9c1b44
                - text: ","
                - link "Commit" [ref=f2e1832] [cursor=pointer]:
