                - text: ","
                - link "Commit" [ref=f2e2550] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c1f914a6268580f7722825390ac8a204743a4520
              - listitem [ref=f2e2554]:
                - text: 📽️
                - strong [ref=f2e2555]: Truer PowerPoint previews.
                - text: Slide previews now render tables, charts, connectors, gradients, theme colours, bullets, fonts, and text alignment far closer to the original, and the viewer lets you move between slides with the arrow keys or the scroll wheel while the thumbnail strip follows along.
                - link "Commit" [ref=f2e2556] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8dd23f74c9a59fdfbdaefb4a403ef79bdd3dfed9
