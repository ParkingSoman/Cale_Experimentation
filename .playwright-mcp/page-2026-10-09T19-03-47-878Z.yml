              - listitem [ref=f2e5600]:
                - text: ⏸️
                - strong [ref=f2e5601]: Deleting while a reply is being written.
                - text: The delete control is now hidden on messages while a response is generating or a task is running, so a conversation can no longer be left with the finished reply detached from the messages before it.
