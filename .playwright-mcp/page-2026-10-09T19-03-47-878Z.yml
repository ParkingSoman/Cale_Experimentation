              - listitem [ref=f2e2568]:
                - text: 📄
                - strong [ref=f2e2569]: Faithful Word document previews.
                - text: Word documents now open as proper pages with headers, footers, footnotes, and embedded images intact, and can be zoomed, rather than being flattened into plain formatted text.
                - link "Commit" [ref=f2e2570] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/ff7467b4c593f1e775311c088c63340d0cc1e4a2
                - text: ","
                - link "Commit" [ref=f2e2571] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/060648f939447e2a9de390d05221ca896c50eeed
              - listitem [ref=f2e2575]:
                - text: 🗝
                - strong [ref=f2e2576]: Deleting your API key.
                - text: An API key can now be revoked outright from your account settings, where the only way to retire one was to replace it with a new one.
                - link "#28874" [ref=f2e2577] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/28874
                - text: ","
                - link "Commit" [ref=f2e2578] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/b30b11d4c975b8ff9a6c6eb9e39fbb310aed1072
              - listitem [ref=f2e2582]:
                - text: 🎛️
                - strong [ref=f2e2583]: Settings for the task model.
                - text: Administrators can now set the generation parameters used for background work such as titles, tags, follow-ups, search queries, and conversation summaries, either from the admin panel or through "TASK_MODEL_PARAMS", instead of those requests always using a fixed token limit that could cut a summary short.
                - link "#27604" [ref=f2e2584] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/27604
                - text: ","
                - link "Commit" [ref=f2e2585] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/f0bfcd40976dfb1e1876f86b39d6a659d894d15e
                - text: ","
                - link "Commit" [ref=f2e2586] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/865c80c1600ecc2e606bef4e90540ce305b4b9de
              - listitem [ref=f2e2590]:
                - text: 🎚️
                - strong [ref=f2e2591]: Default interface settings for everyone.
                - text: Administrators can now set system-wide defaults for the interface options in Settings, either from the admin panel or through "DEFAULT_INTERFACE_SETTINGS", with each person's own choices still taking precedence and anything left untouched shown as inherited and kept in step with later changes to the defaults.
                - link "Commit" [ref=f2e2592] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/37f2548155efdd5cd8114ceb9b57c7864de4bef2
