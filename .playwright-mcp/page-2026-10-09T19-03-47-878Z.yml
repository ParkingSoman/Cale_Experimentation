              - listitem [ref=f2e1935]:
                - text: 🔤
                - strong [ref=f2e1936]: Choice of interface font.
                - text: Interface settings now offer a font family field where you can name a font installed on your computer and watch it apply across the interface as you type, with an empty field returning to the standard font.
                - link "Commit" [ref=f2e1937] [cursor=pointer]:
