                - strong [ref=f2e5622]: Chats past the first sixty in a folder.
                - text: Folder listings now page through every chat instead of stopping at a fixed limit, so older chats no longer appear to vanish from a folder once it grows past sixty.
                - link "#26786" [ref=f2e5623] [cursor=pointer]:
