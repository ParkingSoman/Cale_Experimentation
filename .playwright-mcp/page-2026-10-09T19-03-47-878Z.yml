              - listitem [ref=f2e1576]:
                - text: 🔗
                - strong [ref=f2e1577]: Cancelled edits keep attachments.
                - text: Cancelling the edit of a message no longer strips the files attached to it, where dropping the edit took the attachments down with it.
                - link "#30281" [ref=f2e1578] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30281
                - text: ","
                - link "#30192" [ref=f2e1579] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30192
              - listitem [ref=f2e1583]:
                - text: 🏎️
                - strong [ref=f2e1584]: Faster media page reads.
                - text: The browser-driven loader pulled every image, video and font a page referenced down through the server before any text was extracted, so a page carrying a few dozen audio players took ten seconds or timed out. Those requests are now dropped before they are made, and the same page comes back in under three seconds, having pulled 4 MB where it used to pull 55.
                - link "#29742" [ref=f2e1585] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29742
                - text: ","
                - link "#29741" [ref=f2e1586] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29741
              - listitem [ref=f2e1590]:
                - text: 📝
                - strong [ref=f2e1591]: Starting a note from search.
                - text: Starting a note from the search box now works when you are already on the notes page, keeps the whole of what you typed including characters such as ampersands and hashes, and no longer makes a further note each time the browser back button is pressed.
                - link "#29645" [ref=f2e1592] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29645
                - text: ","
                - link "#29642" [ref=f2e1593] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29642
              - listitem [ref=f2e1597]:
                - text: 📱
                - strong [ref=f2e1598]: Apple device replies.
                - text: An assistant reply no longer comes up blank in a home screen app, an in-app browser or a desktop-class window on Apple devices, where the check that avoided the drawing fault only recognised Safari itself.
                - link "#29734" [ref=f2e1599] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29734
                - text: ","
                - link "#29688" [ref=f2e1600] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29688
                - text: ","
                - link "#26712" [ref=f2e1601] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/26712
              - listitem [ref=f2e1605]:
                - text: 📊
                - strong [ref=f2e1606]: Single source relevance.
                - text: A reply drawing on a single source now shows how relevant that source is, where the figure appeared only once a second source joined it and so looked as though it came and went.
                - link "#29647" [ref=f2e1607] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29647
                - text: ","
                - link "#29646" [ref=f2e1608] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29646
              - listitem [ref=f2e1612]:
                - text: 🔧
                - strong [ref=f2e1613]: Arduino sketches upload to knowledge.
                - text: A sketch file now reaches the plain text reader like the C++ and header files beside it, rather than being handed to a document extraction server that could make nothing of it and failing the upload.
                - link "#29673" [ref=f2e1614] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29673
                - text: ","
                - link "#29670" [ref=f2e1615] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29670
              - listitem [ref=f2e1619]:
                - text: 📰
                - strong [ref=f2e1620]: Docling conversion failures.
                - text: A file that Docling refuses or fails to convert now fails the upload with the reason Docling gave, rather than breaking with a raw error or quietly filing a placeholder that was then indexed and handed to the model in place of the file.
                - link "#30107" [ref=f2e1621] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30107
                - text: ","
                - link "#29808" [ref=f2e1622] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29808
              - listitem [ref=f2e1626]:
                - text: 📄
                - strong [ref=f2e1627]: Uploaded text kept as written.
                - text: A file whose text contains escape sequences such as the one standing for a non-breaking space is now stored and read by the model exactly as it was written, rather than having some of them rewritten depending on where in the file they sat.
                - link "#29736" [ref=f2e1628] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29736
                - text: ","
                - link "#29732" [ref=f2e1629] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29732
              - listitem [ref=f2e1633]:
                - text: 🔦
                - strong [ref=f2e1634]: Readable slash command labels.
                - text: The entries in the slash command menu no longer show as white text on a white background in the light theme.
                - link "#29512" [ref=f2e1635] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29512
                - text: ","
                - link "#29510" [ref=f2e1636] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29510
              - listitem [ref=f2e1640]:
                - text: ⌨️
                - strong [ref=f2e1641]: Literal arrow sequences.
                - text: A sequence such as three hyphens after a less-than sign is now shown as the characters it is made of rather than drawn as an arrow, which had text look changed when it never was.
                - link "#29595" [ref=f2e1642] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29595
                - text: ","
                - link "#29594" [ref=f2e1643] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29594
              - listitem [ref=f2e1647]:
                - text: 🖌️
                - strong [ref=f2e1648]: Editing an image you uploaded.
                - text: An image already held by Open WebUI can now be used with image editing, where fetching its own link back over the network could fail on a private network or without a sign-in.
                - link "Commit" [ref=f2e1649] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/50413f34824ea49d5b94d3a97f3fe4bb2e881e38
              - listitem [ref=f2e1653]:
                - text: 🖼
                - strong [ref=f2e1654]: Playground image edits.
                - text: Editing an image in the Images playground now works, where every attempt came back rejected since the request carried its fields under a heading the endpoint never read.
                - link "Commit" [ref=f2e1655] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c07fa08b995e8d1a1fc2d94a88d8cea691bdc5ee
              - listitem [ref=f2e1659]:
                - text: 🎨
                - strong [ref=f2e1660]: A tidier attach webpage dialog.
                - text: The row holding the Add button no longer carries a grey band of its own between the address box and the button, matching every other dialog.
                - link "#29664" [ref=f2e1661] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29664
                - text: ","
                - link "#29663" [ref=f2e1662] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29663
              - listitem [ref=f2e1666]:
                - text: 🖱️
                - strong [ref=f2e1667]: A plain note date.
                - text: The date under a note title no longer shows a pointing hand or announces itself as something to press, having never done anything when clicked.
                - link "#29708" [ref=f2e1668] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29708
              - listitem [ref=f2e1672]:
                - text: 🌇
                - strong [ref=f2e1673]: Folder backgrounds on creation.
                - text: The background image picked in the Create Folder dialog now arrives on the folder when it is created from the sidebar, where the image was discarded unless the dialog was opened from an existing folder.
                - link "#30218" [ref=f2e1674] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30218
                - text: ","
                - link "#30217" [ref=f2e1675] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30217
              - listitem [ref=f2e1679]:
                - text: 🖇
                - strong [ref=f2e1680]: Delete Chat shortcut everywhere.
                - text: The keyboard shortcut that deletes the open chat now works wherever the chat was opened from, where it did nothing unless the chat's row happened to be on screen in the sidebar at that moment.
                - link "#30165" [ref=f2e1681] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30165
                - text: ","
                - link "#30164" [ref=f2e1682] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30164
              - listitem [ref=f2e1686]:
                - text: 🚮
                - strong [ref=f2e1687]: Retired chat variables.
                - text: A model whose system prompt no longer declares a variable a previous prompt did stops asking for it, where every new chat kept opening the dialog and refusing to send until a value was entered.
                - link "#30173" [ref=f2e1688] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30173
                - text: ","
                - link "#30172" [ref=f2e1689] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/30172
              - listitem [ref=f2e1693]:
                - text: 👁️
                - strong [ref=f2e1694]: Compact hover previews in Safari.
                - text: Holding over a chat in the sidebar shows the small preview every other browser shows, rather than one laid out at the width and spacing of a full conversation.
                - link "#29734" [ref=f2e1695] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29734
              - listitem [ref=f2e1699]:
                - text: 🔖
                - strong [ref=f2e1700]: Visible title generation faults.
                - text: When a new chat's automatic title cannot be generated, the reason now reaches the log at the default level, rather than only under debug logging where a broken feature looked the same as a switched-off one.
                - link "#30106" [ref=f2e1701] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/30106
                - text: ","
                - link "#29533" [ref=f2e1702] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/issues/29533
          - generic [ref=f2e1703]:
            - generic [ref=f2e1704]: changed
            - generic [ref=f2e1705]:
              - listitem [ref=f2e1709]:
                - text: 🪶
                - strong [ref=f2e1710]: Slim starts with nothing configured.
                - text: The slim image leaves out the local models and the libraries around them, and still starts and holds a conversation on its defaults; the features that leaned on those models each need an external service of their own.
                - link "Commit" [ref=f2e1711] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
              - listitem [ref=f2e1715]:
                - text: 🗄️
                - strong [ref=f2e1716]: Slim database support.
                - text: The slim image runs on SQLite, its default, or on PostgreSQL; pointed at MySQL, MariaDB or another engine, or started with AWS RDS IAM logins switched on, it stops with an error instead of starting, and those deployments need the standard image.
                - link "Commit" [ref=f2e1717] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d27aa72ab4a7b5632b4ad49e8467081ad3d7ebb4
              - listitem [ref=f2e1721]:
                - text: 📁
                - strong [ref=f2e1722]: Slim file storage.
                - text: The slim image keeps files on local storage, its default; configured for an S3, Google Cloud or Azure bucket, it stops with an error instead of starting, and those deployments need the standard image.
                - link "Commit" [ref=f2e1723] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d27aa72ab4a7b5632b4ad49e8467081ad3d7ebb4
              - listitem [ref=f2e1727]:
                - text: 🧮
                - strong [ref=f2e1728]: Slim searches only through pgvector.
                - text: Knowledge search on the slim image needs PostgreSQL with pgvector, and configured for another vector store the instance still starts, and the failure arrives the first time something is searched rather than at startup.
                - link "Commit" [ref=f2e1729] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
                - text: ","
                - link "Commit" [ref=f2e1730] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d27aa72ab4a7b5632b4ad49e8467081ad3d7ebb4
              - listitem [ref=f2e1734]:
                - text: 🧠
                - strong [ref=f2e1735]: Slim embedding requirements.
                - text: The slim image carries no embedding or reranking model, so knowledge needs OpenAI, Ollama or Azure OpenAI embeddings and an external reranker, falling back to plain cosine scoring where none is set.
                - link "Commit" [ref=f2e1736] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
              - listitem [ref=f2e1740]:
                - text: ✂️
                - strong [ref=f2e1741]: Slim document splitting.
                - text: Splitting a document along a downloaded tokenizer is unavailable on the slim image, which leaves splitting by character or by token count.
                - link "Commit" [ref=f2e1742] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
              - listitem [ref=f2e1746]:
                - text: 📃
                - strong [ref=f2e1747]: Slim document readers.
                - text: The slim image reads text, Markdown, CSV, HTML and XML files as they are; uploading a PDF, a Word file or a presentation fails unless one of the external document extractors is configured.
                - link "Commit" [ref=f2e1748] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
              - listitem [ref=f2e1752]:
                - text: 🎙️
                - strong [ref=f2e1753]: Slim speech requirements.
                - text: The slim image carries neither local Whisper nor local voices, so speech to text and text to speech need an external engine before they will work.
                - link "Commit" [ref=f2e1754] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
              - listitem [ref=f2e1758]:
                - text: 🕸️
                - strong [ref=f2e1759]: Slim web page fetching.
                - text: The slim image carries no headless browser, so a web page is fetched over plain HTTP or through an external loader, and a page that draws itself with JavaScript comes back with less of its content than on the standard image.
                - link "Commit" [ref=f2e1760] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/cb942bb94c8dc7941336088fb3392e2398ff56c1
                - text: ","
                - link "Commit" [ref=f2e1761] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/d27aa72ab4a7b5632b4ad49e8467081ad3d7ebb4
              - listitem [ref=f2e1765]:
                - text: 🔎
                - strong [ref=f2e1766]: Slim leaves out DDGS.
                - text: DDGS, the metasearch provider that needs no key of its own, is not carried in the slim image, so web search there needs a provider with a key.
                - link "Commit" [ref=f2e1767] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/0fa4dea5ff64ea663f162d07c9a1175c39e4aad0
              - listitem [ref=f2e1771]:
                - text: 📥
                - strong [ref=f2e1772]: Slim code interpreter packages.
                - text: The slim image leaves out the code interpreter's packages, so the browser fetches numpy, pandas, matplotlib, scikit-learn and the rest from "cdn.jsdelivr.net" and the interpreter stops working where that is blocked.
                - link "Commit" [ref=f2e1773] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/98fcb844e1b19f7dd6289af26273cdec5447dc52
              - listitem [ref=f2e1777]:
                - text: 🧰
                - strong [ref=f2e1778]: Slim git requirements.
                - text: The slim image no longer carries git, so a tool or function whose requirements point at a "git+https://" address fails to install and needs the standard image or a published package.
                - link "Commit" [ref=f2e1779] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/30eed1251301f74e0dfeaad09c41e81320f790fc
              - listitem [ref=f2e1783]:
                - text: 🧺
                - strong [ref=f2e1784]: LangChain community removal.
                - text: The readers for text, HTML, Word, CSV, PDF and Azure Document Intelligence are now written here rather than taken from "langchain-community", which is no longer installed; a tool or function importing it has to name it in its own requirements from now on.
                - link "Commit" [ref=f2e1785] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/05484aa055a868a49842e1ddff169c19c98b755b
              - listitem [ref=f2e1789]:
                - text: 🧾
                - strong [ref=f2e1790]: Undeclared package imports.
                - text: Packages that sat in the image only by accident, among them nltk, pymongo, the Google Drive client and the Gemini SDK, are no longer installed, so a tool or function importing one must name it in its own requirements.
                - link "#29725" [ref=f2e1791] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29725
                - text: ","
                - link "#29726" [ref=f2e1792] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29726
                - text: ","
                - link "Commit" [ref=f2e1793] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/a1c02098aa2687c72482a59117efe643b785df51
              - listitem [ref=f2e1797]:
                - text: 🆔
                - strong [ref=f2e1798]: Model ID whitespace.
                - text: A workspace model whose ID contains a space or a tab is now refused in the editor, through the API and on import; one already stored goes on answering but cannot be saved again until it is recreated.
                - link "Commit" [ref=f2e1799] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/8a19e2f867063256bb2836649e2fe80af41ef748
              - listitem [ref=f2e1803]:
                - text: 🖇️
                - strong [ref=f2e1804]: Link scheme rendering.
                - text: "A link in a reply, a citation or a web search result is now rendered only where it points at a web address, a mail address, a telephone number or somewhere inside this instance; anything else, an \"ftp://\" address or an application link such as \"obsidian://\" or \"vscode://\" among them, is shown as the text it is. Two old oddities go with it: a source written as \"HTTP://\" now becomes a link, and a filename merely containing the letters http no longer becomes one that leads nowhere."
                - link "#29890" [ref=f2e1805] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/pull/29890
              - listitem [ref=f2e1809]:
                - text: 🧲
                - strong [ref=f2e1810]: Integrations tab is opt-in.
                - text: The Integrations tab in personal settings, where tool and terminal connections of your own are managed, is now hidden until an administrator turns on Direct Integrations under Integrations or sets "ENABLE_DIRECT_INTEGRATIONS", and hiding it leaves existing connections working.
                - link "Commit" [ref=f2e1811] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/6d8e63e3666e1b1aa5540ffda0816be5f40c5271
                - text: ","
                - link "Commit" [ref=f2e1812] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/c82634b9d01adadbf9780ff84a0a8168fdc4fdea
              - listitem [ref=f2e1816]:
                - text: 📡
                - strong [ref=f2e1817]: Image connection check endpoint.
                - text: The endpoint that checks an image generation connection has moved and now takes the connection to test in the request itself, so anything calling the old address needs updating.
                - link "Commit" [ref=f2e1818] [cursor=pointer]:
                  - /url: https://github.com/open-webui/open-webui/commit/64bbdf7a73724986fac8bcf6e880fe32ef9ac495
